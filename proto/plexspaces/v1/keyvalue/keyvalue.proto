// PlexSpaces KeyValue Store API
//
// ## Purpose
// Provides gRPC service for key-value storage operations with multi-tenancy support.
// This service exposes the KeyValueStore trait functionality via gRPC.
//
// ## Architecture Context
// This proto file provides the gRPC API for the KeyValueStore trait defined in
// crates/keyvalue/src/lib.rs. All operations support tenant and namespace isolation.
//
// ## Design Decisions
// - **Tenant Isolation**: All operations require tenant_id (from RequestContext)
// - **Namespace Support**: Optional namespace for logical grouping within tenant
// - **Proto-First**: All operations defined in proto for type safety
// - **RequestContext**: All operations use RequestContext for tenant/namespace/user_id

syntax = "proto3";

package plexspaces.keyvalue.v1;

import "buf/validate/validate.proto";
import "google/api/annotations.proto";
import "google/api/field_behavior.proto";
import "google/protobuf/duration.proto";
import "plexspaces/v1/common.proto";

option go_package = "github.com/bhatti/plexspaces/gen/go/plexspaces/v1/keyvalue/keyvalue;plexspaces_keyvalue_v1";
option java_multiple_files = true;
option java_package = "com.bhatti.plexspaces.keyvalue.v1";

// KeyValue service for key-value storage operations
service KeyValueService {
  // Get value by key
  rpc Get(GetRequest) returns (GetResponse) {
    option (google.api.http) = {get: "/api/v1/keyvalue/{key}"};
  }

  // Put key-value pair
  rpc Put(PutRequest) returns (PutResponse) {
    option (google.api.http) = {
      put: "/api/v1/keyvalue/{key}"
      body: "*"
    };
  }

  // Delete key
  rpc Delete(DeleteRequest) returns (DeleteResponse) {
    option (google.api.http) = {delete: "/api/v1/keyvalue/{key}"};
  }

  // Check if key exists
  rpc Exists(ExistsRequest) returns (ExistsResponse) {
    option (google.api.http) = {get: "/api/v1/keyvalue/{key}:exists"};
  }

  // List all keys with prefix
  rpc List(ListRequest) returns (ListResponse) {
    option (google.api.http) = {get: "/api/v1/keyvalue"};
  }

  // Get multiple keys at once
  rpc MultiGet(MultiGetRequest) returns (MultiGetResponse) {
    option (google.api.http) = {
      post: "/api/v1/keyvalue:multiGet"
      body: "*"
    };
  }

  // Put multiple key-value pairs
  rpc MultiPut(MultiPutRequest) returns (MultiPutResponse) {
    option (google.api.http) = {
      post: "/api/v1/keyvalue:multiPut"
      body: "*"
    };
  }

  // Put with time-to-live
  rpc PutWithTtl(PutWithTtlRequest) returns (PutWithTtlResponse) {
    option (google.api.http) = {
      post: "/api/v1/keyvalue/{key}:putWithTtl"
      body: "*"
    };
  }

  // Refresh TTL for existing key
  rpc RefreshTtl(RefreshTtlRequest) returns (RefreshTtlResponse) {
    option (google.api.http) = {
      post: "/api/v1/keyvalue/{key}:refreshTtl"
      body: "*"
    };
  }

  // Get TTL remaining for key
  rpc GetTtl(GetTtlRequest) returns (GetTtlResponse) {
    option (google.api.http) = {get: "/api/v1/keyvalue/{key}/ttl"};
  }

  // Compare-and-swap
  rpc Cas(CasRequest) returns (CasResponse) {
    option (google.api.http) = {
      post: "/api/v1/keyvalue/{key}:cas"
      body: "*"
    };
  }

  // Atomic increment
  rpc Increment(IncrementRequest) returns (IncrementResponse) {
    option (google.api.http) = {
      post: "/api/v1/keyvalue/{key}:increment"
      body: "*"
    };
  }

  // Atomic decrement
  rpc Decrement(DecrementRequest) returns (DecrementResponse) {
    option (google.api.http) = {
      post: "/api/v1/keyvalue/{key}:decrement"
      body: "*"
    };
  }

  // Clear all keys with prefix
  rpc ClearPrefix(ClearPrefixRequest) returns (ClearPrefixResponse) {
    option (google.api.http) = {delete: "/api/v1/keyvalue:clearPrefix"};
  }

  // Count keys with prefix
  rpc CountPrefix(CountPrefixRequest) returns (CountPrefixResponse) {
    option (google.api.http) = {get: "/api/v1/keyvalue:countPrefix"};
  }

  // Get storage statistics
  rpc GetStats(GetStatsRequest) returns (GetStatsResponse) {
    option (google.api.http) = {get: "/api/v1/keyvalue/stats"};
  }
}

// Get request
message GetRequest {
  // Key to get
  string request_id = 1 [(buf.validate.field).string.max_len = 40];
  string key = 2 [
    (google.api.field_behavior) = REQUIRED,
    (buf.validate.field).string = {
      min_len: 1
      max_len: 1024
    }
  ];

  // Namespace for tenant isolation (optional; empty string = default).
  // Tenant-id comes from auth (JWT/mTLS), not from this request.
  string namespace = 3;
}

// Get response
message GetResponse {
  // Value if key exists
  string request_id = 1 [(buf.validate.field).string.max_len = 40];
  bytes value = 2;

  // Whether key exists
  bool exists = 3;
}

// Put request
message PutRequest {
  // Key to put
  string request_id = 1 [(buf.validate.field).string.max_len = 40];
  string key = 2 [
    (google.api.field_behavior) = REQUIRED,
    (buf.validate.field).string = {
      min_len: 1
      max_len: 1024
    }
  ];

  // Value to store
  bytes value = 3 [(google.api.field_behavior) = REQUIRED];

  // Namespace for tenant isolation (optional; empty string = default).
  // Tenant-id comes from auth (JWT/mTLS), not from this request.
  string namespace = 4;
}

// Put response
message PutResponse {
  // Success flag
  string request_id = 1 [(buf.validate.field).string.max_len = 40];
  bool success = 2;
}

// Delete request
message DeleteRequest {
  // Key to delete
  string request_id = 1 [(buf.validate.field).string.max_len = 40];
  string key = 2 [
    (google.api.field_behavior) = REQUIRED,
    (buf.validate.field).string = {
      min_len: 1
      max_len: 1024
    }
  ];

  // Namespace for tenant isolation (optional; empty string = default).
  // Tenant-id comes from auth (JWT/mTLS), not from this request.
  string namespace = 3;
}

// Delete response
message DeleteResponse {
  // Whether key was deleted (false if key didn't exist)
  string request_id = 1 [(buf.validate.field).string.max_len = 40];
  bool deleted = 2;
}

// Exists request
message ExistsRequest {
  // Key to check
  string request_id = 1 [(buf.validate.field).string.max_len = 40];
  string key = 2 [
    (google.api.field_behavior) = REQUIRED,
    (buf.validate.field).string = {
      min_len: 1
      max_len: 1024
    }
  ];

  // Namespace for tenant isolation (optional; empty string = default).
  // Tenant-id comes from auth (JWT/mTLS), not from this request.
  string namespace = 3;
}

// Exists response
message ExistsResponse {
  // Whether key exists
  string request_id = 1 [(buf.validate.field).string.max_len = 40];
  bool exists = 2;
}

// List request
message ListRequest {
  // Prefix to list keys with
  string request_id = 1 [(buf.validate.field).string.max_len = 40];
  string prefix = 2 [
    (google.api.field_behavior) = REQUIRED,
    (buf.validate.field).string.max_len = 1024
  ];

  // Namespace for tenant isolation (optional; empty string = default).
  // Tenant-id comes from auth (JWT/mTLS), not from this request.
  string namespace = 3;
}

// List response
message ListResponse {
  // List of keys matching prefix
  string request_id = 1 [(buf.validate.field).string.max_len = 40];
  repeated string keys = 2;
}

// MultiGet request
message MultiGetRequest {
  // Keys to get
  string request_id = 1 [(buf.validate.field).string.max_len = 40];
  repeated string keys = 2 [
    (google.api.field_behavior) = REQUIRED,
    (buf.validate.field).repeated = {
      min_items: 1
      max_items: 1000
      items: {
        string: {
          min_len: 1
          max_len: 1024
        }
      }
    }
  ];

  // Namespace for tenant isolation (optional; empty string = default).
  // Tenant-id comes from auth (JWT/mTLS), not from this request.
  string namespace = 3;
}

// MultiGet response
message MultiGetResponse {
  // Values (same order as request, None for missing keys)
  string request_id = 1 [(buf.validate.field).string.max_len = 40];
  repeated KeyValueEntry entries = 2;
}

// Key-value entry
message KeyValueEntry {
  // Key
  string key = 1;

  // Value if exists
  bytes value = 2;

  // Whether key exists
  bool exists = 3;
}

// MultiPut request
message MultiPutRequest {
  // Key-value pairs to put
  string request_id = 1 [(buf.validate.field).string.max_len = 40];
  repeated KeyValuePair pairs = 2 [
    (google.api.field_behavior) = REQUIRED,
    (buf.validate.field).repeated = {
      min_items: 1
      max_items: 1000
    }
  ];

  // Namespace for tenant isolation (optional; empty string = default).
  // Tenant-id comes from auth (JWT/mTLS), not from this request.
  string namespace = 3;
}

// Key-value pair
message KeyValuePair {
  // Key
  string key = 1 [
    (google.api.field_behavior) = REQUIRED,
    (buf.validate.field).string = {
      min_len: 1
      max_len: 1024
    }
  ];

  // Value
  bytes value = 2 [(google.api.field_behavior) = REQUIRED];
}

// MultiPut response
message MultiPutResponse {
  // Success flag
  string request_id = 1 [(buf.validate.field).string.max_len = 40];
  bool success = 2;
}

// PutWithTtl request
message PutWithTtlRequest {
  // Key to put
  string request_id = 1 [(buf.validate.field).string.max_len = 40];
  string key = 2 [
    (google.api.field_behavior) = REQUIRED,
    (buf.validate.field).string = {
      min_len: 1
      max_len: 1024
    }
  ];

  // Value to store
  bytes value = 3 [(google.api.field_behavior) = REQUIRED];

  // Time-to-live
  google.protobuf.Duration ttl = 4 [
    (google.api.field_behavior) = REQUIRED,
    (buf.validate.field).duration = {
      gte: {seconds: 1}
      lte: {seconds: 2592000}
    } /* 1s to 30 days */
  ];

  // Namespace for tenant isolation (optional; empty string = default).
  // Tenant-id comes from auth (JWT/mTLS), not from this request.
  string namespace = 5;
}

// PutWithTtl response
message PutWithTtlResponse {
  // Success flag
  string request_id = 1 [(buf.validate.field).string.max_len = 40];
  bool success = 2;
}

// RefreshTtl request
message RefreshTtlRequest {
  // Key to refresh
  string request_id = 1 [(buf.validate.field).string.max_len = 40];
  string key = 2 [
    (google.api.field_behavior) = REQUIRED,
    (buf.validate.field).string = {
      min_len: 1
      max_len: 1024
    }
  ];

  // New TTL
  google.protobuf.Duration ttl = 3 [
    (google.api.field_behavior) = REQUIRED,
    (buf.validate.field).duration = {
      gte: {seconds: 1}
      lte: {seconds: 2592000}
    } /* 1s to 30 days */
  ];

  // Namespace for tenant isolation (optional; empty string = default).
  // Tenant-id comes from auth (JWT/mTLS), not from this request.
  string namespace = 4;
}

// RefreshTtl response
message RefreshTtlResponse {
  // Success flag
  string request_id = 1 [(buf.validate.field).string.max_len = 40];
  bool success = 2;
}

// GetTtl request
message GetTtlRequest {
  // Key to check
  string request_id = 1 [(buf.validate.field).string.max_len = 40];
  string key = 2 [
    (google.api.field_behavior) = REQUIRED,
    (buf.validate.field).string = {
      min_len: 1
      max_len: 1024
    }
  ];

  // Namespace for tenant isolation (optional; empty string = default).
  // Tenant-id comes from auth (JWT/mTLS), not from this request.
  string namespace = 3;
}

// GetTtl response
message GetTtlResponse {
  // TTL remaining if key exists with TTL
  string request_id = 1 [(buf.validate.field).string.max_len = 40];
  google.protobuf.Duration ttl = 2;

  // Whether key exists
  bool exists = 3;
}

// Cas request
message CasRequest {
  // Key for CAS operation
  string request_id = 1 [(buf.validate.field).string.max_len = 40];
  string key = 2 [
    (google.api.field_behavior) = REQUIRED,
    (buf.validate.field).string = {
      min_len: 1
      max_len: 1024
    }
  ];

  // Expected value (None means key must not exist)
  bytes expected_value = 3; // Empty bytes = None

  // New value
  bytes new_value = 4 [(google.api.field_behavior) = REQUIRED];

  // Namespace for tenant isolation (optional; empty string = default).
  // Tenant-id comes from auth (JWT/mTLS), not from this request.
  string namespace = 5;
}

// Cas response
message CasResponse {
  // Whether swap succeeded
  string request_id = 1 [(buf.validate.field).string.max_len = 40];
  bool success = 2;
}

// Increment request
message IncrementRequest {
  // Key for counter
  string request_id = 1 [(buf.validate.field).string.max_len = 40];
  string key = 2 [
    (google.api.field_behavior) = REQUIRED,
    (buf.validate.field).string = {
      min_len: 1
      max_len: 1024
    }
  ];

  // Delta to add
  int64 delta = 3;

  // Namespace for tenant isolation (optional; empty string = default).
  // Tenant-id comes from auth (JWT/mTLS), not from this request.
  string namespace = 4;
}

// Increment response
message IncrementResponse {
  // New value after increment
  string request_id = 1 [(buf.validate.field).string.max_len = 40];
  int64 value = 2;
}

// Decrement request
message DecrementRequest {
  // Key for counter
  string request_id = 1 [(buf.validate.field).string.max_len = 40];
  string key = 2 [
    (google.api.field_behavior) = REQUIRED,
    (buf.validate.field).string = {
      min_len: 1
      max_len: 1024
    }
  ];

  // Delta to subtract
  int64 delta = 3;

  // Namespace for tenant isolation (optional; empty string = default).
  // Tenant-id comes from auth (JWT/mTLS), not from this request.
  string namespace = 4;
}

// Decrement response
message DecrementResponse {
  // New value after decrement
  string request_id = 1 [(buf.validate.field).string.max_len = 40];
  int64 value = 2;
}

// ClearPrefix request
message ClearPrefixRequest {
  // Prefix to clear
  string request_id = 1 [(buf.validate.field).string.max_len = 40];
  string prefix = 2 [
    (google.api.field_behavior) = REQUIRED,
    (buf.validate.field).string.max_len = 1024
  ];

  // Namespace for tenant isolation (optional; empty string = default).
  // Tenant-id comes from auth (JWT/mTLS), not from this request.
  string namespace = 3;
}

// ClearPrefix response
message ClearPrefixResponse {
  // Number of keys deleted
  string request_id = 1 [(buf.validate.field).string.max_len = 40];
  uint64 deleted_count = 2;
}

// CountPrefix request
message CountPrefixRequest {
  // Prefix to count
  string request_id = 1 [(buf.validate.field).string.max_len = 40];
  string prefix = 2 [
    (google.api.field_behavior) = REQUIRED,
    (buf.validate.field).string.max_len = 1024
  ];

  // Namespace for tenant isolation (optional; empty string = default).
  // Tenant-id comes from auth (JWT/mTLS), not from this request.
  string namespace = 3;
}

// CountPrefix response
message CountPrefixResponse {
  // Number of keys with prefix
  string request_id = 1 [(buf.validate.field).string.max_len = 40];
  uint64 count = 2;
}

// GetStats request
message GetStatsRequest {
  // Namespace for tenant isolation (optional; empty string = default).
  // Tenant-id comes from auth (JWT/mTLS), not from this request.
  string request_id = 1 [(buf.validate.field).string.max_len = 40];
  string namespace = 2;
}

// GetStats response
message GetStatsResponse {
  // Total number of keys
  string request_id = 1 [(buf.validate.field).string.max_len = 40];
  uint64 total_keys = 2;

  // Total size in bytes (approximate)
  uint64 total_size_bytes = 3;

  // Backend type (e.g., "InMemory", "SQLite", "Redis", "PostgreSQL")
  string backend_type = 4;
}

// Error codes for key-value store operations.
enum KeyValueStoreErrorCode {
  KEY_VALUE_STORE_ERROR_UNSPECIFIED = 0;
  // Requested key does not exist
  KEY_VALUE_STORE_ERROR_NOT_FOUND = 1;
  // Underlying storage backend failure
  KEY_VALUE_STORE_ERROR_STORAGE = 2;
  // Serialization or deserialization failure
  KEY_VALUE_STORE_ERROR_SERIALIZATION = 3;
  // Compare-and-swap precondition failed
  KEY_VALUE_STORE_ERROR_CAS_CONFLICT = 4;
  // Operation not permitted (e.g., read-only backend)
  KEY_VALUE_STORE_ERROR_PERMISSION_DENIED = 5;
}
