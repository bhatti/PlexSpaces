# N-body gravitational simulation (Rust WASM)
# GenServer: reset, step, run_steps, get_state, get_status

tenant_id = "default"

[supervisor]
strategy = "one_for_one"
max_restarts = 10
max_restart_window_seconds = 60

[[supervisor.children]]
name = "nbody"
tenant_id = "default"
actor_type = "nbody_wasm"
role = "worker"
restart = "permanent"
shutdown_timeout_seconds = 10
behavior_kind = "GenServer"
facets = [
  { type = "virtual_actor", priority = 100, config = { idle_timeout = "10m", activation_strategy = "lazy" } },
  { type = "durability", priority = 90, config = { checkpoint_interval = 100 } }
]
