name = "python-mcp-tool-server"
version = "1.0.0"
namespace = "python-mcp-tool-server"
seed_nodes = ["localhost:8091", "localhost:8093"]

[supervisor]
strategy = "one_for_one"
max_restarts = 10
max_restart_window_seconds = 60

[[supervisor.children]]
name = "ToolRegistryActor"
actor_type = "ToolRegistryActor"
restart = "permanent"
shutdown_timeout_seconds = 10
behavior_kind = "GenServer"
facets = [
  { type = "virtual_actor", priority = 100, config = { idle_timeout = "30m", activation_strategy = "lazy" } },
  { type = "durability", priority = 90, config = { checkpoint_interval = 5 } },
  { type = "metrics", priority = 80 }
]

[[supervisor.children]]
name = "CalculatorToolActor"
actor_type = "CalculatorToolActor"
restart = "permanent"
shutdown_timeout_seconds = 5
behavior_kind = "GenServer"
facets = [
  { type = "virtual_actor", priority = 100, config = { idle_timeout = "10m", activation_strategy = "lazy" } }
]

[[supervisor.children]]
name = "SearchToolActor"
actor_type = "SearchToolActor"
restart = "permanent"
shutdown_timeout_seconds = 5
behavior_kind = "GenServer"
facets = [
  { type = "virtual_actor", priority = 100, config = { idle_timeout = "10m", activation_strategy = "lazy" } },
  { type = "durability", priority = 90, config = { checkpoint_interval = 20 } }
]

[[supervisor.children]]
name = "WeatherToolActor"
actor_type = "WeatherToolActor"
restart = "permanent"
shutdown_timeout_seconds = 5
behavior_kind = "GenServer"
facets = [
  { type = "virtual_actor", priority = 100, config = { idle_timeout = "10m", activation_strategy = "lazy" } },
  { type = "timer", priority = 70, config = { interval_ms = 60000 } }
]

[[supervisor.children]]
name = "MCPGatewayWorkflow"
actor_type = "MCPGatewayWorkflow"
restart = "permanent"
shutdown_timeout_seconds = 15
behavior_kind = "Workflow"
facets = [
  { type = "virtual_actor", priority = 100, config = { idle_timeout = "10m", activation_strategy = "lazy" } },
  { type = "durability", priority = 90, config = { checkpoint_interval = 5 } }
]

[[supervisor.children]]
name = "ToolAuditEventActor"
actor_type = "ToolAuditEventActor"
restart = "permanent"
shutdown_timeout_seconds = 5
behavior_kind = "GenEvent"
facets = [
  { type = "virtual_actor", priority = 100, config = { idle_timeout = "30m", activation_strategy = "lazy" } }
]

[[supervisor.children]]
name = "ToolCircuitBreakerFSM"
actor_type = "ToolCircuitBreakerFSM"
restart = "permanent"
shutdown_timeout_seconds = 5
behavior_kind = "GenFSM"
args = { monitored_tool = "all", degraded_threshold = "2", open_threshold = "5" }
facets = [
  { type = "virtual_actor", priority = 100, config = { idle_timeout = "30m", activation_strategy = "lazy" } },
  { type = "durability", priority = 90, config = { checkpoint_interval = 1 } },
  { type = "timer", priority = 70 }
]
