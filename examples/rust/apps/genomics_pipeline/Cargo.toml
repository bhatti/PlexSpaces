# Genomics Pipeline - DNA Sequencing Workflow with SDK Annotations
#
# Demonstrates PlexSpaces workflow patterns for bioinformatics:
# - GenomicsWorkflow (Workflow): Durable multi-step pipeline orchestration
# - QualityControl, Alignment, VariantCalling steps
# - Signal handlers for pause/resume/cancel
# - Query handlers for status/progress
#
# Real-world use case: DNA sequencing analysis (GATK/Illumina-inspired)
#
# Build: cargo build
# Run: cargo run
# Test: ./test.sh

[workspace]

[package]
name = "genomics-pipeline"
version = "0.1.0"
edition = "2021"
publish = false
description = "DNA sequencing workflow demonstrating PlexSpaces workflow patterns"

[[bin]]
name = "genomics_pipeline"
path = "src/main.rs"

[dependencies]
plexspaces-sdk = { path = "../../../../sdks/rust/plexspaces-sdk" }
plexspaces-core = { path = "../../../../crates/core" }
plexspaces-actor = { path = "../../../../crates/actor" }
plexspaces-behavior = { path = "../../../../crates/behavior" }
plexspaces-journaling = { path = "../../../../crates/journaling" }
plexspaces-proto = { path = "../../../../crates/proto" }
plexspaces-facet = { path = "../../../../crates/facet" }

tokio = { version = "1", features = ["full"] }
async-trait = "0.1"
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }
chrono = { version = "0.4", features = ["serde"] }
ulid = "1.1"
