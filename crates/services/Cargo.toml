[package]
name = "plexspaces-services"
version.workspace = true
authors.workspace = true
edition.workspace = true
license.workspace = true
repository.workspace = true
keywords.workspace = true
categories.workspace = true
description = "Centralized service infrastructure and implementations for PlexSpaces"

[dependencies]
# Core dependencies
plexspaces-service-traits = { path = "../service-traits" }
plexspaces-proto = { workspace = true }
plexspaces-mailbox = { workspace = true }
plexspaces-tuplespace = { path = "../tuplespace" }
plexspaces-channel = { workspace = true }
plexspaces-common = { path = "../common" }
plexspaces-keyvalue = { workspace = true, features = ["sql-backend"] }
plexspaces-locks = { workspace = true, features = ["sqlite-backend"] }
plexspaces-object-registry = { workspace = true, features = ["sql-backend"] }
plexspaces-facet = { workspace = true }
plexspaces-application = { path = "../application" }
plexspaces-wasm-runtime = { path = "../wasm-runtime", features = ["component-model"] }
plexspaces-actor = { workspace = true }
plexspaces-blob = { path = "../blob" }
plexspaces-journaling = { workspace = true, features = ["sqlite-backend"] }
plexspaces-workflow = { workspace = true }
plexspaces-firecracker = { workspace = true, optional = true }
plexspaces-scheduler = { path = "../scheduler" }
plexspaces-db = { path = "../../db" }
plexspaces-http-client = { workspace = true }
plexspaces-grpc-middleware = { path = "../grpc-middleware" }
sysinfo = "0.30"

# Blob service dependencies
bytes = "1.5"
object_store = { version = "0.10", features = ["aws", "gcp", "azure"] }
sha2 = "0.10"
regex = "1.10"
hex = "0.4"

# gRPC + HTTP
tonic = { workspace = true }
prost = { workspace = true }
prost-types = { workspace = true }
axum = { workspace = true }

# Async
tokio = { workspace = true }
tokio-stream = "0.1"
async-stream = { workspace = true }
async-trait = { workspace = true }
futures = { workspace = true }

# Error handling
thiserror = { workspace = true }
anyhow = "1.0"

# Observability
metrics = { workspace = true }
metrics-exporter-prometheus = { workspace = true }
tracing = { workspace = true }

# Database
sqlx = { workspace = true }

# OIDC/OAuth
reqwest = { workspace = true }
jsonwebtoken = "9.3"
urlencoding = "2.1"

# Utilities
uuid = { workspace = true }
ulid = { workspace = true }
chrono = { workspace = true }
serde = { workspace = true }
serde_json = { workspace = true }
rand = "0.8"

# System calls for forceful exit
libc = "0.2"

# Certificate generation for mTLS (moved to common crate)
# rcgen is now in common crate

[dev-dependencies]
tokio-test = "0.4"
plexspaces-grpc-middleware = { path = "../grpc-middleware" }
plexspaces-scheduler = { path = "../scheduler" }
jsonwebtoken = "9.0"
reqwest = { version = "0.11", features = ["json"] }
tempfile = "3.8"
plexspaces-node = { path = "../node" }
plexspaces-sdk = { path = "../../sdks/rust/plexspaces-sdk", features = ["native"] }
criterion = { workspace = true }
prost-types = { workspace = true }
ulid = { workspace = true }

[features]
default = ["sqlite-backend"]
sqlite-backend = ["plexspaces-locks/sqlite-backend"]
firecracker = ["plexspaces-firecracker"]
wasm-runtime = []
presigned-urls = []
postgres-backend = []
redis-backend = []
kafka-backend = []

[lib]
name = "plexspaces_services"
path = "src/lib.rs"

# Binary used by integration_tests (auth_tests, ask_reply_grpc_tests) to spawn nodes
[[bin]]
name = "node_runner"
path = "tests/actor_service/integration/node_runner.rs"

# Test binaries under tests/actor_service/ (not auto-discovered by Cargo)
[[test]]
name = "integration_tests"
path = "tests/actor_service/integration_tests.rs"

[[test]]
name = "actor_service_spawn_tests"
path = "tests/actor_service/actor_service_spawn_tests.rs"

[[test]]
name = "ask_reply_tests"
path = "tests/actor_service/ask_reply_tests.rs"

[[test]]
name = "spawn_with_facets_tests"
path = "tests/actor_service/spawn_with_facets_tests.rs"

[[test]]
name = "node_service_integration_tests"
path = "tests/node_service_integration_tests.rs"

[[test]]
name = "shard_group_tests"
path = "tests/actor_service/shard_group_tests.rs"

[[test]]
name = "shard_group_cohesion_tests"
path = "tests/actor_service/shard_group_cohesion_tests.rs"

[[test]]
name = "virtual_actor_activation_integration_tests"
path = "tests/actor_service/virtual_actor_activation_integration_tests.rs"

[[test]]
name = "routing_latency_tests"
path = "tests/actor_service/routing_latency_tests.rs"

[[bench]]
name = "routing_bench"
harness = false
