[package]
name = "plexspaces-common"
version.workspace = true
authors.workspace = true
edition.workspace = true
license.workspace = true
repository.workspace = true
keywords.workspace = true
categories.workspace = true
description = "Common types shared across PlexSpaces crates"

[dependencies]
plexspaces-proto = { workspace = true }
chrono = { workspace = true }
ulid = { workspace = true }
prost-types = "0.12"
thiserror = { workspace = true }
async-trait = { workspace = true }
tokio = { version = "1", features = ["time", "fs", "net"] }
# Certificate generation for mTLS (used by security_validator)
rcgen = "0.13"
# Time handling for certificate generation (rcgen uses time crate)
time = "0.3"
# TOML parsing for release configuration
toml = "0.8"
serde = { workspace = true }
# Tracing for logging
tracing = { workspace = true }
# Home directory access for base_dir default
dirs = "5.0"

[dev-dependencies]
tokio = { version = "1", features = ["time", "macros", "rt-multi-thread", "net"] }
tempfile = "3.8"
serial_test = "3.0"

[features]
test-helpers = []

[lib]
name = "plexspaces_common"
path = "src/lib.rs"

