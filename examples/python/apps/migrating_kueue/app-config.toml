# Kueue → PlexSpaces: GPU Job Scheduler (Python WASM)
# Priority queue, resource quotas, allocate with lock, preemption. GenServer + virtual_actor + locks.

[supervisor]
strategy = "one_for_one"
max_restarts = 10
max_restart_window_seconds = 60

[[supervisor.children]]
id = "job-scheduler"
type = "worker"
restart = "permanent"
shutdown_timeout_seconds = 10
behavior_kind = "GenServer"
facets = [
  { type = "virtual_actor", priority = 100, config = { idle_timeout = "10m", activation_strategy = "lazy" } },
  { type = "keyvalue", priority = 80, config = {} },
  { type = "locks", priority = 50, config = {} }
]
