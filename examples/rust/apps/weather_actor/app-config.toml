# Weather Actor Application Configuration (Rust)
#
# Requires the "weather-api" service link in RuntimeConfig.

tenant_id = "default"

[supervisor]
strategy = "one_for_one"
max_restarts = 10
max_restart_window_seconds = 60

[[supervisor.children]]
name = "weather"
tenant_id = "default"
actor_type = "weather_actor_wasm"
role = "worker"
restart = "permanent"
shutdown_timeout_seconds = 10
behavior_kind = "GenServer"
args = { offline_mode = "true" }
facets = [
  { type = "virtual_actor", priority = 100, config = { idle_timeout = "10m", activation_strategy = "lazy" } },
  { type = "durability", priority = 90, config = { checkpoint_interval = 100 } },
  { type = "keyvalue", priority = 80 },
  { type = "metrics", priority = 50 }
]

[[applications.required_service_links]]
name = "weather-api"
description = "Outbound HTTP link to weather forecast API"
tenant_id = "default"
