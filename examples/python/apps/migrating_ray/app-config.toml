# Ray Parameter Server Application Configuration
#
# Deploys ParameterServer + DataWorker actors from one WASM module.
# The framework passes child_spec.id as "actor_id" in init config,
# and the SDK's ACTOR_ROLES mapping selects the correct class:
#   "parameter-server" -> ParameterServer
#   "data-worker-*"    -> DataWorker (prefix match)

[supervisor]
strategy = "one_for_one"
max_restarts = 10
max_restart_window_seconds = 60

# Parameter server (centralized model weights)
[[supervisor.children]]
id = "parameter-server"
type = "worker"
restart = "permanent"
shutdown_timeout_seconds = 10

[supervisor.children.args]
num_workers = "2"
learning_rate = "0.01"
input_dim = "100"
hidden_dim = "64"

# Data workers (gradient computation)
[[supervisor.children]]
id = "data-worker-0"
type = "worker"
restart = "permanent"
shutdown_timeout_seconds = 5

[[supervisor.children]]
id = "data-worker-1"
type = "worker"
restart = "permanent"
shutdown_timeout_seconds = 5
