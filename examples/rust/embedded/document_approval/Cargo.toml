[package]
name = "document-approval"
version = "0.1.0"
edition = "2021"
license = "AGPL-3.0-or-later"
authors = ["Shahzad A. Bhatti <bhatti@plexobject.com>"]
description = "Document Approval Workflow - DocuSign-like Multi-Step Approval"

[workspace]

[[bin]]
name = "document_approval"
path = "src/main.rs"

[dependencies]
# PlexSpaces SDK
plexspaces-sdk = { git = "https://github.com/bhatti/plexspaces", tag = "v0.1.1", features = ["native"] }
plexspaces-actor = { path = "../../../../crates/actor" }
plexspaces-behavior = { path = "../../../../crates/behavior" }
plexspaces-node = { path = "../../../../crates/node" }
plexspaces-journaling = { path = "../../../../crates/journaling" }

# Async runtime
tokio = { version = "1.0", features = ["full"] }

# Serialization
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"

# Logging
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }

# Time
chrono = { version = "0.4", features = ["serde"] }
