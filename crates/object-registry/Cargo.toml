[package]
name = "plexspaces-object-registry"
version = "0.1.0"
edition = "2021"
authors = ["Shahzad A. Bhatti <bhatti@plexobject.com>"]
description = "Unified object registry for PlexSpaces (actors, tuplespaces, services) with multi-backend support"
license = "AGPL-3.0-or-later"

[dependencies]
# Core types (for Service trait and ObjectRegistry trait)
plexspaces-core = { path = "../core" }
# Core proto definitions
plexspaces-proto = { path = "../proto" }
# Common utilities (RequestContext)
plexspaces-common = { path = "../common" }

# Serialization (use workspace version to match proto crate)
prost = { workspace = true }
prost-types = { workspace = true }

# Async runtime
tokio = { version = "1", features = ["full"] }
async-trait = "0.1"

# Error handling
thiserror = "2.0"

# Time handling
chrono = { workspace = true }

# Logging and tracing
tracing = "0.1"

# Optional SQL backend support (SQLite + PostgreSQL)
sqlx = { version = "0.7", features = ["runtime-tokio-rustls", "sqlite", "postgres", "migrate", "chrono"], optional = true }

# Optional DynamoDB backend support
aws-sdk-dynamodb = { version = "1", optional = true }
aws-config = { version = "1", optional = true }

[dev-dependencies]
# Testing
tokio-test = "0.4"
env_logger = "0.11"
tempfile = "3.10"

[features]
default = ["sql-backend"]
sql-backend = ["sqlx"]
ddb-backend = ["aws-sdk-dynamodb", "aws-config"]
all-backends = ["sql-backend", "ddb-backend"]

[lib]
doctest = false
