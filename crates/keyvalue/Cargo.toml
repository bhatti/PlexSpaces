[package]
name = "plexspaces-keyvalue"
version = "0.1.0"
edition = "2021"
license = "AGPL-3.0-or-later"
authors = ["Shahzad A. Bhatti <bhatti@plexobject.com>"]
description = "Multi-purpose key-value store for PlexSpaces framework"
repository = "https://github.com/plexobject/plexspaces"

[dependencies]
plexspaces-common = { path = "../common" }
plexspaces-proto = { path = "../proto" }
async-trait = { workspace = true }
tokio = { workspace = true }
thiserror = { workspace = true }
serde = { workspace = true }
serde_json = { workspace = true }
tracing = { workspace = true }

# Optional SQL backend support (must match tuplespace version)
# Note: "any" feature required for AnyPool used by blob repository
sqlx = { workspace = true, optional = true }

# Optional Redis backend support
redis = { version = "0.27", features = ["tokio-comp", "connection-manager"], optional = true }

# Optional Blob backend support
# Uses object_store directly (no blob service or SQL dependency)
object_store = { version = "0.10", features = ["aws", "gcp", "azure"], optional = true }
futures = { workspace = true, optional = true }
bytes = { version = "1.5", optional = true }
chrono = { workspace = true, optional = true }

# Optional DynamoDB backend support
aws-sdk-dynamodb = { version = "1", optional = true }
aws-config = { version = "1", optional = true }
metrics = { version = "0.23", optional = true }

[dev-dependencies]
tokio-test = "0.4"
anyhow = "1.0"
env_logger = "0.11"
criterion = { version = "0.5", features = ["async_tokio"] }
serial_test = "3.0"
tempfile = "3.10"
reqwest = { version = "0.12", features = ["json"] }
object_store = "0.10"
ulid = { workspace = true }
# Ensure sqlx is available in tests (for blob backend tests)
sqlx = { workspace = true }
# Test helpers for checking DynamoDB Local availability
plexspaces-common = { path = "../common", features = ["test-helpers"] }
# Embedded object store for blob integration tests
plexspaces-blob = { path = "../blob", features = [] }

[features]
default = []
sql-backend = ["sqlx"]
redis-backend = ["redis"]
# blob-backend requires sql-backend (for repository) and ensures sqlx has "any" feature
blob-backend = ["object_store", "futures", "bytes", "chrono"]
ddb-backend = ["aws-sdk-dynamodb", "aws-config", "metrics", "chrono"]
all-backends = ["sql-backend", "redis-backend", "blob-backend", "ddb-backend"]

[lib]
doctest = false

[[bench]]
name = "keyvalue_benchmarks"
harness = false
required-features = ["sql-backend"]
