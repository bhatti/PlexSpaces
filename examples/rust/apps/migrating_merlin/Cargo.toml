# Merlin parameter sweep — Rust WASM (SDK + WIT)

[workspace]

[package]
name = "migrating-merlin-wasm"
version = "0.1.0"
edition = "2021"
license = "LGPL-2.1-or-later"
publish = false
description = "Merlin parameter sweep WASM actor (pool + tuple space; fallback: process group)"

[lib]
crate-type = ["cdylib"]

[dependencies]
plexspaces-sdk = { path = "../../../../sdks/rust/plexspaces-sdk", default-features = false }
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
wit-bindgen = "0.51.0"

[profile.release]
opt-level = "z"
lto = true
codegen-units = 1
strip = true
