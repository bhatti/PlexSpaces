# Ray Parameter Server Application Configuration
#
# Deploys ParameterServer + DataWorker actors from one WASM module.
# actor_type matches the Python class name; the SDK selects the correct class
# via select_actor_class (priority: actor_type exact match).

tenant_id = "default"

[supervisor]
strategy = "one_for_one"
max_restarts = 10
max_restart_window_seconds = 60

# Parameter server (centralized model weights)
[[supervisor.children]]
name = "parameter-server"
tenant_id = "default"
actor_type = "ParameterServer"
restart = "permanent"
shutdown_timeout_seconds = 10

[supervisor.children.args]
num_workers = "2"
learning_rate = "0.01"
input_dim = "100"
hidden_dim = "64"

# Data workers (gradient computation)
[[supervisor.children]]
name = "data-worker-0"
actor_type = "DataWorker"
restart = "permanent"
shutdown_timeout_seconds = 5

[[supervisor.children]]
name = "data-worker-1"
actor_type = "DataWorker"
restart = "permanent"
shutdown_timeout_seconds = 5
tenant_id = "default"
