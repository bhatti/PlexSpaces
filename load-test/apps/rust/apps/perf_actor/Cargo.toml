[workspace]

[package]
name = "perf-actor-wasm"
version = "0.1.0"
edition = "2021"
license = "AGPL-3.0-or-later"
publish = false
description = "Rust WASM perf actor for PlexSpaces load testing"

[lib]
crate-type = ["cdylib"]

[dependencies]
plexspaces-sdk = { path = "../../../../../sdks/rust/plexspaces-sdk", default-features = false }
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
wit-bindgen = "0.51.0"

[profile.release]
opt-level = "z"
lto = true
codegen-units = 1
strip = true
