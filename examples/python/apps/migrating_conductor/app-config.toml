# Netflix Conductor/Orkes → PlexSpaces: Order Saga Workflow (Python WASM)
# Workflow run/signal/query + virtual_actor + durability (saga with compensation)

tenant_id = "default"

[supervisor]
strategy = "one_for_one"
max_restarts = 10
max_restart_window_seconds = 60

[[supervisor.children]]
name = "order-saga"
tenant_id = "default"
actor_type = "migrating_conductor_wasm"
role = "worker"
restart = "permanent"
shutdown_timeout_seconds = 10
behavior_kind = "Workflow"
facets = [
  { type = "virtual_actor", priority = 100, config = { idle_timeout = "10m", activation_strategy = "lazy" } },
  { type = "durability", priority = 90, config = { checkpoint_interval = 100 } }
]
