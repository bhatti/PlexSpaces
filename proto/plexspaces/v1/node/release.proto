// PlexSpaces Release Configuration
//
// ## Purpose
// Defines the release specification for PlexSpaces nodes, following Erlang/OTP
// release patterns. A release is a complete packaged system containing multiple
// applications, runtime configuration, and deployment settings.
//
// ## Architecture Context
// This proto file is central to the PlexSpaces node/release design (PLEXSPACES_RELEASE_DESIGN.md).
// It defines:
// - Release metadata and versioning
// - Node configuration (identity, clustering)
// - Runtime configuration (gRPC, middleware, health)
// - Application bundle (system + user applications)
// - Shutdown behavior (graceful, timeouts)
//
// ## Component Interactions
// - Used by: PlexSpacesNode (node startup/shutdown)
// - Depends on: application.proto (ApplicationSpec)
//
// ## Design Decisions
// - Why TOML mapping: Human-friendly configuration (release.toml)
// - Why separate Node/Runtime/Shutdown: Clear separation of concerns
// - Why middleware as list: Order matters for middleware stack

syntax = "proto3";
package plexspaces.node.v1;

import "buf/validate/validate.proto";
import "google/api/field_behavior.proto";
import "google/protobuf/duration.proto";
import "plexspaces/v1/application/application.proto";
import "plexspaces/v1/channel/channel.proto";
import "plexspaces/v1/node/outbound.proto";
import "plexspaces/v1/common.proto";
import "plexspaces/v1/security/security.proto";
import "plexspaces/v1/storage/blob.proto";
import "plexspaces/v1/storage/storage_config.proto";
import "protoc-gen-openapiv2/options/annotations.proto";

option go_package = "github.com/bhatti/plexspaces/gen/go/plexspaces/v1/node;plexspaces_node_v1";

// Release specification (Erlang/OTP-inspired)
//
// ## Purpose
// Complete system definition for a PlexSpaces node. Analogous to
// Erlang .rel files, defines which applications to include and
// how to configure the runtime.
//
// ## Why This Exists
// - Single source of truth for node configuration
// - Supports multiple applications per node (Erlang model)
// - Enables declarative deployment (Docker, k8s)
// - Provides graceful shutdown specifications
message ReleaseSpec {
  // Release metadata
  string name = 1; // e.g., "plexspaces-cluster"
  string version = 2; // Semantic version (e.g., "1.0.0")
  string description = 3; // Human-readable description

  // Node configuration
  NodeConfig node = 4;

  // Runtime configuration (gRPC, middleware, health)
  RuntimeConfig runtime = 5;

  // System applications (always included)
  repeated string system_applications = 6;

  // User applications (business logic)
  // NOTE: ApplicationConfig has been merged into ApplicationSpec
  repeated plexspaces.application.v1.ApplicationSpec applications = 7;

  // Environment variables for all applications
  map<string, string> env = 8;

  // Shutdown configuration (Erlang/OTP-inspired)
  ShutdownConfig shutdown = 9;
}

// Node configuration
//
// ## Purpose
// Defines node identity, cluster membership, and runtime operational settings.
message NodeConfig {
  // Node ID (unique in cluster)
  // Can be environment variable like "${NODE_ID}"
  string id = 1;

  // Address this node listens on (e.g., "0.0.0.0:8000")
  string listen_addr = 2;

  // Cluster seed nodes for discovery
  // e.g., ["node1.cluster.local:8000", "node2.cluster.local:8000"]
  repeated string cluster_seed_nodes = 3;

  // Cluster name for grouping nodes that share UDP/ZeroMQ channels
  //
  // Nodes with the same cluster_name can communicate via UDP multicast
  // or ZeroMQ channels. Used for service discovery and channel configuration.
  // If empty, node is not part of any cluster.
  string cluster_name = 6;

  // gRPC connection pool size per service
  //
  // Number of connections to maintain in the pool for each remote service.
  // Defaults to 2 if not set. Each service (e.g., ActorService, TupleSpaceService)
  // will have its own connection pool of this size.
  uint32 grpc_connection_pool_size = 7;

  // Maximum number of concurrent connections
  uint32 max_connections = 8;

  // Heartbeat interval in milliseconds
  uint64 heartbeat_interval_ms = 9;

  // Enable clustering (multi-node coordination)
  bool clustering_enabled = 10;

  // Node metadata (key-value pairs for extensibility)
  map<string, string> metadata = 11;

  // ==================== NODE REGISTRY CONFIGURATION ====================

  // Node registry configuration (SWIM protocol, caching, DB fallback)
  //
  // Configures how nodes discover and track each other. Uses SWIM protocol
  // for efficient failure detection without requiring a shared database.
  NodeRegistryConfig node_registry = 20;

  // gRPC address this node advertises to other nodes
  //
  // If not set, derived from listen_addr. Should be externally reachable.
  // Example: "http://node1.example.com:8000"
  string grpc_address = 21;
}

// Node registry configuration
//
// ## Purpose
// Configures node discovery, failure detection, and membership tracking.
// Uses SWIM protocol for scalable, decentralized failure detection.
//
// ## Design
// Based on SWIM (Scalable Weakly-consistent Infection-style Process Group
// Membership Protocol) with enhancements from Lifeguard (HashiCorp).
//
// ## References
// - SWIM: Das, Gupta, Motivala (2002)
// - Lifeguard: HashiCorp (2017)
message NodeRegistryConfig {
  option (grpc.gateway.protoc_gen_openapiv2.options.openapiv2_schema) = {
    json_schema: {
      title: "Node Registry Configuration"
      description: "Configuration for node discovery and SWIM protocol"
    }
  };

  // ==================== CACHE CONFIGURATION ====================

  // Cache TTL in seconds for node entries
  //
  // How long to cache node registrations before considering them stale.
  // Lower values mean more DB/network traffic but fresher data.
  // Default: 60 seconds
  uint32 cache_ttl_seconds = 1 [(grpc.gateway.protoc_gen_openapiv2.options.openapiv2_field) = {
    description: "Cache TTL in seconds"
    minimum: 1
    maximum: 3600
    default: "60"
  }];

  // ==================== SWIM PROTOCOL CONFIGURATION ====================

  // Enable SWIM gossip protocol
  //
  // When enabled, nodes use SWIM for failure detection and membership
  // propagation. Recommended when not using a shared database.
  // Default: true
  bool gossip_enabled = 10 [(grpc.gateway.protoc_gen_openapiv2.options.openapiv2_field) = {
    description: "Enable SWIM gossip protocol"
    default: "true"
  }];

  // SWIM protocol configuration
  SwimConfig swim = 11;

  // ==================== DATABASE FALLBACK CONFIGURATION ====================

  // Use shared database as source of truth
  //
  // When true, ObjectRegistry database is the authoritative source.
  // SWIM protocol supplements DB with faster failure detection.
  // When false, SWIM is the only source (suitable for dev/testing).
  // Default: false
  bool use_shared_db = 20 [(grpc.gateway.protoc_gen_openapiv2.options.openapiv2_field) = {
    description: "Use shared database as source of truth"
    default: "false"
  }];

  // DB operation backoff configuration
  DbBackoffConfig db_backoff = 21;

  // Anti-entropy sync interval in seconds
  //
  // How often to sync local state with database (if use_shared_db=true).
  // Default: 30 seconds
  uint32 db_sync_interval_seconds = 22 [(grpc.gateway.protoc_gen_openapiv2.options.openapiv2_field) = {
    description: "DB sync interval in seconds"
    minimum: 5
    maximum: 600
    default: "30"
  }];

  // Maximum age in seconds for node registrations to be considered active.
  //
  // NodeRegistry returns only nodes whose last_heartbeat or updated_at is
  // within this window. This keeps placement consistent with the
  // object-registry source of truth while allowing asynchronous SWIM updates.
  // Default: 86400 seconds (24 hours)
  uint32 active_node_window_seconds = 23 [(grpc.gateway.protoc_gen_openapiv2.options.openapiv2_field) = {
    description: "Maximum age for active node registrations in seconds"
    minimum: 60
    maximum: 604800
    default: "86400"
  }];
}

// SWIM protocol configuration
//
// ## Purpose
// Configures the SWIM (Scalable Weakly-consistent Infection-style Membership)
// protocol for robust failure detection without a shared database.
//
// ## Key Concepts
// - **Protocol Period**: How often to probe a random node
// - **Probe Timeout**: How long to wait for ping response
// - **Indirect Probes**: Number of intermediary nodes for fallback probing
// - **Suspicion**: Grace period before declaring a node dead
message SwimConfig {
  option (grpc.gateway.protoc_gen_openapiv2.options.openapiv2_schema) = {
    json_schema: {
      title: "SWIM Protocol Configuration"
      description: "Configuration for SWIM failure detection protocol"
    }
  };

  // Protocol period in milliseconds
  //
  // How often to probe a random cluster member. Lower values mean faster
  // failure detection but more network traffic.
  // Default: 1000ms (1 second)
  uint32 protocol_period_ms = 1 [(grpc.gateway.protoc_gen_openapiv2.options.openapiv2_field) = {
    description: "Protocol period in milliseconds"
    minimum: 100
    maximum: 60000
    default: "1000"
  }];

  // Probe timeout in milliseconds
  //
  // How long to wait for a ping response before trying indirect probing.
  // Should be less than protocol_period_ms.
  // Default: 500ms
  uint32 probe_timeout_ms = 2 [(grpc.gateway.protoc_gen_openapiv2.options.openapiv2_field) = {
    description: "Probe timeout in milliseconds"
    minimum: 50
    maximum: 30000
    default: "500"
  }];

  // Number of nodes to use for indirect probing
  //
  // When direct probe fails, ask this many random nodes to probe the target.
  // Higher values reduce false positives but increase network traffic.
  // Default: 3
  uint32 indirect_ping_nodes = 3 [(grpc.gateway.protoc_gen_openapiv2.options.openapiv2_field) = {
    description: "Number of indirect probe nodes"
    minimum: 1
    maximum: 10
    default: "3"
  }];

  // Suspicion timeout multiplier
  //
  // Multiplied by log(cluster_size) * protocol_period to calculate
  // how long a node stays in suspect state before being declared dead.
  // Higher values reduce false positives in unstable networks.
  // Default: 4
  uint32 suspicion_multiplier = 4 [(grpc.gateway.protoc_gen_openapiv2.options.openapiv2_field) = {
    description: "Suspicion timeout multiplier"
    minimum: 1
    maximum: 20
    default: "4"
  }];

  // Minimum suspicion timeout in milliseconds
  //
  // Lower bound for suspicion timeout regardless of cluster size.
  // Default: 3000ms (3 seconds)
  uint32 suspicion_min_ms = 5 [(grpc.gateway.protoc_gen_openapiv2.options.openapiv2_field) = {
    description: "Minimum suspicion timeout in milliseconds"
    minimum: 1000
    maximum: 60000
    default: "3000"
  }];

  // Maximum suspicion timeout in milliseconds
  //
  // Upper bound for suspicion timeout regardless of cluster size.
  // Default: 30000ms (30 seconds)
  uint32 suspicion_max_ms = 6 [(grpc.gateway.protoc_gen_openapiv2.options.openapiv2_field) = {
    description: "Maximum suspicion timeout in milliseconds"
    minimum: 5000
    maximum: 300000
    default: "30000"
  }];

  // Dead node reap timeout in seconds
  //
  // How long to keep dead nodes in membership before removing them.
  // Allows late-arriving messages about the dead node to be processed.
  // Default: 300 seconds (5 minutes)
  uint32 dead_node_reap_seconds = 7 [(grpc.gateway.protoc_gen_openapiv2.options.openapiv2_field) = {
    description: "Dead node reap timeout in seconds"
    minimum: 60
    maximum: 3600
    default: "300"
  }];

  // Maximum membership updates to piggyback on messages
  //
  // SWIM piggybacks membership updates on protocol messages for
  // efficient dissemination. This limits how many updates per message.
  // Default: 10
  uint32 max_piggyback_updates = 8 [(grpc.gateway.protoc_gen_openapiv2.options.openapiv2_field) = {
    description: "Maximum piggyback updates per message"
    minimum: 1
    maximum: 50
    default: "10"
  }];

  // Broadcast limit for membership updates
  //
  // How many times to broadcast an update before dropping it.
  // Calculated as broadcast_limit * log(cluster_size) in practice.
  // Default: 5
  uint32 broadcast_limit = 9 [(grpc.gateway.protoc_gen_openapiv2.options.openapiv2_field) = {
    description: "Broadcast limit for updates"
    minimum: 1
    maximum: 20
    default: "5"
  }];

  // Anti-entropy sync interval in seconds
  //
  // How often to perform full state sync with a random peer.
  // Ensures consistency even if some updates are lost.
  // Default: 30 seconds
  uint32 anti_entropy_interval_seconds = 10 [(grpc.gateway.protoc_gen_openapiv2.options.openapiv2_field) = {
    description: "Anti-entropy sync interval in seconds"
    minimum: 10
    maximum: 600
    default: "30"
  }];
}

// Database backoff configuration
//
// ## Purpose
// Configures exponential backoff with jitter for database operations.
// Prevents thundering herd and reduces DB load during failures.
//
// ## Algorithm
// Uses decorrelated jitter: sleep = min(cap, random(base, sleep * 3))
// Based on AWS Architecture Blog recommendations.
message DbBackoffConfig {
  option (grpc.gateway.protoc_gen_openapiv2.options.openapiv2_schema) = {
    json_schema: {
      title: "Database Backoff Configuration"
      description: "Exponential backoff configuration for DB operations"
    }
  };

  // Base delay in milliseconds
  //
  // Initial backoff delay for the first retry.
  // Default: 100ms
  uint32 base_delay_ms = 1 [(grpc.gateway.protoc_gen_openapiv2.options.openapiv2_field) = {
    description: "Base delay in milliseconds"
    minimum: 10
    maximum: 10000
    default: "100"
  }];

  // Maximum delay cap in milliseconds
  //
  // Upper bound for backoff delay regardless of retry count.
  // Default: 30000ms (30 seconds)
  uint32 max_delay_ms = 2 [(grpc.gateway.protoc_gen_openapiv2.options.openapiv2_field) = {
    description: "Maximum delay cap in milliseconds"
    minimum: 100
    maximum: 300000
    default: "30000"
  }];

  // Maximum retry attempts
  //
  // How many times to retry a failed DB operation before giving up.
  // Set to 0 for unlimited retries (not recommended).
  // Default: 10
  uint32 max_attempts = 3 [(grpc.gateway.protoc_gen_openapiv2.options.openapiv2_field) = {
    description: "Maximum retry attempts"
    minimum: 0
    maximum: 100
    default: "10"
  }];
}

// Default virtual actor configuration (runtime defaults)
//
// ## Purpose
// Default values for virtual actor lifecycle when not specified per-actor or in gRPC request.
// Used by VirtualActorFacet, actor factory, SDK, and WASM app registration when building
// facet_config. Idle timeout and pool size are read from here when available.
//
// ## Defaults (when not set)
// - idle_timeout: 5m (300 seconds)
// - max_pool_per_actor_type: 100
// - activation_strategy: LAZY
message DefaultVirtualActorConfig {
  option (grpc.gateway.protoc_gen_openapiv2.options.openapiv2_schema) = {
    json_schema: {
      title: "Default Virtual Actor Configuration"
      description: "Runtime defaults for virtual actor idle timeout, pool size, and activation strategy"
    }
  };

  // Idle timeout before deactivation (default: 5m)
  // When not set, code uses 300 seconds. Valid range: 1s to 24h.
  google.protobuf.Duration idle_timeout = 1 [
    (buf.validate.field).duration = {
      gte: {seconds: 1}
      lte: {seconds: 86400}
    },
    (grpc.gateway.protoc_gen_openapiv2.options.openapiv2_field) = {description: "Idle timeout before deactivation (default: 5m / 300s)"}
  ];

  // Max instances per actor type (LRU eviction when exceeded). Default: 100
  uint32 max_pool_per_actor_type = 2 [
    (buf.validate.field).uint32 = {
      gte: 1
      lte: 10000
    },
    (grpc.gateway.protoc_gen_openapiv2.options.openapiv2_field) = {
      description: "Max instances per actor type (LRU eviction when exceeded)"
      minimum: 1
      maximum: 10000
      default: "100"
    }
  ];

  // Activation strategy (from common.proto; default: LAZY when UNSPECIFIED)
  plexspaces.common.v1.ActivationStrategy activation_strategy = 3 [(grpc.gateway.protoc_gen_openapiv2.options.openapiv2_field) = {
    description: "Activation strategy (default: LAZY)"
    default: "ACTIVATION_STRATEGY_LAZY"
  }];
}

// Runtime configuration
//
// ## Purpose
// Defines runtime services (gRPC, middleware, health monitoring, security, blob storage,
// and unified storage backends).
message RuntimeConfig {
  // gRPC server configuration
  GrpcConfig grpc = 1;

  // Health monitoring configuration
  HealthConfig health = 2;

  // Security configuration (authentication/authorization)
  SecurityConfig security = 3;

  // Blob storage configuration (S3-compatible object storage)
  plexspaces.storage.v1.BlobConfig blob = 4;

  // Shared database configuration
  //
  // Used by all components that use relational database:
  // - scheduler (crates/scheduler/migrations)
  // - workflow (crates/workflow/migrations)
  // - journaling (crates/journaling/migrations)
  // - blob (crates/blob/migrations)
  // - keyvalue (crates/keyvalue/migrations)
  // - locks (crates/locks/migrations)
  // - channel (crates/channel/migrations)
  // - tuplespace (crates/tuplespace/migrations)
  //
  // Convention: All these components share the same database by default.
  plexspaces.storage.v1.SharedDbConfig db = 5;

  // Locks storage provider configuration
  //
  // Supports: postgres, sqlite, redis, dynamodb
  // Default (set by config_manager): redis (if available), else use shared db
  plexspaces.storage.v1.StorageProviderConfig locks_provider = 6;

  // Channel provider type
  //
  // Supports: IN_MEMORY, REDIS, KAFKA, NATS, SQLITE, SQS, POSTGRES, PROCESS_GROUP
  // Default (set by config_manager): IN_MEMORY
  plexspaces.channel.v1.ChannelProvider channel_provider = 7;

  // Mailbox provider type
  //
  // Supports: IN_MEMORY, REDIS, SQLITE, POSTGRES
  // Default (set by config_manager): IN_MEMORY
  plexspaces.channel.v1.ChannelProvider mailbox_provider = 8;

  // Framework version information (auto-populated at build time)
  plexspaces.storage.v1.FrameworkInfo framework_info = 9;

  // Base directory for PlexSpaces data
  //
  // Default (set by config_manager): $HOME/plexspaces
  // Used for: SQLite databases ({base_dir}/db/), WASM apps, etc.
  // Environment variable: PLEXSPACES_BASE_DIR
  string base_dir = 10;

  // Directory containing WASM applications to auto-deploy on startup
  //
  // Structure: wasm_apps/<app-name>/app.wasm (required) + app-config.toml (optional)
  // Each subdirectory is deployed as a separate application.
  // If empty, no auto-deploy happens (default behavior).
  //
  // Default (set by config_manager): {base_dir}/apps
  // Environment variable: PLEXSPACES_WASM_APPS_DIR
  string wasm_apps_directory = 11;

  // Save deployed WASM applications to wasm_apps_directory (default: false)
  //
  // When enabled, WASM modules deployed via API are atomically saved to
  // wasm_apps_directory/<app-name>/app.wasm for persistence and auto-deploy
  // on next node restart. Uses atomic file operations (temp file then move)
  // to prevent half-completed files.
  //
  // Security: Only enable for testing/development. Production should use
  // proper deployment pipelines and not save arbitrary WASM files to disk.
  //
  // Default: false (disabled)
  // Environment variable: PLEXSPACES_SAVE_WASM_APPS
  bool save_wasm_apps = 12;

  // Default virtual actor config (idle_timeout, pool size, activation_strategy)
  //
  // When not set, code defaults apply: idle_timeout 5m, max_pool_per_actor_type 100,
  // activation_strategy LAZY. Used when creating VirtualActorFacet or registering
  // virtual actor types (WASM, SDK, gRPC fallback).
  DefaultVirtualActorConfig default_virtual_actor_config = 13;

  // Static outbound service links (name → base URL, auth env refs, policy template).
  repeated ServiceLinkConfig service_links = 14 [
    (google.api.field_behavior) = OPTIONAL,
    (buf.validate.field).repeated = {max_items: 256},
    (grpc.gateway.protoc_gen_openapiv2.options.openapiv2_field) = {
      description: "Catalog of named outbound dependencies (HTTP first); merged with app requirements at deploy."
    }
  ];

  // Default policy merged into every outbound HTTP call unless overridden by templates or links.
  ClientTransportPolicy default_outbound_client_policy = 15 [
    (google.api.field_behavior) = OPTIONAL,
    (grpc.gateway.protoc_gen_openapiv2.options.openapiv2_field) = {
      description: "Node-wide defaults for connect/request timeouts, retry, and circuit breaker."
    }
  ];

  // Named policy templates referenced by ServiceLinkConfig.policy_template or application requirements.
  map<string, ClientTransportPolicy> outbound_policy_templates = 16 [
    (google.api.field_behavior) = OPTIONAL,
    (buf.validate.field).map = {
      max_pairs: 64
      keys: {string: {min_len: 1, max_len: 128, pattern: "^[a-zA-Z0-9][a-zA-Z0-9._-]*$"}}
    },
    (grpc.gateway.protoc_gen_openapiv2.options.openapiv2_field) = {
      description: "Reusable ClientTransportPolicy fragments merged by template name."
    }
  ];
}

// gRPC server configuration
message GrpcConfig {
  // Enable gRPC server
  bool enabled = 1;

  // gRPC listen address (e.g., "0.0.0.0:8000")
  string address = 2;

  // Maximum concurrent connections
  uint32 max_connections = 3;

  // Keepalive interval (seconds)
  uint64 keepalive_interval_seconds = 4;

  // Middleware stack (order matters!)
  repeated MiddlewareConfig middleware = 5;
}

// Middleware configuration
//
// ## Purpose
// Declarative middleware configuration for gRPC server.
// Middleware executes in the order specified.
//
// ## Supported Middleware Types
// - "metrics": Prometheus metrics collection
// - "tracing": OpenTelemetry distributed tracing
// - "mtls": Mutual TLS authentication
// - "compression": gzip/brotli compression
// - "rate_limiting": Request rate limiting
message MiddlewareConfig {
  // Middleware type (e.g., "metrics", "tracing", "mtls")
  string type = 1;

  // Enable this middleware
  bool enabled = 2;

  // Middleware-specific configuration (JSON or map)
  map<string, string> config = 3;
}

// Health monitoring configuration
message HealthConfig {
  // Heartbeat interval (seconds)
  uint64 heartbeat_interval_seconds = 1;

  // Heartbeat timeout (seconds)
  uint64 heartbeat_timeout_seconds = 2;

  // Registry URL for heartbeat reporting
  string registry_url = 3;
}

// Security configuration
//
// ## Purpose
// Defines authentication and authorization settings for the node.
// Each node can have its own security configuration (secrets/keys).
//
// ## Design
// - Service-to-service: mTLS with X.509 certificates
// - Public APIs: JWT authentication
// - Service credentials: API keys
//
// ## Security Best Practices
// - Store secrets in environment variables or secret management systems
// - Use file paths for certificates (not inline in config)
// - Rotate certificates regularly
// - Auth enabled by default (can disable for local testing)
message SecurityConfig {
  // Service identity for this node (mTLS)
  //
  // Used for service-to-service authentication.
  // Each node should have its own service identity.
  plexspaces.security.v1.ServiceIdentity service_identity = 1;

  // mTLS configuration
  //
  // Configures mutual TLS for service-to-service communication.
  // Required if mTLS is enabled in middleware.
  plexspaces.security.v1.MtlsConfig mtls = 2;

  // JWT configuration for public APIs
  //
  // Configures JWT authentication for external/public APIs.
  // Required if JWT authentication is enabled in middleware.
  plexspaces.security.v1.JwtConfig jwt = 3;

  // API keys for service authentication
  //
  // List of API keys this node can use for authentication.
  // Keys are service-scoped (not user-scoped).
  repeated plexspaces.security.v1.ApiKey api_keys = 4;

  // Disable authentication (default: false)
  //
  // Security: Only for integration tests and local development.
  // Can be enabled via PLEXSPACES_DISABLE_AUTH env variable or this config.
  // Never use in production - always keep auth enabled.
  bool disable_auth = 5;
}

// Application configuration (in release)
//
// ## Purpose
// Defines which applications to load and their startup/shutdown behavior.
//
// ## Dependency Resolution
// Applications with dependencies will start AFTER their dependencies.
// Uses topological sort (Kahn's algorithm) to determine startup order.
message ApplicationConfig {
  // Application name (must match .app.toml)
  string name = 1;

  // Application version
  string version = 2;

  // Path to application config file (e.g., "apps/byzantine/byzantine.app.toml")
  string config_path = 3;

  // Enable this application
  bool enabled = 4;

  // Auto-start on node boot
  bool auto_start = 5;

  // Shutdown timeout (seconds)
  // 0 = immediate (brutal_kill)
  // >0 = graceful with timeout
  // Special value -1 = infinity (wait forever)
  int64 shutdown_timeout_seconds = 6;

  // Shutdown strategy
  ShutdownStrategy shutdown_strategy = 7;

  // Dependencies (other application names)
  // This application will start AFTER all dependencies have started.
  // Used for topological sort during node startup.
  //
  // ## Examples
  // - ["tuplespace-service"] - Requires TupleSpace to be running first
  // - ["actor-registry", "node-registry"] - Requires both registries
  repeated string dependencies = 8;
}

// Shutdown strategy (Erlang/OTP-inspired)
enum ShutdownStrategy {
  // Unspecified (default to graceful)
  SHUTDOWN_STRATEGY_UNSPECIFIED = 0;

  // Graceful shutdown with cleanup
  // Equivalent to Erlang's `shutdown: Timeout`
  SHUTDOWN_STRATEGY_GRACEFUL = 1;

  // Immediate termination (no cleanup)
  // Equivalent to Erlang's `shutdown: brutal_kill`
  SHUTDOWN_STRATEGY_BRUTAL_KILL = 2;

  // Wait indefinitely for graceful shutdown
  // Equivalent to Erlang's `shutdown: infinity`
  SHUTDOWN_STRATEGY_INFINITY = 3;
}

// Shutdown configuration (node-level)
//
// ## Purpose
// Global shutdown settings for the entire node.
message ShutdownConfig {
  // Global shutdown timeout (seconds)
  // If node shutdown exceeds this, force-kill all remaining processes
  uint64 global_timeout_seconds = 1;

  // Grace period after deregistration (seconds)
  // Allows time for cluster to route work away from this node
  uint64 grace_period_seconds = 2;

  // gRPC drain timeout (seconds)
  // How long to wait for in-flight gRPC requests to complete
  uint64 grpc_drain_timeout_seconds = 3;
}

// Release error types
//
// ## Purpose
// Defines all error conditions that can occur during release
// loading, dependency resolution, and application lifecycle.
enum ReleaseErrorCode {
  // Unknown error
  RELEASE_ERROR_CODE_UNSPECIFIED = 0;

  // IO error reading release file
  RELEASE_ERROR_CODE_IO_ERROR = 1;

  // TOML parsing error
  RELEASE_ERROR_CODE_TOML_PARSE_ERROR = 2;

  // Circular dependency detected in application dependencies
  // e.g., app-a depends on app-b, app-b depends on app-a
  RELEASE_ERROR_CODE_CIRCULAR_DEPENDENCY = 3;

  // Missing dependency: application depends on another application
  // that is not included in the release
  RELEASE_ERROR_CODE_MISSING_DEPENDENCY = 4;

  // Application not found in release
  RELEASE_ERROR_CODE_APPLICATION_NOT_FOUND = 5;

  // Invalid configuration (malformed or conflicting settings)
  RELEASE_ERROR_CODE_INVALID_CONFIG = 6;
}

// Release error message
//
// ## Purpose
// Structured error information for release operations.
// Used in gRPC responses and internal error handling.
message ReleaseError {
  // Error code
  ReleaseErrorCode code = 1;

  // Human-readable error message
  string message = 2;

  // Additional context (e.g., application name, dependency name)
  map<string, string> context = 3;
}
