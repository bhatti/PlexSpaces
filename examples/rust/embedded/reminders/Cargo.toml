[package]
name = "reminders"
version = "0.1.0"
edition = "2021"
publish = false
description = "Subscription billing example using PlexSpaces ReminderFacet"

[workspace]

[[bin]]
name = "reminders"
path = "src/main.rs"

[dependencies]
# PlexSpaces SDK (includes core, actor, macros)
plexspaces-sdk = { path = "../../../../sdks/rust/plexspaces-sdk", features = ["native"] }
plexspaces-actor = { path = "../../../../crates/actor" }  # Required for macro-generated code
plexspaces-facet = { path = "../../../../crates/facet" }  # Required for Facet trait
plexspaces-node = { path = "../../../../crates/node" }
plexspaces-journaling = { path = "../../../../crates/journaling" }
plexspaces-proto = { path = "../../../../crates/proto" }

# Async
tokio = { version = "1", features = ["full"] }

# Serialization
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"

# Observability
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }
anyhow = "1.0"
