name = "parameter-server-go"
version = "1.0.0"
tenant_id = "default"
seed_nodes = ["localhost:8091", "localhost:8094"]

[supervisor]
strategy = "one_for_one"
max_restarts = 10
max_restart_window_seconds = 60

[[supervisor.children]]
name = "leader"
actor_type = "parameter_server_wasm"
role = "leader"
restart = "permanent"
shutdown_timeout_seconds = 10
args = { role = "leader", num_workers = "4", learning_rate = "0.01", input_dim = "100", hidden_dim = "64", batch_size = "256" }

[[supervisor.children]]
name = "worker"
actor_type = "parameter_server_wasm"
role = "worker"
restart = "permanent"
shutdown_timeout_seconds = 10
args = { role = "worker", batch_size = "256" }
tenant_id = "default"
