# Genomics Pipeline - DNA Sequencing Workflow (Rust WASM app)
#
# GenServer-style WASM actor: run (pipeline), query (status/progress/metrics), signal (pause/resume/cancel).
# Build: ./build.sh (cargo build --target wasm32-wasip1 then wasm-tools component embed + new).
# Test: Start server with ./scripts/server.sh, then ./test.sh [HTTP_PORT].

[workspace]

[package]
name = "genomics-pipeline-wasm"
version = "0.1.0"
edition = "2021"
publish = false
description = "Genomics pipeline WASM actor (QC → Alignment → Variant Calling)"

[lib]
crate-type = ["cdylib"]

[dependencies]
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"

[profile.release]
opt-level = "z"
lto = true
codegen-units = 1
strip = true
