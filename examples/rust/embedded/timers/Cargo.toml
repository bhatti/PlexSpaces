[package]
name = "timers"
version = "0.1.0"
edition = "2021"
publish = false
description = "Session timeout example using PlexSpaces TimerFacet"

[workspace]

[[bin]]
name = "timers"
path = "src/main.rs"

[dependencies]
# PlexSpaces SDK (includes core, actor, macros, TimerFacet)
plexspaces-sdk = { path = "../../../../sdks/rust/plexspaces-sdk" }
plexspaces-behavior = { path = "../../../../crates/behavior" }
plexspaces-actor = { path = "../../../../crates/actor" }  # Required for macro-generated code
plexspaces-node = { path = "../../../../crates/node" }

# Async
tokio = { version = "1", features = ["full"] }

# Serialization
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"

# Observability
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }

# Error handling
anyhow = "1.0"
