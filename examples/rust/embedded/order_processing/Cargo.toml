[package]
name = "order-processing"
version = "0.1.0"
edition = "2021"
license = "AGPL-3.0-or-later"
authors = ["Shahzad A. Bhatti <bhatti@plexobject.com>"]
description = "Order Processing Example - E-Commerce Order Management"

[workspace]

[[bin]]
name = "order_processing"
path = "src/main.rs"

[dependencies]
# PlexSpaces SDK (includes core, actor, macros)
plexspaces-sdk = { path = "../../../../sdks/rust/plexspaces-sdk" }
plexspaces-core = { path = "../../../../crates/core" }
plexspaces-behavior = { path = "../../../../crates/behavior" }
plexspaces-node = { path = "../../../../crates/node" }
anyhow = "1.0"

# ULID for message IDs
ulid = "1.1"

# Async runtime
tokio = { version = "1.0", features = ["full"] }

# Serialization
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"

# Logging
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }
