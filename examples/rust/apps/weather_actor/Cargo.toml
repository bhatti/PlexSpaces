[workspace]

[package]
name = "weather-actor"
version = "0.1.0"
edition = "2021"
license = "LGPL-2.1-or-later"
publish = false
description = "Weather Actor: outbound HTTP service link + KV cache (Rust WASM)"

[lib]
crate-type = ["cdylib", "rlib"]

[target.'cfg(target_arch = "wasm32")'.dependencies]
plexspaces-sdk = { path = "../../../../sdks/rust/plexspaces-sdk", default-features = false }
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
wit-bindgen = "0.51.0"

[target.'cfg(not(target_arch = "wasm32"))'.dependencies]
serde_json = "1.0"

[profile.release]
opt-level = "z"
lto = true
codegen-units = 1
strip = true
