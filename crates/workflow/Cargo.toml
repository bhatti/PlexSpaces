[package]
name = "plexspaces-workflow"
version = "0.1.0"
edition = "2021"
license = "AGPL-3.0-or-later"
description = "Simple, durable workflow orchestration for PlexSpaces"
repository = "https://github.com/bhatti/plexspaces"
authors = ["Shahzad A. Bhatti <bhatti@plexobject.com>"]
keywords = ["workflow", "orchestration", "actors", "durability", "step-functions"]
categories = ["concurrency", "database"]

[dependencies]
# Core PlexSpaces dependencies
plexspaces-actor = { path = "../actor" }
plexspaces-persistence = { path = "../persistence" }
plexspaces-proto = { path = "../proto" }
plexspaces-facet = { path = "../facet" }

# Async runtime
tokio = { workspace = true }
futures = { workspace = true }
async-trait = "0.1"

# Serialization
serde = { workspace = true }
serde_json = { workspace = true }

# Error handling
anyhow = { workspace = true }
thiserror = { workspace = true }

# Logging
tracing = { workspace = true }

# Database (for workflow metadata)
sqlx = { workspace = true }

# AWS DynamoDB backend (optional)
aws-sdk-dynamodb = { version = "1", optional = true }
aws-config = { version = "1", optional = true }
base64 = { version = "0.22", optional = true }

# IDs
ulid = { workspace = true }

# Time
chrono = { workspace = true }

# Observability
metrics = { version = "0.23", optional = true }

# gRPC
tonic = { workspace = true }
prost = { workspace = true }
prost-types = { workspace = true }

[dev-dependencies]
# Testing
tokio-test = { workspace = true }
tempfile = { workspace = true }
# Test helpers for checking DynamoDB Local availability
plexspaces-common = { path = "../common", features = ["test-helpers"] }
# Node for integration tests
plexspaces-node = { path = "../node" }
# Behavior traits for workflow_ref_test
plexspaces-behavior = { path = "../behavior" }

[features]
default = []
sqlite = ["sqlx/sqlite"]
postgres = ["sqlx/postgres"]
ddb-backend = ["aws-sdk-dynamodb", "aws-config", "metrics", "base64"]
