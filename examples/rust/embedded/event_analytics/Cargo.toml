[package]
name = "event-analytics"
version = "0.1.0"
edition = "2021"
license = "LGPL-2.1-or-later"
authors = ["Shahzad A. Bhatti <bhatti@plexobject.com>"]
description = "Event Analytics - Distributed Event Tracking with Shard Groups"

[workspace]

[[bin]]
name = "event_analytics"
path = "src/main.rs"

[dependencies]
# PlexSpaces SDK
plexspaces-sdk = { path = "../../../../sdks/rust/plexspaces-sdk" }
plexspaces-core = { path = "../../../../crates/core" }
plexspaces-behavior = { path = "../../../../crates/behavior" }
plexspaces-node = { path = "../../../../crates/node" }

# Async runtime
tokio = { version = "1", features = ["full"] }
futures = "0.3"

# Serialization
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"

# Logging
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }

# Error handling
anyhow = "1.0"
