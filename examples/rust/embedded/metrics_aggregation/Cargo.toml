[package]
name = "metrics-aggregation"
version = "0.1.0"
edition = "2021"
license = "AGPL-3.0-or-later"
description = "Metrics Aggregation Pipeline - StatsD/OTLP ingestion, window aggregation, anomaly detection"

[workspace]

[[bin]]
name = "metrics_aggregation"
path = "src/main.rs"

[dependencies]
plexspaces-sdk = { path = "../../../../sdks/rust/plexspaces-sdk", features = ["native"] }
plexspaces-actor = { path = "../../../../crates/actor" }
plexspaces-node = { path = "../../../../crates/node" }

tokio = { version = "1", features = ["full"] }
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }
anyhow = "1.0"
futures = "0.3"
