# Temporal → PlexSpaces: Order Fulfillment Workflow Application Configuration
#
# E-commerce order fulfillment with run/signal/query (Workflow behavior):
# - run: validate → reserve inventory → charge → ship (saga with compensation)
# - signal: cancel (request compensation)
# - query: status (read-only)
#
# Equivalent to Temporal:
#   const handle = await client.workflow.start(OrderWorkflow, { taskQueue, workflowId: `order-${id}` });
#   await handle.signal('cancel');
#   await handle.query('status');
#
# Facets:
# - durability: State persistence (order state survives crashes/deactivation)

[supervisor]
strategy = "one_for_one"
max_restarts = 10
max_restart_window_seconds = 60

# Order Fulfillment Workflow (one instance per order; workflow behavior)
# virtual_actor: enables order-fulfillment:order-1, order-fulfillment:order-2, etc. (get_or_activate)
[[supervisor.children]]
name = "order-fulfillment"
actor_type = "migrating_temporal_wasm"
role = "worker"
restart = "permanent"
shutdown_timeout_seconds = 10
behavior_kind = "Workflow"
facets = [
  { type = "virtual_actor", priority = 100, config = { idle_timeout = "10m", activation_strategy = "lazy" } },
  { type = "durability", priority = 90, config = { checkpoint_interval = 100 } }
]
