# Cloudflare Workers Guild Chat Application Configuration (Python)
#
# Deploys a Discord-style chat server with three Durable Object actors:
# - ChatRoomActor:  per-room state, members, message history, fan-out
# - RateLimiterActor: per-user token bucket spam prevention
# - AlarmDemoActor: durable alarm lifecycle (setAlarm equivalent)
#
# Equivalent to a Cloudflare Workers wrangler.toml with:
#   [[durable_objects.bindings]]
#   name = "CHAT_ROOM"
#   class_name = "ChatRoomActor"
#
#   [[durable_objects.bindings]]
#   name = "RATE_LIMITER"
#   class_name = "RateLimiterActor"
#
#   [[durable_objects.bindings]]
#   name = "ALARM_DEMO"
#   class_name = "AlarmDemoActor"

name = "py-cloudflare-guild-chat"
version = "1.0.0"
tenant_id = "default"

[supervisor]
strategy = "one_for_one"
max_restarts = 10
max_restart_window_seconds = 60

# ChatRoomActor (Durable Object: one per room)
[[supervisor.children]]
name = "ChatRoomActor"
actor_type = "ChatRoomActor"
restart = "permanent"
shutdown_timeout_seconds = 10
behavior_kind = "GenServer"
facets = [
  { type = "virtual_actor", priority = 100, config = { idle_timeout = "30m", activation_strategy = "lazy" } },
  { type = "process_group", priority = 90, config = {} }
]

[supervisor.children.args]
max_history = "100"

# RateLimiterActor (Durable Object: per-user rate limiting)
[[supervisor.children]]
name = "RateLimiterActor"
actor_type = "RateLimiterActor"
restart = "permanent"
shutdown_timeout_seconds = 5
behavior_kind = "GenServer"
facets = [
  { type = "virtual_actor", priority = 100, config = { idle_timeout = "20m", activation_strategy = "lazy" } }
]

[supervisor.children.args]
max_tokens = "5"
refill_rate_ms = "1000"

# AlarmDemoActor (Durable Object: durable alarm lifecycle)
# Demonstrates setAlarm/getAlarm/deleteAlarm + batched request processing.
[[supervisor.children]]
name = "AlarmDemoActor"
actor_type = "AlarmDemoActor"
restart = "permanent"
shutdown_timeout_seconds = 5
behavior_kind = "GenServer"
facets = [
  { type = "virtual_actor", priority = 100, config = { idle_timeout = "60m", activation_strategy = "lazy" } },
  { type = "reminder", priority = 80, config = {} }
]

tenant_id = "default"
