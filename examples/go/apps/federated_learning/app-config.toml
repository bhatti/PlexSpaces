name = "go-federated-learning"
version = "1.0.0"
tenant_id = "default"
seed_nodes = ["localhost:8091", "localhost:8094"]

[supervisor]
strategy = "one_for_one"
max_restarts = 10
max_restart_window_seconds = 60

[[supervisor.children]]
name = "aggregator"
actor_type = "federated_learning_wasm"
role = "aggregator"
restart = "permanent"
shutdown_timeout_seconds = 30
args = { role = "aggregator" }

[[supervisor.children]]
name = "client"
actor_type = "federated_learning_wasm"
role = "client"
restart = "permanent"
shutdown_timeout_seconds = 10
args = { role = "client" }
tenant_id = "default"
