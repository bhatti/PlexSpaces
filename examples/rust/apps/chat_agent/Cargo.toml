# SPDX-License-Identifier: AGPL-3.0-or-later
# Chat Agent — Rust WASM (SDK + WIT)

[workspace]

[package]
name = "chat-agent"
version = "1.0.0"
edition = "2021"
license = "AGPL-3.0-or-later"
publish = false
description = "Chat Agent: conversation state in KV, LLM via service link, durable alarm"

[lib]
crate-type = ["cdylib"]

[dependencies]
plexspaces-proto = { path = "../../../../crates/proto", default-features = false }
plexspaces-sdk = { path = "../../../../sdks/rust/plexspaces-sdk", default-features = false }
prost = "0.13"
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
wit-bindgen = "0.51.0"

[profile.release]
opt-level = "z"
lto = true
codegen-units = 1
strip = true
