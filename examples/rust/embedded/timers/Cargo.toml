[package]
name = "timers"
version = "0.1.0"
edition = "2021"
publish = false
description = "Session timeout example using PlexSpaces TimerFacet"

[workspace]

[[bin]]
name = "timers"
path = "src/main.rs"

[dependencies]
# PlexSpaces framework
plexspaces-node = { path = "../../../../crates/node" }
plexspaces-core = { path = "../../../../crates/core" }
plexspaces-actor = { path = "../../../../crates/actor" }
plexspaces-journaling = { path = "../../../../crates/journaling" }
plexspaces-facet = { path = "../../../../crates/facet" }
plexspaces-proto = { path = "../../../../crates/proto" }

# Async
tokio = { version = "1", features = ["full"] }
async-trait = "0.1"

# Serialization
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
