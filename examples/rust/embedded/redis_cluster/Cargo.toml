[package]
name = "redis-cluster"
version = "0.1.0"
edition = "2021"
license = "AGPL-3.0-or-later"
authors = ["Shahzad A. Bhatti <bhatti@plexobject.com>"]
description = "Redis Cluster - Distributed Key-Value Store with Actor Primitives"

[workspace]

[[bin]]
name = "redis_cluster"
path = "src/main.rs"

[dependencies]
# PlexSpaces SDK
plexspaces-sdk = { path = "../../../../sdks/rust/plexspaces-sdk", features = ["native"] }
plexspaces-actor = { path = "../../../../crates/actor" }
plexspaces-node = { path = "../../../../crates/node" }
plexspaces-proto = { path = "../../../../crates/proto" }

# Async runtime
tokio = { version = "1", features = ["full"] }
ulid = "1"
futures = "0.3"

# Serialization
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"

# Logging
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }

# Error handling
anyhow = "1.0"
