# MozartSpaces → PlexSpaces: Distributed auction (Go WASM)
# Convention: auction:coord-1 = auctioneer; bidders inject bids via place_bid.
# Tuple space (host.TS()) + process group (Broadcast) + lock (commit).

[supervisor]
strategy = "one_for_one"
max_restarts = 10
max_restart_window_seconds = 60

[[supervisor.children]]
id = "auction"
type = "worker"
restart = "permanent"
shutdown_timeout_seconds = 10
behavior_kind = "Workflow"
facets = [
  { type = "virtual_actor", priority = 100, config = { idle_timeout = "10m", activation_strategy = "lazy" } },
  { type = "durability", priority = 90, config = { checkpoint_interval = 100 } }
]
