[package]
name = "chat_room"
version = "0.1.0"
edition = "2021"
publish = false

[workspace]

[[bin]]
name = "chat_room"
path = "src/main.rs"

[dependencies]
# PlexSpaces crates (sql-backend for SqliteKVStore :memory:)
plexspaces-process-groups = { path = "../../../../crates/process-groups" }
plexspaces-keyvalue = { path = "../../../../crates/keyvalue" }
plexspaces-actor = { path = "../../../../crates/actor" }
plexspaces-node = { path = "../../../../crates/node" }

# Async runtime
tokio = { version = "1", features = ["full"] }

# Serialize chat messages for publish_to_group
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"

# Logging
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }