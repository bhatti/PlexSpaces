# EFlows4HPC Ensemble - Rust WASM app (SDK + WIT)
#
# Tuple space (ts_write, ts_take, ts_read_all) + process group (pg_join, pg_broadcast).
# Build: ./build.sh

[workspace]

[package]
name = "migrating-eflows4hpc-wasm"
version = "0.1.0"
edition = "2021"
license = "AGPL-3.0-or-later"
publish = false
description = "HPC Ensemble WASM actor (EFlows4HPC-style, tuple space + process group)"

[lib]
crate-type = ["cdylib"]

[dependencies]
plexspaces-proto = { git = "https://github.com/bhatti/plexspaces", tag = "v0.1.1", default-features = false }
plexspaces-sdk   = { git = "https://github.com/bhatti/plexspaces", tag = "v0.1.1", default-features = false }
prost            = "0.13"
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
wit-bindgen = "0.51.0"

[profile.release]
opt-level = "z"
lto = true
codegen-units = 1
strip = true
