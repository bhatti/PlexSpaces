name = "ring-allreduce-rust"
version = "1.0.0"
namespace = "ring-allreduce-rust"
seed_nodes = ["localhost:8091", "localhost:8093"]

[supervisor]
strategy = "one_for_one"
max_restarts = 10
max_restart_window_seconds = 60

[[supervisor.children]]
name = "leader"
actor_type = "ring_allreduce_wasm"
role = "leader"
restart = "permanent"
shutdown_timeout_seconds = 10
args = { role = "leader" }

[[supervisor.children]]
name = "worker"
actor_type = "ring_allreduce_wasm"
role = "worker"
restart = "permanent"
shutdown_timeout_seconds = 10
args = { role = "worker" }
