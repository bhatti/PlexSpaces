# Entity recognition (document → entities) — Rust WASM (SDK + WIT)
#
# Simplified single-actor pipeline. For multi-actor FSM/GenServer/GenEvent native demo see
# `examples/rust/embedded/entity_recognition/`.

[workspace]

[package]
name = "entity-recognition-wasm"
version = "0.1.0"
edition = "2021"
license = "AGPL-3.0-or-later"
publish = false
description = "Entity extraction WASM actor (simplified rules + metrics)"

[lib]
crate-type = ["cdylib"]

[dependencies]
plexspaces-proto = { path = "../../../../crates/proto", default-features = false }
plexspaces-sdk = { path = "../../../../sdks/rust/plexspaces-sdk", default-features = false }
prost            = "0.13"
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
wit-bindgen = "0.51.0"

[profile.release]
opt-level = "z"
lto = true
codegen-units = 1
strip = true
