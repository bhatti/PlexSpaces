[package]
name = "bank_account"
version = "0.1.0"
edition = "2021"
publish = false

[workspace]

[[bin]]
name = "bank_account"
path = "src/main.rs"

[dependencies]
# PlexSpaces SDK
plexspaces-sdk = { git = "https://github.com/bhatti/plexspaces", tag = "v0.1.1" }
plexspaces-journaling = { path = "../../../../crates/journaling" }

# Node and core
plexspaces-node = { path = "../../../../crates/node" }
plexspaces-actor = { path = "../../../../crates/actor" }
plexspaces-behavior = { path = "../../../../crates/behavior" }

# Async runtime
tokio = { version = "1", features = ["full"] }

# Serialization
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"

# Logging
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }

# Utilities
anyhow = "1.0"
chrono = { version = "0.4", features = ["serde"] }
ulid = "1.1"
