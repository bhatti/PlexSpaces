# Proc-macro crate for PlexSpaces Rust SDK (annotations like Python decorators)
# Use: #[actor], #[handler("msg_type")] to reduce boilerplate

[package]
name = "plexspaces-sdk-macros"
version = "0.1.0"
edition = "2021"
description = "Procedural macros for PlexSpaces Rust SDK"
repository = "https://github.com/plexobject/plexspaces"
homepage = "https://github.com/plexobject/plexspaces"
keywords = ["actors", "distributed", "macros", "tuplespace"]
categories = ["concurrency", "distributed-systems"]
license = "AGPL-3.0-or-later"

[lib]
proc-macro = true

[dependencies]
syn = { version = "2.0", features = ["full"] }
quote = "1.0"
proc-macro2 = "1.0"
