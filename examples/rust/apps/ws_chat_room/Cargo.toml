# WebSocket Chat Room (Rust WASM)

[workspace]

[package]
name = "rust-ws-chat-room"
version = "1.0.0"
edition = "2021"
license = "AGPL-3.0-or-later"
publish = false
description = "WebSocket chat room WASM actor — Rust port of the TypeScript ws_chat_room example"

[lib]
crate-type = ["cdylib"]

[dependencies]
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
wit-bindgen = "0.51.0"

[profile.release]
opt-level = "z"
lto = true
codegen-units = 1
strip = true
