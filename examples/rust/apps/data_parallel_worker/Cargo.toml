# Data-parallel worker — Rust WASM (SDK + WIT)
#
# Data-parallel demo: leader uses host scatter/gather over a shard group (primary DPA pattern).
# Same SDK/WIT stack as parameter_server; different app id and handler name (process_shard_work).
# Build: ./build.sh
# Test: ./test.sh [nodes...]

[workspace]

[package]
name = "data-parallel-worker-wasm"
version = "0.1.0"
edition = "2021"
publish = false
description = "Data-parallel WASM: shard group + scatter/gather rounds + full metrics"

[lib]
crate-type = ["cdylib"]

[dependencies]
plexspaces-proto = { path = "../../../../crates/proto", default-features = false }
plexspaces-sdk = { path = "../../../../sdks/rust/plexspaces-sdk", default-features = false }
prost            = "0.13"
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
wit-bindgen = "0.51.0"

[profile.release]
opt-level = "z"
lto = true
codegen-units = 1
strip = true
