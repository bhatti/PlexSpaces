[package]
name = "plexspaces-actor"
version.workspace = true
authors.workspace = true
edition.workspace = true
license.workspace = true
repository.workspace = true
keywords.workspace = true
categories.workspace = true
description = "Core actor implementation for PlexSpaces"

[dependencies]
plexspaces-service-traits = { path = "../service-traits" }
plexspaces-mailbox = { workspace = true }
plexspaces-persistence = { workspace = true }
plexspaces-facet = { workspace = true }
plexspaces-proto = { workspace = true }
plexspaces-keyvalue = { workspace = true }
plexspaces-tuplespace = { workspace = true }
plexspaces-locks = { path = "../locks" }
plexspaces-journaling = { path = "../journaling" }
plexspaces-common = { path = "../common" }
indexmap = { version = "2.0", features = ["serde"] }

# Core dependencies
tokio = { workspace = true }
async-trait = { workspace = true }
thiserror = { workspace = true }
serde = { workspace = true }
serde_json = { workspace = true }
chrono = { workspace = true }
uuid = { workspace = true }
ulid = "1.1"
futures = { workspace = true }
prost = { workspace = true }
prost-types = { workspace = true }
tonic = { workspace = true }
tonic-health = { workspace = true }  # From plexspaces-core
once_cell = "1.19"  # From plexspaces-core
rand = "0.8"
sysinfo = { workspace = true }  # From plexspaces-core

# HTTP client for test_helpers
reqwest = { version = "0.12", default-features = true, features = ["json"] }

# Observability (CRITICAL - production-ready observability)
metrics = "0.23"
tracing = { workspace = true }

[dev-dependencies]
tokio-test = { version = "0.4" }
pretty_assertions = { version = "1.4" }
plexspaces-services = { path = "../services" }
plexspaces-object-registry = { path = "../object-registry" }
plexspaces-node = { path = "../node" }
tracing-subscriber = { version = "0.3", features = ["env-filter"] }
tokio-stream = { workspace = true }

[lib]
name = "plexspaces_actor"
path = "src/lib.rs"
