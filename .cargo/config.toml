[build]
# Keep all workspace and example builds in the shared top-level target directory
target-dir = "target"
# Enable incremental compilation for faster local rebuilds
incremental = true

[net]
git-fetch-with-cli = false

[registries.crates-io]
# Sparse index reduces dependency metadata fetch time
protocol = "sparse"

[http]
multiplexing = true

[env]
# Enable incremental compilation in shells that invoke cargo outside the Makefile.
CARGO_INCREMENTAL = "1"
# Compiler cache: enabled when sccache is installed (brew install sccache).
# Falls back gracefully to no-cache if binary is absent.
RUSTC_WRAPPER = "sccache"

[target.'cfg(target_os = "linux")']
# Optimize compilation flags for faster builds on Linux
# Use lld linker for faster linking (only available on Linux)
rustflags = [
    "-C", "link-arg=-fuse-ld=lld",
]

[target.'cfg(target_os = "macos")']
# Work around Apple clang/ld crashes seen when linking large test binaries.
# Alternative: `brew install llvm` then use `-C linker=clang -C link-arg=-fuse-ld=lld`
rustflags = [
    "-C", "link-arg=-Wl,-ld_classic",
]

# Windows uses the default linker (no special flags needed)
