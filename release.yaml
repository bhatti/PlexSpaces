# PlexSpaces Release Configuration
# Generated by: plexspaces generate-release-config
# 
# This file defines the complete system configuration for a PlexSpaces node.
# Customize as needed for your deployment.

name: my-cluster
version: 1.0.0
description: "PlexSpaces release for node my-node"

node:
  id: my-node
  listen_addr: 0.0.0.0:8091
  cluster_seed_nodes: []
  wasm_apps_directory: ""

runtime:
  db:
    connection_string: ""
    pool_size: 10
    auto_migrate: true

  grpc:
    enabled: true
    address: 0.0.0.0:8091
    max_connections: 100
    keepalive_interval_seconds: 30
    middleware: []
  
  # Blob storage configuration for local development.
  # Uses local filesystem backend; set backend: embedded for auto-started embedded object store.
  blob:
    backend: local
    bucket: plexspaces-blobs
    endpoint: ""
    region: ""
    access_key_id: ""
    secret_access_key: ""
    use_ssl: false
    prefix: "/tmp/plexspaces-blobs"

  # Default outbound HTTP links used by bundled weather_actor examples.
  service_links:
    - name: weather-api
      transport: HTTP
      base_url: "https://api.open-meteo.com"
      publish_to_registry: false
  
  health:
    heartbeat_interval_seconds: 5
    heartbeat_timeout_seconds: 30
    registry_url: ""
  
  security:
    jwt:
      enable_jwt: true
      # JWT secret should be set via PLEXSPACES_JWT_SECRET env var
      secret: ""  # Leave empty - will be read from PLEXSPACES_JWT_SECRET
      issuer: ""
      jwks_url: ""  # For RS256, set this instead of secret
      allowed_audiences:
        - "plexspaces-api"
      tenant_id_claim: "tenant_id"
      user_id_claim: "sub"
    
    mtls:
      enable_mtls: true
      auto_generate_certs: true  # Auto-generate for development
      cert_dir: "./certs"
      # Or specify paths for production:
      # ca_certificate: "/certs/ca.crt"
      # client_certificate: "/certs/server.crt"
      # client_private_key: "/certs/server.key"
    
    disable_auth: true

system_applications: []

applications: []

env: {}

shutdown:
  graceful_timeout_seconds: 30
  force_timeout_seconds: 10
