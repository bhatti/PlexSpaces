# Job Queue Outbox Application Configuration (Rust WASM)
#
# Leader-only config — workers are created at runtime via CreateShardGroup.
# The leader spawns 1000 JobQueueWorker shards across available nodes.
#
# Demonstrates:
#   - create_shard_group WIT call to provision 1000 virtual workers
#   - outbox_dispatch WIT call with AIMD flow control
#   - ask WIT call for upgrade simulation (request-reply to workers)
#   - OVERWRITE conflict resolution for LWW heartbeat deduplication

name = "rust-job-queue-outbox"
version = "1.0.0"
tenant_id = "default"

[supervisor]
strategy = "one_for_one"
max_restarts = 10
max_restart_window_seconds = 60

# Leader: creates workers via CreateShardGroup, dispatches via outbox
[[supervisor.children]]
name = "leader"
actor_type = "JobQueueOutboxCoordinator"
restart = "permanent"
shutdown_timeout_seconds = 10
behavior_kind = "GenServer"
facets = [
  { type = "virtual_actor", priority = 100, config = { idle_timeout = "30m", activation_strategy = "lazy" } }
]

# Worker prototype — registers JobQueueWorker with BehaviorRegistry for CreateShardGroup.
[[supervisor.children]]
name = "worker-proto"
actor_type = "JobQueueWorker"
restart = "permanent"
shutdown_timeout_seconds = 10
behavior_kind = "GenServer"
facets = [
  { type = "virtual_actor", priority = 100, config = { idle_timeout = "5m", activation_strategy = "lazy" } }
]
