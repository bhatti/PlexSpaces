syntax = "proto3";

package plexspaces.node.v1;
option go_package = "github.com/bhatti/plexspaces/gen/go/plexspaces/v1/node/node;plexspaces_node_v1";

import "google/api/annotations.proto";
import "google/api/field_behavior.proto";
import "google/protobuf/timestamp.proto";
import "google/protobuf/duration.proto";
import "google/protobuf/struct.proto";
import "google/protobuf/any.proto";
import "protoc-gen-openapiv2/options/annotations.proto";
import "plexspaces/v1/common.proto";
import "plexspaces/v1/actors/actor_runtime.proto";
import "plexspaces/v1/security/security.proto";
import "plexspaces/v1/node/release.proto";


option (grpc.gateway.protoc_gen_openapiv2.options.openapiv2_swagger) = {
  info: {
    title: "PlexSpace Node API";
    version: "1.0";
    description: "Internal API for node management (process/kubernetes/firecracker)";
  };
  schemes: HTTPS;
  consumes: "application/json";
  produces: "application/json";
};

// Node represents a runtime host for actors
// Can be a simple process, Kubernetes pod, or Firecracker VM
message Node {
  option (grpc.gateway.protoc_gen_openapiv2.options.openapiv2_schema) = {
    json_schema: {
      title: "Node"
      description: "Runtime host for actors"
      required: ["id", "node_type"]
    }
  };

  string id = 1 [(google.api.field_behavior) = REQUIRED];
  NodeType node_type = 2 [(google.api.field_behavior) = REQUIRED];
  NodeStatus status = 3 [(google.api.field_behavior) = OUTPUT_ONLY];
  NodeCapabilities capabilities = 4;
  plexspaces.common.v1.Metadata metadata = 5;
  google.protobuf.Timestamp created_at = 6 [(google.api.field_behavior) = OUTPUT_ONLY];
  google.protobuf.Timestamp last_heartbeat = 7 [(google.api.field_behavior) = OUTPUT_ONLY];


  // Current actors hosted on this node
  repeated string actor_ids = 20;

  // Resource metrics
  NodeMetrics metrics = 21;

  // mTLS identity for node-to-node communication
  //
  // Used for service-to-service authentication.
  // Nodes register their public certificate in object-registry.
  plexspaces.security.v1.ServiceIdentity mtls_identity = 22;

  // Public certificate (PEM format) for object-registry registration
  //
  // Other nodes can fetch this certificate for mTLS verification.
  // Stored in object-registry for service discovery.
  bytes public_certificate = 23;

  // Auto-generate certificates if not provided (for local dev/testing)
  //
  // Security: Only for local development. Production should use proper cert management.
  bool auto_generate_certs = 24;

  // Cluster name for grouping nodes that share UDP/ZeroMQ channels
  //
  // Nodes with the same cluster_name can communicate via UDP multicast
  // or ZeroMQ channels. Used for service discovery and channel configuration.
  // If empty, node is not part of any cluster.
  string cluster_name = 25;
}

// Node type enumeration
enum NodeType {
  NODE_TYPE_UNSPECIFIED = 0;
  NODE_TYPE_PROCESS = 1;       // Simple OS process
  NODE_TYPE_KUBERNETES = 2;    // Kubernetes pod
  NODE_TYPE_FIRECRACKER = 3;   // Firecracker microVM
}

// Node status
enum NodeStatus {
  NODE_STATUS_UNSPECIFIED = 0;
  NODE_STATUS_STARTING = 1;
  NODE_STATUS_READY = 2;
  NODE_STATUS_BUSY = 3;
  NODE_STATUS_DRAINING = 4;
  NODE_STATUS_STOPPED = 5;
  NODE_STATUS_FAILED = 6;
}

// Node capabilities
message NodeCapabilities {
  uint32 max_actors = 1;
  uint64 memory_bytes = 2;
  uint32 cpu_millicores = 3;
  bool supports_wasm = 4;
  bool supports_isolation = 5;
  repeated string supported_runtimes = 6;
}


// Node metrics (combined resource usage and operational metrics)
//
// ## Purpose
// Comprehensive metrics for a PlexSpaces node, including both resource usage
// (CPU, memory) and operational metrics (messages, actors, connections).
//
// ## Design
// Proto-first design: All node metrics are defined in proto for:
// - Wire compatibility (gRPC metrics APIs)
// - Language-agnostic observability
// - Consistent metrics semantics across implementations
//
// ## Metrics Categories
// - Resource metrics: CPU, memory, uptime
// - Operational metrics: Messages routed, actors, connections
// - All combined in one message for efficient querying
message NodeMetrics {
  // Resource usage metrics
  uint64 memory_used_bytes = 1;
  uint64 memory_available_bytes = 2;
  double cpu_usage_percent = 3;
  uint64 uptime_seconds = 4;

  // Operational metrics
  // Total messages routed through this node
  uint64 messages_routed = 5;
  // Local message deliveries (same node)
  uint64 local_deliveries = 6;
  // Remote message deliveries (different node)
  uint64 remote_deliveries = 7;
  // Failed message deliveries
  uint64 failed_deliveries = 8;
  // Actor and connection metrics
  // Active actors on this node
  uint32 active_actors = 9;
  // Connected nodes in cluster
  uint32 connected_nodes = 10;
  
  // Node identity (for components that need node info without depending on Node type)
  // Node ID for this metrics instance
  string node_id = 11;
  // Cluster name for this node (from node config)
  string cluster_name = 12;
}

// Request to register a node
message RegisterNodeRequest {
  Node node = 1 [(google.api.field_behavior) = REQUIRED];
}

// Response for node registration
message RegisterNodeResponse {
  string node_id = 1;
  google.protobuf.Timestamp registered_at = 2;
}

// Request to unregister a node
message UnregisterNodeRequest {
  string node_id = 1 [(google.api.field_behavior) = REQUIRED];
  bool force = 2;
}

// Request to get node status
message GetNodeRequest {
  string node_id = 1 [(google.api.field_behavior) = REQUIRED];
}

// Request to list nodes
message ListNodesRequest {
  NodeType node_type = 1;
  NodeStatus status = 2;
  int32 page_size = 3;
  string page_token = 4;
}

// Response for list nodes
message ListNodesResponse {
  repeated Node nodes = 1;
  string next_page_token = 2;
  int32 total_count = 3;
}

// Request to assign an actor to a node
message AssignActorRequest {
  string node_id = 1 [(google.api.field_behavior) = REQUIRED];
  string actor_id = 2 [(google.api.field_behavior) = REQUIRED];
  plexspaces.actor.v1.ActorConfig config = 3;
}

// Response for actor assignment
message AssignActorResponse {
  string node_id = 1;
  string actor_id = 2;
  google.protobuf.Timestamp assigned_at = 3;
}

// Request to remove an actor from a node
message RemoveActorRequest {
  string node_id = 1 [(google.api.field_behavior) = REQUIRED];
  string actor_id = 2 [(google.api.field_behavior) = REQUIRED];
  bool graceful = 3;
}

// ============================================================================
// ORBIT-INSPIRED: DISTRIBUTED ACTOR LOCK
// ============================================================================
// Ensures single activation guarantee across cluster

// Distributed actor lock (Orbit-inspired)
message ActorLock {
  string actor_id = 1;
  string node_id = 2;  // Node that holds the lock
  google.protobuf.Timestamp acquired_at = 3;
  google.protobuf.Duration lease_duration = 4;
  string lock_token = 5;  // Unique token for this lock
}

message AcquireActorLockRequest {
  string actor_id = 1 [(google.api.field_behavior) = REQUIRED];
  string requesting_node_id = 2 [(google.api.field_behavior) = REQUIRED];
  google.protobuf.Duration lease_duration = 3;
}

message AcquireActorLockResponse {
  bool success = 1;
  ActorLock lock = 2;
  string conflict_node_id = 3;  // If failed, who has it
}

message ReleaseActorLockRequest {
  string actor_id = 1 [(google.api.field_behavior) = REQUIRED];
  string lock_token = 2 [(google.api.field_behavior) = REQUIRED];
}

// ============================================================================
// WASMCLOUD-INSPIRED: LATTICE MESH NETWORKING
// ============================================================================
// Self-forming, self-healing node discovery

// Node discovery and mesh (wasmCloud-inspired)
message NodeDiscovery {
  string node_id = 1;
  string node_address = 2;
  map<string, string> capabilities = 3;
  NodeHealth health = 4;
  google.protobuf.Timestamp last_heartbeat = 5;
}

// Node health information
message NodeHealth {
  double cpu_usage = 1;
  uint64 memory_usage_mb = 2;
  uint32 active_actors = 3;
  bool is_available = 4;
}

// Node registration for distributed node discovery
// Used by NodeRegistry for node lookup and health tracking
message NodeRegistration {
  string node_id = 1;
  string node_address = 2;  // gRPC address (e.g., "http://localhost:8000")
  map<string, string> capabilities = 3;
  NodeStatus status = 4;
  google.protobuf.Timestamp last_heartbeat = 5;
  uint64 actor_count = 6;
  uint64 message_count = 7;
  uint64 error_count = 8;
  google.protobuf.Timestamp registered_at = 9;
}

// Node capacity for resource-aware scheduling
message NodeCapacity {
  // Total resources available on node
  plexspaces.common.v1.ResourceSpec total = 1;
  
  // Allocated resources (currently in use)
  plexspaces.common.v1.ResourceSpec allocated = 2;
  
  // Available resources (total - allocated)
  plexspaces.common.v1.ResourceSpec available = 3;
  
  // Node labels (for label-based matching)
  map<string, string> labels = 4;
}

// Node metadata for scheduling
message NodeMetadata {
  // Node labels (for label-based matching)
  map<string, string> labels = 1;
  
  // Node annotations (for extensibility)
  map<string, string> annotations = 2;
}

// Node health status
enum NodeHealthStatus {
  NODE_HEALTH_STATUS_UNSPECIFIED = 0;
  NODE_HEALTH_STATUS_HEALTHY = 1;
  NODE_HEALTH_STATUS_DEGRADED = 2;
  NODE_HEALTH_STATUS_UNHEALTHY = 3;
}

// Heartbeat message
message Heartbeat {
  string node_id = 1;
  google.protobuf.Timestamp timestamp = 2;
  NodeHealth health = 3;
  // Node capacity for resource-aware scheduling
  NodeCapacity capacity = 4;
}

// Lattice service requests
message JoinLatticeRequest {
  NodeDiscovery node = 1 [(google.api.field_behavior) = REQUIRED];
}

message JoinLatticeResponse {
  bool success = 1;
  repeated NodeDiscovery existing_nodes = 2;
}

message LeaveLatticeRequest {
  string node_id = 1 [(google.api.field_behavior) = REQUIRED];
}

message DiscoverNodesRequest {
  map<string, string> capability_filters = 1;
}

message DiscoverNodesResponse {
  repeated NodeDiscovery nodes = 1;
}

// ============================================================================
// NODE SERVICE - Node Management gRPC Service
// ============================================================================

// NodeService provides node management operations
//
// ## Purpose
// Centralized service for:
// - Node registration and discovery
// - Health and metrics reporting
// - Capacity calculation
// - Application listing on nodes
//
// ## Design
// - Replaces direct Node methods with gRPC service
// - Uses ServiceLocator for accessing required services
// - Supports pagination and streaming for scalability
service NodeService {
  // Get release specification for a node
  rpc GetReleaseSpec(GetReleaseSpecRequest) returns (GetReleaseSpecResponse) {
    option (google.api.http) = {
      get: "/api/v1/nodes/{node_id}/release-spec"
    };
    option (grpc.gateway.protoc_gen_openapiv2.options.openapiv2_operation) = {
      summary: "Get release specification for node"
      description: "Returns the release specification configured for the node"
    };
  }

  // Register one or more nodes (replaces connect_to)
  rpc RegisterNodes(RegisterNodesRequest) returns (RegisterNodesResponse) {
    option (google.api.http) = {
      post: "/api/v1/nodes:register"
      body: "*"
    };
    option (grpc.gateway.protoc_gen_openapiv2.options.openapiv2_operation) = {
      summary: "Register nodes"
      description: "Registers one or more nodes in the cluster"
    };
  }

  // Unregister a node
  rpc UnregisterNode(UnregisterNodeRequest) returns (UnregisterNodeResponse) {
    option (google.api.http) = {
      delete: "/api/v1/nodes/{node_id}"
    };
    option (grpc.gateway.protoc_gen_openapiv2.options.openapiv2_operation) = {
      summary: "Unregister a node"
      description: "Removes a node from the cluster"
    };
  }

  // List connected nodes (paginated)
  rpc ListConnectedNodes(ListConnectedNodesRequest) returns (ListConnectedNodesResponse) {
    option (google.api.http) = {
      get: "/api/v1/nodes"
    };
    option (grpc.gateway.protoc_gen_openapiv2.options.openapiv2_operation) = {
      summary: "List connected nodes"
      description: "Returns list of connected nodes with pagination"
    };
  }

  // Stream connected nodes (for large clusters)
  rpc StreamConnectedNodes(StreamConnectedNodesRequest) returns (stream NodeRegistration) {
    option (google.api.http) = {
      post: "/api/v1/nodes:stream"
      body: "*"
    };
  }

  // Get node metrics
  rpc GetMetrics(GetMetricsRequest) returns (NodeMetrics) {
    option (google.api.http) = {
      get: "/api/v1/nodes/{node_id}/metrics"
    };
    option (grpc.gateway.protoc_gen_openapiv2.options.openapiv2_operation) = {
      summary: "Get node metrics"
      description: "Returns CPU, memory, and operational metrics for a node"
    };
  }

  // Calculate node capacity
  rpc CalculateCapacity(CalculateCapacityRequest) returns (NodeCapacity) {
    option (google.api.http) = {
      get: "/api/v1/nodes/{node_id}/capacity"
    };
    option (grpc.gateway.protoc_gen_openapiv2.options.openapiv2_operation) = {
      summary: "Calculate node capacity"
      description: "Returns total, allocated, and available resources"
    };
  }

  // List applications deployed on a node
  rpc ListNodeApplications(ListNodeApplicationsRequest) returns (ListNodeApplicationsResponse) {
    option (google.api.http) = {
      get: "/api/v1/nodes/{node_id}/applications"
    };
    option (grpc.gateway.protoc_gen_openapiv2.options.openapiv2_operation) = {
      summary: "List applications on node"
      description: "Returns list of applications deployed on the node"
    };
  }

  // Get node health status
  rpc GetHealth(GetHealthRequest) returns (GetHealthResponse) {
    option (google.api.http) = {
      get: "/api/v1/nodes/{node_id}/health"
    };
    option (grpc.gateway.protoc_gen_openapiv2.options.openapiv2_operation) = {
      summary: "Get node health"
      description: "Returns health status for the node"
    };
  }

  // Send heartbeat (used by nodes to report liveness)
  rpc SendHeartbeat(SendHeartbeatRequest) returns (SendHeartbeatResponse) {
    option (google.api.http) = {
      post: "/api/v1/nodes/{node_id}:heartbeat"
      body: "*"
    };
  }

  // ============================================================================
  // SWIM Protocol RPCs - Scalable Failure Detection
  // ============================================================================
  // These RPCs implement the SWIM protocol for robust node discovery without
  // requiring a shared database. Based on the SWIM paper (Das et al., 2002).

  // Direct ping - Primary failure detection
  // Used to check if a node is alive. Fast, low-overhead.
  rpc Ping(PingRequest) returns (PingResponse) {
    option (google.api.http) = {
      post: "/api/v1/nodes:ping"
      body: "*"
    };
    option (grpc.gateway.protoc_gen_openapiv2.options.openapiv2_operation) = {
      summary: "Ping a node"
      description: "SWIM protocol direct ping for failure detection"
    };
  }

  // Indirect ping request - Fallback failure detection
  // If direct ping fails, ask intermediary nodes to ping the suspect.
  // This reduces false positives from asymmetric network partitions.
  rpc PingReq(PingReqRequest) returns (PingReqResponse) {
    option (google.api.http) = {
      post: "/api/v1/nodes:ping-req"
      body: "*"
    };
    option (grpc.gateway.protoc_gen_openapiv2.options.openapiv2_operation) = {
      summary: "Indirect ping request"
      description: "SWIM protocol indirect ping for robust failure detection"
    };
  }

  // Sync membership state - Anti-entropy protocol
  // Periodic full state sync to ensure consistency across nodes.
  rpc SyncMembership(SyncMembershipRequest) returns (SyncMembershipResponse) {
    option (google.api.http) = {
      post: "/api/v1/nodes:sync"
      body: "*"
    };
    option (grpc.gateway.protoc_gen_openapiv2.options.openapiv2_operation) = {
      summary: "Sync membership state"
      description: "Full membership state sync for anti-entropy"
    };
  }
}

// GetReleaseSpec request
message GetReleaseSpecRequest {
  string node_id = 1 [(google.api.field_behavior) = REQUIRED];
}

// GetReleaseSpec response
message GetReleaseSpecResponse {
  ReleaseSpec release_spec = 1;
}

// RegisterNodes request - supports multiple nodes
message RegisterNodesRequest {
  // Nodes to register
  repeated NodeRegistration nodes = 1 [(google.api.field_behavior) = REQUIRED];
  // Cluster name for grouping
  string cluster = 2;
  // Labels for categorization
  map<string, string> labels = 3;
}

// RegisterNodes response
message RegisterNodesResponse {
  // IDs of successfully registered nodes
  repeated string registered_node_ids = 1;
  // Errors for nodes that failed to register
  map<string, string> errors = 2;
}

// UnregisterNode response
message UnregisterNodeResponse {
  bool success = 1;
}

// ListConnectedNodes request (paginated)
message ListConnectedNodesRequest {
  // Filter by cluster name
  string cluster = 1;
  // Page size (default: 100, max: 1000)
  int32 page_size = 2;
  // Page token for pagination
  string page_token = 3;
  // Include health status in response
  bool include_health = 4;
}

// ListConnectedNodes response
message ListConnectedNodesResponse {
  // List of node registrations
  repeated NodeRegistration nodes = 1;
  // Token for next page
  string next_page_token = 2;
  // Total count (if available)
  int32 total_count = 3;
}

// StreamConnectedNodes request
message StreamConnectedNodesRequest {
  // Filter by cluster name
  string cluster = 1;
  // Include health status
  bool include_health = 2;
}

// GetMetrics request
message GetMetricsRequest {
  string node_id = 1 [(google.api.field_behavior) = REQUIRED];
  // Include extended metrics (actor details, etc.)
  bool include_extended = 2;
}

// CalculateCapacity request
message CalculateCapacityRequest {
  string node_id = 1 [(google.api.field_behavior) = REQUIRED];
}

// ListNodeApplications request
message ListNodeApplicationsRequest {
  string node_id = 1 [(google.api.field_behavior) = REQUIRED];
  // Page size
  int32 page_size = 2;
  // Page token
  string page_token = 3;
  // Filter by status
  string status_filter = 4;
}

// ListNodeApplications response
message ListNodeApplicationsResponse {
  repeated NodeApplicationInfo applications = 1;
  string next_page_token = 2;
  int32 total_count = 3;
}

// NodeApplicationInfo - Information about an application on a node
message NodeApplicationInfo {
  string name = 1;
  string version = 2;
  string status = 3;
  google.protobuf.Timestamp started_at = 4;
  int32 actor_count = 5;
  map<string, string> metadata = 6;
}

// GetHealth request
message GetHealthRequest {
  string node_id = 1 [(google.api.field_behavior) = REQUIRED];
}

// GetHealth response
message GetHealthResponse {
  NodeHealthStatus status = 1;
  string message = 2;
  google.protobuf.Timestamp last_checked = 3;
  map<string, string> details = 4;
}

// SendHeartbeat request
message SendHeartbeatRequest {
  string node_id = 1 [(google.api.field_behavior) = REQUIRED];
  NodeCapacity capacity = 2;
  map<string, double> metrics = 3;
}

// SendHeartbeat response
message SendHeartbeatResponse {
  bool acknowledged = 1;
  google.protobuf.Timestamp server_time = 2;
}

// ============================================================================
// SWIM Protocol Messages
// ============================================================================

// Ping request - Direct failure detection
message PingRequest {
  // Source node sending the ping
  string source_node_id = 1;
  // Sequence number for correlation
  uint64 sequence_number = 2;
  // Piggybacked membership updates (for efficient dissemination)
  repeated MembershipUpdate updates = 3;
}

// Ping response
message PingResponse {
  // Responding node's ID
  string node_id = 1;
  // Echo back sequence number
  uint64 sequence_number = 2;
  // Current incarnation number (for conflict resolution)
  uint64 incarnation = 3;
  // Piggybacked membership updates
  repeated MembershipUpdate updates = 4;
}

// Indirect ping request - Ask intermediary to ping target
message PingReqRequest {
  // Node requesting the indirect ping
  string source_node_id = 1;
  // Target node to ping
  string target_node_id = 2;
  // Target's address (in case intermediary doesn't know it)
  string target_address = 3;
  // Sequence number for correlation
  uint64 sequence_number = 4;
}

// Indirect ping response
message PingReqResponse {
  // Whether the target responded to indirect ping
  bool target_alive = 1;
  // Target's incarnation (if alive)
  uint64 target_incarnation = 2;
  // Piggybacked membership updates
  repeated MembershipUpdate updates = 3;
}

// Membership update - Piggybacked on protocol messages
message MembershipUpdate {
  // Node ID this update is about
  string node_id = 1;
  // Node address
  string address = 2;
  // Membership state
  MemberState state = 3;
  // Incarnation number (higher wins)
  uint64 incarnation = 4;
  // Metadata/capabilities
  map<string, string> metadata = 5;
}

// Membership state enum
enum MemberState {
  MEMBER_STATE_UNSPECIFIED = 0;
  MEMBER_STATE_ALIVE = 1;
  MEMBER_STATE_SUSPECT = 2;
  MEMBER_STATE_DEAD = 3;
  MEMBER_STATE_LEFT = 4;
}

// Sync membership request - Full state exchange
message SyncMembershipRequest {
  // Requesting node's ID
  string source_node_id = 1;
  // Requesting node's full membership state
  repeated MembershipUpdate members = 2;
  // Whether this is a push (true) or pull (false) sync
  bool is_push = 3;
}

// Sync membership response
message SyncMembershipResponse {
  // Responding node's full membership state
  repeated MembershipUpdate members = 1;
  // Number of updates received that were new/updated
  int32 updates_applied = 2;
}

