name = "ts-parameter-server"
version = "1.0.0"
tenant_id = "default"
seed_nodes = ["localhost:8091", "localhost:8094"]

[supervisor]
strategy = "one_for_one"
max_restarts = 10
max_restart_window_seconds = 60

[[supervisor.children]]
name = "leader"
actor_type = "ts_parameter_server_wasm"
role = "leader"
restart = "permanent"
shutdown_timeout_seconds = 30
behavior_kind = "GenServer"
facets = [
  { type = "virtual_actor", priority = 100, config = { idle_timeout = "1h", activation_strategy = "lazy" } }
]

[supervisor.children.args]
role = "leader"
num_workers = "4"
learning_rate = "0.01"
input_dim = "100"
hidden_dim = "64"
batch_size = "256"

[[supervisor.children]]
name = "worker"
actor_type = "ts_parameter_server_wasm"
role = "worker"
restart = "permanent"
shutdown_timeout_seconds = 10
behavior_kind = "GenServer"
facets = [
  { type = "virtual_actor", priority = 100, config = { idle_timeout = "1h", activation_strategy = "lazy" } }
]

[supervisor.children.args]
role = "worker"
batch_size = "256"
input_dim = "100"
hidden_dim = "64"
