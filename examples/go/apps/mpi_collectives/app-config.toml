name = "mpi-collectives-go"
version = "1.0.0"
tenant_id = "default"
seed_nodes = ["localhost:8091", "localhost:8094"]

[supervisor]
strategy = "one_for_one"
max_restarts = 10
max_restart_window_seconds = 60

[[supervisor.children]]
name = "leader"
actor_type = "mpi_collectives_wasm"
role = "leader"
restart = "permanent"
shutdown_timeout_seconds = 10
args = { role = "leader", worker_count = "8", elements_per_worker = "24000", rounds = "8" }

[[supervisor.children]]
name = "worker"
actor_type = "mpi_collectives_wasm"
role = "worker"
restart = "permanent"
shutdown_timeout_seconds = 10
args = { role = "worker" }
tenant_id = "default"
