[package]
name = "timeseries-forecasting"
version = "0.1.0"
edition = "2021"
authors = ["Shahzad A. Bhatti <bhatti@plexobject.com>"]
license = "AGPL-3.0-or-later"
description = "Time-series forecasting example using PlexSpaces SDK annotations"
default-run = "timeseries_forecasting"

[workspace]

[[bin]]
name = "timeseries_forecasting"
path = "src/main.rs"

[dependencies]
# PlexSpaces SDK (includes core, actor, macros)
plexspaces-sdk = { path = "../../../../sdks/rust/plexspaces-sdk", features = ["native"] }
plexspaces-actor = { path = "../../../../crates/actor" }  # Required for macro-generated code
plexspaces-behavior = { path = "../../../../crates/behavior" }  # Required for macro-generated code
plexspaces-node = { path = "../../../../crates/node" }

# Async runtime
tokio = { version = "1.0", features = ["full"] }

# Serialization
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"

# Logging
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }

[dev-dependencies]
tokio-test = "0.4"
