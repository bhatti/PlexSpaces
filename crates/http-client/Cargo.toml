[package]
name = "plexspaces-http-client"
version.workspace = true
authors.workspace = true
edition.workspace = true
license.workspace = true
repository.workspace = true
keywords.workspace = true
categories.workspace = true
description = "Resilient outbound HTTP client for PlexSpaces service links (retry, circuit breaker, metrics)"

[dependencies]
plexspaces-proto = { workspace = true }
plexspaces-circuit-breaker = { workspace = true }
plexspaces-core = { path = "../core" }

tokio = { workspace = true }
async-trait = { workspace = true }
thiserror = { workspace = true }
tracing = { workspace = true }
metrics = "0.23"
rand = "0.8"
reqwest = { version = "0.12", default-features = true, features = ["json"] }
prost-types = { workspace = true }

[dev-dependencies]
tokio = { workspace = true, features = ["test-util", "macros"] }
axum = { version = "0.7", default-features = false, features = ["tokio", "http1"] }
tower = { workspace = true }
serde_json = { workspace = true }

[lib]
name = "plexspaces_http_client"
path = "src/lib.rs"
