# Order fulfillment workflow — Rust WASM (Temporal-style)
#
# SDK + WIT: wit_bindgen Guest. Build: ./build.sh

[workspace]

[package]
name = "migrating-temporal-wasm"
version = "0.1.0"
edition = "2021"
license = "AGPL-3.0-or-later"
publish = false
description = "Order fulfillment workflow WASM actor (Temporal-style run/signal/query)"

[lib]
crate-type = ["cdylib"]

[dependencies]
plexspaces-proto = { git = "https://github.com/bhatti/PlexSpaces", tag = "v0.1.3", default-features = false }
plexspaces-sdk   = { git = "https://github.com/bhatti/PlexSpaces", tag = "v0.1.3", default-features = false }
prost            = "0.13"
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
wit-bindgen = "0.51.0"

[profile.release]
opt-level = "z"
lto = true
codegen-units = 1
strip = true
