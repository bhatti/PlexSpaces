name = "go-agentic-rag-pipeline"
version = "1.0.0"
namespace = "go-agentic-rag-pipeline"
seed_nodes = ["localhost:8091", "localhost:8093"]

[supervisor]
strategy = "one_for_one"
max_restarts = 10
max_restart_window_seconds = 60

[[supervisor.children]]
name = "indexer"
actor_type = "agentic_rag_pipeline_wasm"
role = "indexer"
restart = "permanent"
shutdown_timeout_seconds = 10
behavior_kind = "GenServer"
args = { role = "indexer" }
facets = [
  { type = "virtual_actor", priority = 100, config = { idle_timeout = "10m", activation_strategy = "lazy" } },
  { type = "durability", priority = 90, config = { checkpoint_interval = 10 } },
  { type = "metrics", priority = 80 }
]

[[supervisor.children]]
name = "retriever"
actor_type = "agentic_rag_pipeline_wasm"
role = "retriever"
restart = "permanent"
shutdown_timeout_seconds = 10
behavior_kind = "GenServer"
args = { role = "retriever" }
facets = [
  { type = "virtual_actor", priority = 100, config = { idle_timeout = "10m", activation_strategy = "lazy" } },
  { type = "metrics", priority = 80 }
]

[[supervisor.children]]
name = "generator"
actor_type = "agentic_rag_pipeline_wasm"
role = "generator"
restart = "permanent"
shutdown_timeout_seconds = 10
behavior_kind = "GenServer"
args = { role = "generator" }
facets = [
  { type = "virtual_actor", priority = 100, config = { idle_timeout = "10m", activation_strategy = "lazy" } },
  { type = "durability", priority = 90, config = { checkpoint_interval = 5 } },
  { type = "metrics", priority = 80 }
]

[[supervisor.children]]
name = "validator"
actor_type = "agentic_rag_pipeline_wasm"
role = "validator"
restart = "permanent"
shutdown_timeout_seconds = 10
behavior_kind = "GenServer"
args = { role = "validator" }
facets = [
  { type = "virtual_actor", priority = 100, config = { idle_timeout = "10m", activation_strategy = "lazy" } },
  { type = "metrics", priority = 80 }
]

[[supervisor.children]]
name = "rag_workflow"
actor_type = "agentic_rag_pipeline_wasm"
role = "rag_workflow"
restart = "permanent"
shutdown_timeout_seconds = 30
behavior_kind = "Workflow"
args = { role = "rag_workflow" }
facets = [
  { type = "virtual_actor", priority = 100, config = { idle_timeout = "10m", activation_strategy = "lazy" } },
  { type = "durability", priority = 90, config = { checkpoint_interval = 5 } },
  { type = "timer", priority = 70, config = { interval_ms = 60000 } }
]

[[supervisor.children]]
name = "pipeline_event"
actor_type = "agentic_rag_pipeline_wasm"
role = "pipeline_event"
restart = "permanent"
shutdown_timeout_seconds = 5
behavior_kind = "GenEvent"
args = { role = "pipeline_event" }
facets = [
  { type = "virtual_actor", priority = 100, config = { idle_timeout = "30m", activation_strategy = "lazy" } }
]

[[supervisor.children]]
name = "rag_fsm"
actor_type = "agentic_rag_pipeline_wasm"
role = "rag_fsm"
restart = "permanent"
shutdown_timeout_seconds = 5
behavior_kind = "GenFSM"
args = { role = "rag_fsm" }
facets = [
  { type = "virtual_actor", priority = 100, config = { idle_timeout = "30m", activation_strategy = "lazy" } },
  { type = "durability", priority = 90, config = { checkpoint_interval = 1 } }
]
