[package]
name = "plexspaces-mailbox"
version.workspace = true
authors.workspace = true
edition.workspace = true
license.workspace = true
repository.workspace = true
keywords.workspace = true
categories.workspace = true
description = "Message queue and mailbox implementations"

[features]
default = []
sqlite-backend = ["plexspaces-channel/sqlite-backend", "dep:sqlx", "sqlx/sqlite"]

[dependencies]
plexspaces-proto = { workspace = true }
plexspaces-channel = { path = "../channel", default-features = false }
plexspaces-service-traits = { path = "../service-traits" }

# Observability
metrics = { workspace = true }

# Core dependencies
tokio = { workspace = true }
async-trait = { workspace = true }
anyhow = { workspace = true }
thiserror = { workspace = true }
tracing = { workspace = true }
serde = { workspace = true }
serde_json = { workspace = true }
ulid = { workspace = true }
rand = "0.8"
dashmap = "5"
bytes = { workspace = true }
prost-types = { workspace = true }
chrono = { workspace = true }

# Optional: SQLite-backed idempotency store
sqlx = { workspace = true, optional = true }

[dev-dependencies]
tokio-test = { version = "0.4" }
pretty_assertions = { version = "1.4" }
tempfile = { version = "3.10" }
plexspaces-journaling = { path = "../journaling", default-features = false, features = ["sqlite-backend"] }
plexspaces-facet = { path = "../facet" }
plexspaces-proto = { workspace = true }
plexspaces-actor = { workspace = true }
ulid = { workspace = true }

[lib]
name = "plexspaces_mailbox"
path = "src/lib.rs"
