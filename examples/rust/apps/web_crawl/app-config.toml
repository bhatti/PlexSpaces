# Web Crawl (Rust WASM): Orchestrator + fetcher pool + analyzer shards
# Demonstrates all four PlexSpaces parallelization primitives:
#   TupleSpace frontier  — url_queue as live work frontier with host::ts_take() atomic claim
#   ElasticPool          — host::pool_checkout/pool_checkin for rate-limited fetcher dispatch
#   ProcessGroup         — workers self-register; orchestrator discovers real members
#   ShardGroup scatter   — interleaved scatter to analyzer shards
#
# 16 fetchers support benchmark scaling: 1, 4, 8, 16 concurrent workers

tenant_id = "default"

name = "web-crawl-rust"
version = "1.0.0"
seed_nodes = ["localhost:8091"]

[supervisor]
strategy = "one_for_one"
max_restarts = 10
max_restart_window_seconds = 60

[[supervisor.children]]
name = "orchestrator"
actor_type = "web_crawl_wasm"
role = "orchestrator"
restart = "permanent"
shutdown_timeout_seconds = 30
args = { role = "orchestrator" }
facets = [
  { type = "virtual_actor", priority = 100, config = { idle_timeout = "30m", activation_strategy = "lazy" } }
]

[[supervisor.children]]
name = "fetcher-0"
actor_type = "web_crawl_wasm"
role = "fetcher"
restart = "permanent"
shutdown_timeout_seconds = 10
args = { role = "fetcher", pool_slot = "0", pool_name = "fetcher_pool" }
facets = [
  { type = "virtual_actor", priority = 100, config = { idle_timeout = "5m", activation_strategy = "lazy" } },
  { type = "metrics", priority = 80 }
]

