# Cloudflare Workers Guild Chat Application Configuration
#
# Deploys a Discord-style chat server with two Durable Object actors:
# - ChatRoom: per-room state, members, message history, fan-out
# - RateLimiter: per-user token bucket spam prevention
#
# Equivalent to a Cloudflare Workers wrangler.toml with:
#   [[durable_objects.bindings]]
#   name = "CHAT_ROOM"
#   class_name = "ChatRoom"
#
#   [[durable_objects.bindings]]
#   name = "RATE_LIMITER"
#   class_name = "RateLimiter"

tenant_id = "default"

[supervisor]
strategy = "one_for_one"
max_restarts = 10
max_restart_window_seconds = 60

# ChatRoom actor (Durable Object: one per room)
[[supervisor.children]]
name = "ChatRoom"
tenant_id = "default"
actor_type = "ChatRoom"
restart = "permanent"
shutdown_timeout_seconds = 10

[supervisor.children.args]
max_history = "100"

# RateLimiter actor (Durable Object: per-user rate limiting)
[[supervisor.children]]
name = "RateLimiter"
actor_type = "RateLimiter"
restart = "permanent"
shutdown_timeout_seconds = 5

[supervisor.children.args]
max_tokens = "5"
refill_rate_ms = "1000"
tenant_id = "default"
