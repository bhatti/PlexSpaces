# Restate → PlexSpaces: Exactly-Once Payment (TypeScript WASM)
# Idempotent payment with journaling replay; Workflow + virtual_actor + durability

[supervisor]
strategy = "one_for_one"
max_restarts = 10
max_restart_window_seconds = 60

[[supervisor.children]]
name = "payment"
actor_type = "migrating_restate_wasm"
role = "worker"
restart = "permanent"
shutdown_timeout_seconds = 10
behavior_kind = "Workflow"
facets = [
  { type = "virtual_actor", priority = 100, config = { idle_timeout = "10m", activation_strategy = "lazy" } },
  { type = "durability", priority = 90, config = { checkpoint_interval = 100 } }
]
