name = "go-a2a-multi-agent"
version = "1.0.0"
namespace = "go-a2a-multi-agent"
seed_nodes = ["localhost:8091", "localhost:8093"]

[supervisor]
strategy = "one_for_one"
max_restarts = 10
max_restart_window_seconds = 60

[[supervisor.children]]
id = "agent_registry"
type = "agent_registry"
restart = "permanent"
shutdown_timeout_seconds = 10
behavior_kind = "GenServer"
args = { role = "agent_registry" }
facets = [
  { type = "virtual_actor", priority = 100, config = { idle_timeout = "10m", activation_strategy = "lazy" } },
  { type = "metrics", priority = 80 }
]

[[supervisor.children]]
id = "research_agent"
type = "research_agent"
restart = "permanent"
shutdown_timeout_seconds = 10
behavior_kind = "GenServer"
args = { role = "research_agent", agent_id = "research-1" }
facets = [
  { type = "virtual_actor", priority = 100, config = { idle_timeout = "10m", activation_strategy = "eager" } },
  { type = "metrics", priority = 80 }
]

[[supervisor.children]]
id = "analysis_agent"
type = "analysis_agent"
restart = "permanent"
shutdown_timeout_seconds = 10
behavior_kind = "GenServer"
args = { role = "analysis_agent", agent_id = "analysis-1" }
facets = [
  { type = "virtual_actor", priority = 100, config = { idle_timeout = "10m", activation_strategy = "eager" } },
  { type = "metrics", priority = 80 }
]

[[supervisor.children]]
id = "writer_agent"
type = "writer_agent"
restart = "permanent"
shutdown_timeout_seconds = 10
behavior_kind = "GenServer"
args = { role = "writer_agent", agent_id = "writer-1" }
facets = [
  { type = "virtual_actor", priority = 100, config = { idle_timeout = "10m", activation_strategy = "eager" } },
  { type = "metrics", priority = 80 }
]

[[supervisor.children]]
id = "orchestrator"
type = "orchestrator"
restart = "permanent"
shutdown_timeout_seconds = 60
behavior_kind = "Workflow"
args = { role = "orchestrator" }
facets = [
  { type = "virtual_actor", priority = 100, config = { idle_timeout = "10m", activation_strategy = "lazy" } },
  { type = "durability", priority = 90, config = { checkpoint_interval = 5 } }
]

[[supervisor.children]]
id = "task_event"
type = "task_event"
restart = "permanent"
shutdown_timeout_seconds = 5
behavior_kind = "GenEvent"
args = { role = "task_event" }
facets = [
  { type = "virtual_actor", priority = 100, config = { idle_timeout = "30m", activation_strategy = "lazy" } }
]

[[supervisor.children]]
id = "agent_fsm"
type = "agent_fsm"
restart = "permanent"
shutdown_timeout_seconds = 5
behavior_kind = "GenFSM"
args = { role = "agent_fsm", agent_id = "agent-1" }
facets = [
  { type = "virtual_actor", priority = 100, config = { idle_timeout = "30m", activation_strategy = "lazy" } },
  { type = "durability", priority = 90, config = { checkpoint_interval = 1 } }
]
