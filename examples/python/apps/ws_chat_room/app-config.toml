name = "py-ws-chat-room"
version = "1.0.0"
tenant_id = "default"
seed_nodes = []

[static]
mount = "apps/chat"

[supervisor]
strategy = "one_for_one"
max_restarts = 10
max_restart_window_seconds = 60

[[supervisor.children]]
name = "ChatRoomActor"
actor_type = "ChatRoomActor"
restart = "permanent"
shutdown_timeout_seconds = 10
behavior_kind = "GenServer"
facets = [
  { type = "virtual_actor", priority = 100, config = { idle_timeout = "30m", activation_strategy = "lazy" } },
  { type = "process_group", priority = 90, config = {} }
]

[[supervisor.children]]
name = "PresenceActor"
actor_type = "PresenceActor"
restart = "permanent"
shutdown_timeout_seconds = 10
behavior_kind = "GenServer"
facets = [
  { type = "virtual_actor", priority = 100, config = { idle_timeout = "20m", activation_strategy = "lazy" } },
  { type = "reminder", priority = 80, config = {} }
]

tenant_id = "default"
