# SPDX-License-Identifier: AGPL-3.0-or-later
#
# Parallel AI Inference - Rust WASM app
#
# Build: ./build.sh
# Test: ./test.sh [HTTP_PORT|host:port ...]

[workspace]

[package]
name = "parallel-ai-inference-wasm"
version = "0.1.0"
edition = "2021"
publish = false
description = "Parallel AI inference demo with shard groups, collectives, process groups, and orchestration"

[lib]
crate-type = ["cdylib"]

[dependencies]
plexspaces-proto = { path = "../../../../crates/proto", default-features = false }
plexspaces-sdk = { path = "../../../../sdks/rust/plexspaces-sdk", default-features = false }
prost            = "0.13"
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
wit-bindgen = "0.51.0"

[profile.release]
opt-level = "z"
lto = true
codegen-units = 1
strip = true
