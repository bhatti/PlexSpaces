[package]
name = "v8-isolates-comparison"
version.workspace = true
edition.workspace = true

# Comparison: V8 Isolates (Cloudflare Workers) vs PlexSpaces
# High-throughput log/metric processing system (ELK/Splunk/Datadog-like)

[dependencies]
plexspaces-core.workspace = true
plexspaces-actor.workspace = true
plexspaces-actor-service = { path = "../../../crates/actor-service" }
plexspaces-behavior.workspace = true
plexspaces-facet.workspace = true
plexspaces-journaling = { workspace = true, features = ["sqlite-backend"] }
plexspaces-node.workspace = true
plexspaces-mailbox.workspace = true
plexspaces-channel = { path = "../../../crates/channel" }
plexspaces-proto = { path = "../../../crates/proto" }
plexspaces-tuplespace.workspace = true
plexspaces-supervisor.workspace = true
tokio.workspace = true
serde.workspace = true
serde_json.workspace = true
ulid.workspace = true
tracing.workspace = true
tracing-subscriber.workspace = true
async-trait.workspace = true
reqwest.workspace = true
anyhow = "1.0"
bytes = "1.0"
hex = "0.4"

[[bin]]
name = "v8_isolates_comparison"
path = "src/main.rs"

[features]
default = []
sqlite-backend = ["plexspaces-journaling/sqlite-backend"]

