name = "ts-tracing-pipeline"
version = "1.0.0"
tenant_id = "default"
seed_nodes = ["localhost:8091", "localhost:8094"]

[supervisor]
strategy = "one_for_one"
max_restarts = 10
max_restart_window_seconds = 60

[[supervisor.children]]
name = "tracing-leader"
actor_type = "tracing_pipeline_wasm"
role = "leader"
restart = "permanent"
shutdown_timeout_seconds = 30
behavior_kind = "GenServer"
facets = [
  { type = "virtual_actor", priority = 100, config = { idle_timeout = "1h", activation_strategy = "lazy" } }
]

[supervisor.children.args]
role = "leader"

[[supervisor.children]]
name = "tracing-worker"
actor_type = "tracing-worker"
role = "worker"
restart = "permanent"
shutdown_timeout_seconds = 10
behavior_kind = "GenServer"
facets = [
  { type = "virtual_actor", priority = 100, config = { idle_timeout = "1h", activation_strategy = "lazy" } }
]

[supervisor.children.args]
role = "worker"
tenant_id = "default"
