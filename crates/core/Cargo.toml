[package]
name = "plexspaces-core"
version.workspace = true
authors.workspace = true
edition.workspace = true
license.workspace = true
repository.workspace = true
keywords.workspace = true
categories.workspace = true
description = "Core types and traits for PlexSpaces actor system"

[dependencies]
# Common types (RequestContext)
plexspaces-common = { path = "../common" }
plexspaces-proto = { workspace = true }
plexspaces-tuplespace = { workspace = true }
plexspaces-facet = { workspace = true }
plexspaces-locks = { path = "../locks" }

# Service adapters (optional feature to avoid circular dependencies)
# Note: supervisor and journaling are optional to avoid circular dependencies
# Note: These will be added when we integrate Node with ActorContext
# For now, wrappers are stubbed out

# Core dependencies
tokio = { workspace = true }
async-trait = { workspace = true }
thiserror = { workspace = true }
serde = { workspace = true }
serde_json = { workspace = true }  # For metadata serialization
uuid = { workspace = true }
ulid = { workspace = true }  # For request_id generation
metrics = "0.23"  # For observability
chrono = { workspace = true }  # For lease timestamps and health service timestamps
prost-types = "0.12"  # For proto Duration/Timestamp types
tracing = { workspace = true }  # Always enabled, feature kept for compatibility
futures = "0.3"  # For BoxStream in ChannelService
tonic = { workspace = true }  # For gRPC client in ServiceLocator
tonic-health = { workspace = true }  # For health reporting
once_cell = "1.19"  # For lazy static initialization of discovery cache

[dev-dependencies]
tokio-test = { version = "0.4" }
plexspaces-object-registry = { workspace = true }  # For ServiceLocator tests
plexspaces-keyvalue = { workspace = true, features = ["sql-backend"] }  # For ServiceLocator tests and SQLite integration tests
plexspaces-node = { workspace = true }  # For create_default_service_locator in tests
plexspaces-services = { path = "../services" }  # For ServiceLocatorImpl in tests
plexspaces-channel = { path = "../channel" }  # For channel integration tests
plexspaces-journaling = { workspace = true, features = ["sqlite-backend"] }  # For facet factory tests
plexspaces-locks = { path = "../locks" }  # For facet factory tests
plexspaces-process-groups = { workspace = true }  # For facet factory tests
chrono = { workspace = true }  # For timestamp in integration tests
prost-types = "0.12"  # For proto types in integration tests
async-trait = { workspace = true }  # For trait implementations in tests
plexspaces-mailbox = { workspace = true }  # For Mailbox in virtual actor LRU eviction tests
plexspaces-actor = { workspace = true }  # For ActorRef in virtual actor LRU eviction tests

[features]
default = []
# Keep tracing feature for backward compatibility, but tracing is always enabled
tracing = []
sql-backend = ["plexspaces-keyvalue/sql-backend"]

[lib]
name = "plexspaces_core"
path = "src/lib.rs"
