[package]
name = "heat_diffusion"
version = "0.1.0"
edition = "2021"
publish = false

[workspace]

[[bin]]
name = "heat_diffusion"
path = "src/main.rs"

[dependencies]
# PlexSpaces SDK
plexspaces-sdk = { path = "../../../../sdks/rust/plexspaces-sdk" }
plexspaces-actor = { path = "../../../../crates/actor" }
plexspaces-behavior = { path = "../../../../crates/behavior" }
plexspaces-actor = { path = "../../../../crates/actor" }
plexspaces-mailbox = { path = "../../../../crates/mailbox" }
plexspaces-tuplespace = { path = "../../../../crates/tuplespace" }

# Node and core
plexspaces-node = { path = "../../../../crates/node" }

# Async runtime
tokio = { version = "1", features = ["full"] }
futures = "0.3"# Serialization
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"# Utilities
anyhow = "1.0"# Logging
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }
