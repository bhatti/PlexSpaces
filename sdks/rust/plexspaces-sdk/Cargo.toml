# PlexSpaces Rust SDK – high-level API and annotations (like Python SDK decorators)
# Use: plexspaces_sdk::Actor, #[actor], #[gen_server_actor], and re-exported types.
# Part of root workspace (see Cargo.toml members).

[package]
name = "plexspaces-sdk"
version = "0.1.0"
edition = "2021"
description = "Rust SDK for PlexSpaces (re-exports, helpers, and attribute macros)"
repository = "https://github.com/plexobject/plexspaces"
homepage = "https://github.com/plexobject/plexspaces"
keywords = ["actors", "distributed", "wasm", "tuplespace", "workflow"]
categories = ["concurrency", "distributed-systems", "web-programming", "wasm"]
license = "AGPL-3.0-or-later"

[dependencies]
plexspaces-sdk-macros = { path = "../plexspaces-sdk-macros" }
plexspaces-actor = { path = "../../../crates/actor", optional = true }
plexspaces-node = { path = "../../../crates/node", optional = true }
plexspaces-proto = { path = "../../../crates/proto", default-features = false }
plexspaces-facet = { path = "../../../crates/facet", optional = true }
plexspaces-behavior = { path = "../../../crates/behavior", optional = true }
plexspaces-journaling = { path = "../../../crates/journaling", optional = true }
plexspaces-workflow = { path = "../../../crates/workflow", optional = true }
plexspaces-common = { path = "../../../crates/common", optional = true }
async-trait = { version = "0.1", optional = true }
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
thiserror = { workspace = true }
prost = { workspace = true }
ulid = { version = "1.1", optional = true }
anyhow = { version = "1.0", optional = true }
prost-types = { version = "0.12", optional = true }
futures = { version = "0.3", optional = true }
tracing = { version = "0.1", optional = true }
tokio = { version = "1.0", features = ["time"], optional = true }
tonic = { workspace = true, optional = true }
wit-bindgen = "0.36"

[features]
default = ["native", "grpc"]
native = [
    "dep:anyhow",
    "dep:async-trait",
    "dep:futures",
    "dep:plexspaces-actor",
    "dep:plexspaces-behavior",
    "dep:plexspaces-common",
    "dep:plexspaces-facet",
    "dep:plexspaces-journaling",
    "dep:plexspaces-node",
    "plexspaces-proto/grpc",
    "dep:plexspaces-workflow",
    "dep:prost-types",
    "dep:tokio",
    "dep:tracing",
    "dep:ulid",
]
grpc = ["native", "dep:tonic"]
