# Parameter Server - Rust WASM app
#
# Deployable WASM application using the plexspaces:actor WIT host surface.
# Build: ./build.sh
# Test: ./test.sh [HTTP_PORT|host:port ...]

[workspace]

[package]
name = "parameter-server-wasm"
version = "0.1.0"
edition = "2021"
publish = false
description = "Parameter server leader/worker WASM app with shard-group scatter-gather"

[lib]
crate-type = ["cdylib"]

[dependencies]
plexspaces-proto = { git = "https://github.com/bhatti/PlexSpaces", tag = "v0.1.3", default-features = false }
plexspaces-sdk   = { git = "https://github.com/bhatti/PlexSpaces", tag = "v0.1.3", default-features = false }
prost            = "0.13"
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
wit-bindgen = "0.51.0"

[profile.release]
opt-level = "z"
lto = true
codegen-units = 1
strip = true
