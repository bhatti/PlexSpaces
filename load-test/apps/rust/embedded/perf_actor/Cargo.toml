[package]
name = "perf_actor_embedded"
version = "0.1.0"
edition = "2021"
publish = false

[workspace]

[[bin]]
name = "perf_actor"
path = "src/main.rs"

[dependencies]
plexspaces-sdk  = { path = "../../../../../sdks/rust/plexspaces-sdk", features = ["native"] }
plexspaces-node = { path = "../../../../../crates/node" }
plexspaces-actor = { path = "../../../../../crates/actor" }
tokio  = { version = "1", features = ["full"] }
serde  = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
tracing = "0.1"
