[package]
name = "durable_actor"
version = "0.1.0"
edition = "2021"
publish = false

[workspace]

[[bin]]
name = "durable_actor"
path = "src/main.rs"

[dependencies]
# PlexSpaces crates
plexspaces-journaling = { path = "../../../../crates/journaling" }
plexspaces-facet = { path = "../../../../crates/facet" }

# Async runtime
tokio = { version = "1", features = ["full"] }

# Serialization
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"

# Logging
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }
