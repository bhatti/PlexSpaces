[package]
name = "job_queue"
version = "0.1.0"
edition = "2021"
publish = false

[workspace]

[[bin]]
name = "job_queue"
path = "src/main.rs"

[dependencies]
plexspaces-sdk = { path = "../../../../sdks/rust/plexspaces-sdk", features = ["native"] }
plexspaces-node = { path = "../../../../crates/node" }
plexspaces-actor = { path = "../../../../crates/actor" }
plexspaces-outbox = { path = "../../../../crates/outbox" }
plexspaces-proto = { path = "../../../../crates/proto" }
plexspaces-channel = { path = "../../../../crates/channel", features = ["sqlite-backend"] }
plexspaces-common = { path = "../../../../crates/common" }

async-trait = "0.1"
tokio = { version = "1", features = ["full"] }
serde_json = "1.0"
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }
anyhow = "1.0"
ulid = "1"
