# SkyPilot multi-cloud ML orchestration - Rust WASM app
#
# GenServer-style: submit_task, get_best_resources, get_status.
# Build: ./build.sh (cargo build --target wasm32-wasip1 then wasm-tools component embed + new).

[workspace]

[package]
name = "migrating-skypilot-wasm"
version = "0.1.0"
edition = "2021"
license = "LGPL-2.1-or-later"
publish = false
description = "SkyPilot multi-cloud ML orchestration WASM actor (GenServer, KV, durability)"

[lib]
crate-type = ["cdylib"]

[dependencies]
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"

[profile.release]
opt-level = "z"
lto = true
codegen-units = 1
strip = true
