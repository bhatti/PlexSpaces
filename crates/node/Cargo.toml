[package]
name = "plexspaces-node"
version.workspace = true
authors.workspace = true
edition.workspace = true
license.workspace = true
repository.workspace = true
keywords.workspace = true
categories.workspace = true
description = "Node management and Firecracker VM support"

[dependencies]
# Core types and dependencies
plexspaces-journaling = { workspace = true }
plexspaces-tuplespace = { workspace = true }
plexspaces-mailbox = { workspace = true }
plexspaces-proto = { workspace = true }
plexspaces-actor = { workspace = true }
plexspaces-persistence = { workspace = true }
plexspaces-keyvalue = { workspace = true, features = ["sql-backend"] }
plexspaces-object-registry = { workspace = true }
plexspaces-channel = { workspace = true }
plexspaces-process-groups = { workspace = true }
plexspaces-facet = { workspace = true }
plexspaces-application = { path = "../application" }
plexspaces-services = { path = "../services" }
plexspaces-scheduler = { workspace = true, features = ["sqlite-backend"] }
plexspaces-locks = { workspace = true }
plexspaces-common = { path = "../common" }
plexspaces-service-traits = { path = "../service-traits" }
plexspaces-wasm-runtime = { workspace = true, features = ["component-model"] }
plexspaces-blob = { path = "../blob", features = ["sql-backend", "server", "presigned-urls", "s3-backend"] }
plexspaces-firecracker = { workspace = true, optional = true }
plexspaces-dashboard = { path = "../dashboard", optional = true }
plexspaces-circuit-breaker = { workspace = true }
plexspaces-grpc-middleware = { path = "../grpc-middleware" }

# Core dependencies
tokio = { workspace = true }
async-trait = { workspace = true }
thiserror = { workspace = true }
serde = { workspace = true }
serde_json = { workspace = true }
tracing = { workspace = true }
tracing-subscriber = { workspace = true }
metrics = "0.23"
toml = "0.8"
serde_yaml = "0.9"
config = "0.14"
ulid = "1.2"
chrono = { workspace = true }
libc = "0.2"  # For signal handling in shutdown coordinator
sysinfo = "0.30"  # For system resource metrics (CPU, memory, disk)
regex = "1.10"  # For config key pattern matching

# gRPC for actor remoting
tonic = { workspace = true }
prost = { workspace = true }
prost-types = { workspace = true }
tokio-stream = { version = "0.1", features = ["net"] }
sqlx = { version = "0.7", features = ["runtime-tokio-rustls", "sqlite", "any", "migrate"] }
tonic-health = { workspace = true }
tonic-web = { workspace = true }  # For gRPC-Web and gRPC-Gateway HTTP access
futures = { workspace = true }  # For BoxStream in ChannelService
futures-util = "0.3"  # For StreamExt in multipart handling
tower = { version = "0.4", features = ["util", "timeout", "load"] }
tower-http = { version = "0.5", features = ["cors", "trace", "compression-gzip", "fs"] }
hyper = { version = "1.0", features = ["full"] }
http-body-util = "0.1"
axum = { version = "0.7", features = ["multipart"] }
url = "2.5"
base64 = "0.22"
reqwest = { version = "0.12", features = ["json", "multipart"] }
clap = { version = "4.4", features = ["derive"] }
anyhow = "1.0"
jsonwebtoken = "9.3"

[features]
default = ["dashboard", "firecracker"]
firecracker = ["plexspaces-firecracker", "plexspaces-services/firecracker"]
dashboard = ["plexspaces-dashboard"]

[dev-dependencies]
tokio-test = { version = "0.4" }
pretty_assertions = { version = "1.4" }
plexspaces-persistence = { workspace = true }
plexspaces-common = { path = "../common", features = ["test-helpers"] }
futures = { workspace = true }
tempfile = "3.10"
wat = "1.0"

[lib]
name = "plexspaces_node"
path = "src/lib.rs"

# Explicit name to avoid collision with plexspaces-services integration_tests
# (so "cargo test --test integration_tests -- auth_tests" runs only services' tests)
[[test]]
name = "node_integration_tests"
path = "tests/integration_tests.rs"