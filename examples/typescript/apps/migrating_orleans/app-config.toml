# Batch Predictor Application Configuration (TypeScript)
# Orleans-style virtual actor with model caching
#
# Virtual actors are automatically activated on first message and deactivated after idle timeout.
# This matches Orleans behavior where actors are always addressable but activated on-demand.

# Application version (used by ApplicationSpec)
version = "1.0.0"

# Namespace for multi-tenancy (if not specified, defaults to application_id)
namespace = "orleans-batch-predictor"

[supervisor]
strategy = "one_for_one"
max_restarts = 10
max_restart_window_seconds = 60

# Batch predictor model 1 - Virtual actor (Orleans-style)
[[supervisor.children]]
id = "batch-predictor-model-1"
type = "worker"
restart = "permanent"
shutdown_timeout_seconds = 5
# Virtual actor facet: automatic activation/deactivation
facets = [
  { type = "virtual_actor", priority = 100, config = { idle_timeout = "5m", activation_strategy = "lazy" } }
]

[[supervisor.children]]
id = "batch-predictor-model-2"
type = "worker"
restart = "permanent"
shutdown_timeout_seconds = 5
facets = [
  { type = "virtual_actor", priority = 100, config = { idle_timeout = "5m", activation_strategy = "lazy" } }
]

[[supervisor.children]]
id = "batch-predictor-model-3"
type = "worker"
restart = "permanent"
shutdown_timeout_seconds = 5
facets = [
  { type = "virtual_actor", priority = 100, config = { idle_timeout = "5m", activation_strategy = "lazy" } }
]
