# EFlows4HPC → PlexSpaces: HPC Ensemble (single actor type)
# Convention: ensemble:coord-1 = coordinator; ensemble:worker-0, ensemble:worker-1 = workers.
# Tuple space (host.ts) + process group (join/broadcast).

[supervisor]
strategy = "one_for_one"
max_restarts = 10
max_restart_window_seconds = 60

[[supervisor.children]]
name = "ensemble"
actor_type = "migrating_eflows4hpc_wasm"
role = "worker"
restart = "permanent"
shutdown_timeout_seconds = 10
behavior_kind = "Workflow"
facets = [
  { type = "virtual_actor", priority = 100, config = { idle_timeout = "10m", activation_strategy = "lazy" } },
  { type = "durability", priority = 90, config = { checkpoint_interval = 100 } }
]
