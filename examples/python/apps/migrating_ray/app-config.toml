# Ray Parameter Server Application Configuration
# 
# Deploys parameter server and data workers for distributed ML training.
# Demonstrates Ray-style parameter server pattern with elastic worker pools.
#
# This single ApplicationSpec deploys multiple actor types from one WASM file:
# - ParameterServer: Centralized model weights management
# - DataWorker: Gradient computation workers

[supervisor]
strategy = "one_for_one"
max_restarts = 10
max_restart_window_seconds = 60

# Parameter server (centralized model weights)
# Uses ParameterServer actor class from ray_actors.wasm
[[supervisor.children]]
id = "parameter-server"
type = "worker"
restart = "permanent"
shutdown_timeout_seconds = 5
# Note: actor_type/behavior_kind determines which actor class to instantiate
# For now, the first @actor class (ParameterServer) is used by default
# TODO: Add support for specifying actor class name in child spec

# Data workers (elastic pool - can scale horizontally)
# Uses DataWorker actor class from ray_actors.wasm
[[supervisor.children]]
id = "data-worker-0"
type = "worker"
restart = "permanent"
shutdown_timeout_seconds = 5

[[supervisor.children]]
id = "data-worker-1"
type = "worker"
restart = "permanent"
shutdown_timeout_seconds = 5

[[supervisor.children]]
id = "data-worker-2"
type = "worker"
restart = "permanent"
shutdown_timeout_seconds = 5

[[supervisor.children]]
id = "data-worker-3"
type = "worker"
restart = "permanent"
shutdown_timeout_seconds = 5

