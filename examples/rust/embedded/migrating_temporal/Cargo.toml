# Temporal comparison - embedded example (Node + WorkflowBehavior + DurabilityFacet)
# Part of workspace so workspace = true deps resolve.

[package]
name = "temporal-comparison"
version.workspace = true
edition.workspace = true
publish = false
description = "Temporal-style durable workflow comparison (embedded)"

[dependencies]
plexspaces-core.workspace = true
plexspaces-actor.workspace = true
plexspaces-behavior.workspace = true
plexspaces-journaling = { workspace = true, features = ["sqlite-backend"] }
plexspaces-node.workspace = true
tokio.workspace = true
serde.workspace = true
serde_json.workspace = true
ulid.workspace = true
tracing.workspace = true
tracing-subscriber.workspace = true
async-trait.workspace = true

[[bin]]
name = "temporal_comparison"
path = "src/main.rs"

[features]
default = []
sqlite-backend = ["plexspaces-journaling/sqlite-backend"]
