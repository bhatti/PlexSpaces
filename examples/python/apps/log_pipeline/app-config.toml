name = "python-log-pipeline"
version = "1.0.0"
tenant_id = "default"
seed_nodes = ["localhost:8091", "localhost:8094"]

[supervisor]
strategy = "one_for_one"
max_restarts = 10
max_restart_window_seconds = 60

[[supervisor.children]]
name = "LeaderActor"
actor_type = "LeaderActor"
restart = "permanent"
shutdown_timeout_seconds = 30
behavior_kind = "GenServer"
facets = [
  { type = "virtual_actor", priority = 100, config = { idle_timeout = "30m", activation_strategy = "lazy" } },
  { type = "durability", priority = 90, config = { checkpoint_interval = 5 } }
]

[[supervisor.children]]
name = "PipelineWorkerActor"
actor_type = "PipelineWorkerActor"
restart = "permanent"
shutdown_timeout_seconds = 10
behavior_kind = "GenServer"
args = { pipeline_functions = "json_parse,mask_pii,enrich,rename_fields,drop" }
facets = [
  { type = "virtual_actor", priority = 100, config = { idle_timeout = "10m", activation_strategy = "lazy" } },
  { type = "metrics", priority = 80 }
]

[[supervisor.children]]
name = "PipelineAuditActor"
actor_type = "PipelineAuditActor"
restart = "permanent"
shutdown_timeout_seconds = 5
behavior_kind = "GenEvent"
facets = [
  { type = "virtual_actor", priority = 100, config = { idle_timeout = "10m", activation_strategy = "lazy" } }
]

[[supervisor.children]]
name = "PipelineHealthFSM"
actor_type = "PipelineHealthFSM"
restart = "permanent"
shutdown_timeout_seconds = 5
behavior_kind = "GenFSM"
args = { error_threshold = "0.05", latency_threshold_ms = "1000" }
facets = [
  { type = "virtual_actor", priority = 100, config = { idle_timeout = "30m", activation_strategy = "lazy" } },
  { type = "durability", priority = 90, config = { checkpoint_interval = 1 } }
]
