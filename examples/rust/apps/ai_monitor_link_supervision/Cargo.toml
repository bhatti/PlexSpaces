[workspace]

[package]
name = "ai-monitor-link-supervision"
version = "0.1.0"
edition = "2021"
license = "AGPL-3.0-or-later"
publish = false
description = "AI Monitor/Link Supervision: FLP/Byzantine fault detection with actor monitor/link primitives (Rust WASM)"

[lib]
crate-type = ["cdylib", "rlib"]

[target.'cfg(target_arch = "wasm32")'.dependencies]
plexspaces-proto = { path = "../../../../crates/proto", default-features = false }
prost = "0.12"
serde_json = "1.0"
wit-bindgen = "0.36"

[target.'cfg(not(target_arch = "wasm32"))'.dependencies]
plexspaces-proto = { path = "../../../../crates/proto", default-features = false }
prost = "0.12"
serde_json = "1.0"

[profile.release]
opt-level = "z"
lto = true
codegen-units = 1
strip = true
