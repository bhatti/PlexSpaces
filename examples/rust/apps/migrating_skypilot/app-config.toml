# SkyPilot → PlexSpaces: Multi-cloud ML orchestration (Rust WASM)
# GenServer: submit_task, get_best_resources, get_status. Virtual actor + durability.

[supervisor]
strategy = "one_for_one"
max_restarts = 10
max_restart_window_seconds = 60

[[supervisor.children]]
name = "scheduler"
actor_type = "migrating_skypilot_wasm"
role = "worker"
restart = "permanent"
shutdown_timeout_seconds = 10
behavior_kind = "GenServer"
facets = [
  { type = "virtual_actor", priority = 100, config = { idle_timeout = "10m", activation_strategy = "lazy" } },
  { type = "durability", priority = 90, config = { checkpoint_interval = 100 } }
]
