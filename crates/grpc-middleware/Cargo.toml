# SPDX-License-Identifier: AGPL-3.0-or-later

[package]
name = "plexspaces-grpc-middleware"
version = "0.1.0"
edition = "2021"
license = "AGPL-3.0-or-later"
description = "Production-ready gRPC middleware for PlexSpaces with metrics, auth, rate limiting, and tracing"

[lib]
name = "plexspaces_grpc_middleware"
path = "src/lib.rs"

[dependencies]
plexspaces-proto = { path = "../proto" }
plexspaces-common = { path = "../common" }
plexspaces-actor = { path = "../actor" }

# gRPC
tonic = { workspace = true }
tower = { workspace = true }
tower-layer = "0.3"
tower-http = { workspace = true }
axum = { workspace = true }
tonic-web = { workspace = true }

# Async
tokio = { version = "1.42", features = ["full"] }
async-trait = "0.1"

# Metrics (unified with MetricsService / `metrics` recorder)
metrics = { workspace = true }
prometheus = { version = "0.13", features = ["process"] }

# Tracing
tracing = "0.1"
tracing-opentelemetry = "0.27"
opentelemetry = { version = "0.27", features = ["trace", "metrics"] }
opentelemetry_sdk = { version = "0.27", features = ["rt-tokio"] }

# Auth
jsonwebtoken = "9.3"
ring = { workspace = true }
sha2 = "0.10"
hex = "0.4"
base64 = "0.22"

# Rate limiting
governor = "0.6"

# Compression
flate2 = "1.0"  # gzip
zstd = "0.13"   # zstd

# Error handling
thiserror = "2.0"
anyhow = "1.0"

# Serialization
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"

# Time
chrono = "0.4"

# ID generation
ulid = { version = "1.1", features = ["serde"] }

# Certificate generation (for mTLS auto-generation)
rcgen = "0.13"
time = "0.3"
tempfile = "3.10"

# TLS server support
rustls = { workspace = true }
rustls-pemfile = { workspace = true }

[dev-dependencies]
tokio-test = "0.4"
hyper = "1.0"
tempfile = "3.10"
metrics-exporter-prometheus = { workspace = true }
