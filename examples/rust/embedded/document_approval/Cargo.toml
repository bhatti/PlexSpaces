[package]
name = "document-approval"
version = "0.1.0"
edition = "2021"
license = "LGPL-2.1-or-later"
authors = ["Shahzad A. Bhatti <bhatti@plexobject.com>"]
description = "Document Approval Workflow - DocuSign-like Multi-Step Approval"

[workspace]

[[bin]]
name = "document_approval"
path = "src/main.rs"

[dependencies]
# PlexSpaces SDK
plexspaces-sdk = { path = "../../../../sdks/rust/plexspaces-sdk" }
plexspaces-core = { path = "../../../../crates/core" }
plexspaces-behavior = { path = "../../../../crates/behavior" }
plexspaces-node = { path = "../../../../crates/node" }
plexspaces-journaling = { path = "../../../../crates/journaling" }

# ULID for message IDs
ulid = "1.1"

# Async runtime
tokio = { version = "1.0", features = ["full"] }

# Serialization
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"

# Logging
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }

# Time
chrono = { version = "0.4", features = ["serde"] }
