// PlexSpaces Dashboard API
//
// ## Purpose
// Provides aggregated metrics and metadata for dashboard visualization.
// Supports filtering by tenant, node, cluster with pagination.
//
// ## Design
// Proto-first design: All dashboard data structures defined in proto for:
// - Wire compatibility (gRPC + HTTP via gRPC-Gateway)
// - Language-agnostic dashboard clients
// - Consistent data semantics

syntax = "proto3";

package plexspaces.dashboard.v1;

import "buf/validate/validate.proto";
import "google/api/annotations.proto";
import "google/api/field_behavior.proto";
import "google/protobuf/timestamp.proto";
import "plexspaces/v1/actors/actor_runtime.proto";
import "plexspaces/v1/application/application.proto";
import "plexspaces/v1/common.proto";
import "plexspaces/v1/keyvalue/keyvalue.proto";
import "plexspaces/v1/metrics/metrics.proto";
import "plexspaces/v1/node/node.proto";
import "plexspaces/v1/node/outbound.proto";
import "plexspaces/v1/registry/object_registry.proto";
import "plexspaces/v1/storage/blob.proto";
import "plexspaces/v1/system/system.proto";
import "plexspaces/v1/tuplespace/tuplespace.proto";
import "plexspaces/v1/workflow/workflow.proto";
import "protoc-gen-openapiv2/options/annotations.proto";

option go_package = "github.com/bhatti/plexspaces/gen/go/plexspaces/v1/dashboard/dashboard;plexspaces_dashboard_v1";
option java_multiple_files = true;
option java_package = "com.bhatti.plexspaces.dashboard.v1";
option (grpc.gateway.protoc_gen_openapiv2.options.openapiv2_swagger) = {
  info: {
    title: "PlexSpaces Dashboard API"
    version: "1.0"
    description: "Dashboard metrics and metadata aggregation API"
  }
  schemes: HTTPS
  schemes: HTTP
  consumes: "application/json"
  produces: "application/json"
};

// ============================================================================
// DASHBOARD SERVICE
// ============================================================================

service DashboardService {
  option (grpc.gateway.protoc_gen_openapiv2.options.openapiv2_tag) = {description: "Dashboard metrics and metadata service"};

  // Get dashboard summary (aggregated metrics)
  rpc GetSummary(GetSummaryRequest) returns (GetSummaryResponse) {
    option (google.api.http) = {get: "/api/v1/dashboard/summary"};
    option (grpc.gateway.protoc_gen_openapiv2.options.openapiv2_operation) = {
      summary: "Get Dashboard Summary"
      description: "Returns aggregated metrics across all nodes"
      tags: "Dashboard"
    };
  }

  // Get nodes list (for home page table)
  rpc GetNodes(GetNodesRequest) returns (GetNodesResponse) {
    option (google.api.http) = {get: "/api/v1/dashboard/nodes"};
    option (grpc.gateway.protoc_gen_openapiv2.options.openapiv2_operation) = {
      summary: "Get Nodes List"
      description: "Returns paginated list of nodes"
      tags: "Dashboard"
    };
  }

  // Get node dashboard data (for node detail page)
  rpc GetNodeDashboard(GetNodeDashboardRequest) returns (GetNodeDashboardResponse) {
    option (google.api.http) = {get: "/api/v1/dashboard/node/{node_id}"};
    option (grpc.gateway.protoc_gen_openapiv2.options.openapiv2_operation) = {
      summary: "Get Node Dashboard"
      description: "Returns detailed metrics and data for a specific node"
      tags: "Dashboard"
    };
  }

  // Get applications list (for node page)
  rpc GetApplications(GetApplicationsRequest) returns (GetApplicationsResponse) {
    option (google.api.http) = {get: "/api/v1/dashboard/applications"};
    option (grpc.gateway.protoc_gen_openapiv2.options.openapiv2_operation) = {
      summary: "Get Applications List"
      description: "Returns paginated list of applications"
      tags: "Dashboard"
    };
  }

  // Get actors list (for node page)
  rpc GetActors(GetActorsRequest) returns (GetActorsResponse) {
    option (google.api.http) = {get: "/api/v1/dashboard/actors"};
    option (grpc.gateway.protoc_gen_openapiv2.options.openapiv2_operation) = {
      summary: "Get Actors List"
      description: "Returns paginated list of actors"
      tags: "Dashboard"
    };
  }

  // Get workflows list (for home and node pages)
  rpc GetWorkflows(GetWorkflowsRequest) returns (GetWorkflowsResponse) {
    option (google.api.http) = {get: "/api/v1/dashboard/workflows"};
    option (grpc.gateway.protoc_gen_openapiv2.options.openapiv2_operation) = {
      summary: "Get Workflows List"
      description: "Returns paginated list of workflows"
      tags: "Dashboard"
    };
  }

  // Get dependency health status (for monitoring external dependencies)
  rpc GetDependencyHealth(GetDependencyHealthRequest) returns (GetDependencyHealthResponse) {
    option (google.api.http) = {get: "/api/v1/dashboard/dependencies"};
    option (grpc.gateway.protoc_gen_openapiv2.options.openapiv2_operation) = {
      summary: "Get Dependency Health"
      description: "Returns health status of external dependencies (database, redis, object-store, etc.)"
      tags: "Dashboard"
    };
  }

  // Unified Prometheus-backed metrics for dashboard clients (node / namespace / filtered series).
  rpc GetDashboardMetrics(GetDashboardMetricsRequest) returns (GetDashboardMetricsResponse) {
    option (google.api.http) = {get: "/api/v1/dashboard/metrics"};
    option (grpc.gateway.protoc_gen_openapiv2.options.openapiv2_operation) = {
      summary: "Get Dashboard Metrics"
      description: "Returns structured metric samples and optional full Prometheus text for this node"
      tags: "Dashboard"
    };
  }

  // Get object registry entries (actors, tuplespaces, services, VMs, etc.)
  rpc GetObjects(GetObjectsRequest) returns (GetObjectsResponse) {
    option (google.api.http) = {get: "/api/v1/dashboard/objects"};
    option (grpc.gateway.protoc_gen_openapiv2.options.openapiv2_operation) = {
      summary: "Get Object Registry"
      description: "Returns paginated object registry entries with filtering by type, health, namespace"
      tags: "Dashboard"
    };
  }

  // Get key/value store entries
  rpc GetKeyValues(GetKeyValuesRequest) returns (GetKeyValuesResponse) {
    option (google.api.http) = {get: "/api/v1/dashboard/keyvalue"};
    option (grpc.gateway.protoc_gen_openapiv2.options.openapiv2_operation) = {
      summary: "Get Key/Value Entries"
      description: "Returns paginated key/value store entries with optional prefix filter"
      tags: "Dashboard"
    };
  }

  // Get tuplespace stats and sample tuples
  rpc GetTupleSpaces(GetTupleSpacesRequest) returns (GetTupleSpacesResponse) {
    option (google.api.http) = {get: "/api/v1/dashboard/tuplespace"};
    option (grpc.gateway.protoc_gen_openapiv2.options.openapiv2_operation) = {
      summary: "Get TupleSpace Stats"
      description: "Returns tuplespace summary with tuple count and sample tuples"
      tags: "Dashboard"
    };
  }

  // Get blob storage entries
  rpc GetBlobs(GetBlobsRequest) returns (GetBlobsResponse) {
    option (google.api.http) = {get: "/api/v1/dashboard/blobs"};
    option (grpc.gateway.protoc_gen_openapiv2.options.openapiv2_operation) = {
      summary: "Get Blob Storage Entries"
      description: "Returns paginated blob metadata with optional kind and prefix filters"
      tags: "Dashboard"
    };
  }

  // Generate presigned download URL for a blob
  rpc GetBlobPresignedUrl(GetBlobPresignedUrlRequest) returns (GetBlobPresignedUrlResponse) {
    option (google.api.http) = {
      post: "/api/v1/dashboard/blob/{blob_id}/presigned-url"
      body: "*"
    };
    option (grpc.gateway.protoc_gen_openapiv2.options.openapiv2_operation) = {
      summary: "Get Blob Presigned URL"
      description: "Generates a presigned download URL for a specific blob"
      tags: "Dashboard"
    };
  }

  // Get service links configured on a node
  rpc GetServiceLinks(GetServiceLinksRequest) returns (GetServiceLinksResponse) {
    option (google.api.http) = {get: "/api/v1/dashboard/service-links"};
    option (grpc.gateway.protoc_gen_openapiv2.options.openapiv2_operation) = {
      summary: "Get Service Links"
      description: "Returns all service links (static + dynamically added) for a node"
      tags: "Dashboard"
    };
  }

  // Get metrics table with filtering (structured view of all metrics)
  rpc GetMetricsTable(GetMetricsTableRequest) returns (GetMetricsTableResponse) {
    option (google.api.http) = {get: "/api/v1/dashboard/metrics-table"};
    option (grpc.gateway.protoc_gen_openapiv2.options.openapiv2_operation) = {
      summary: "Get Metrics Table"
      description: "Returns all metrics as a structured table with optional name pattern and label filters"
      tags: "Dashboard"
    };
  }
}

// ============================================================================
// REQUEST/RESPONSE MESSAGES
// ============================================================================

// Dashboard summary request
message GetSummaryRequest {
  // Filter by tenant ID (optional, from auth context if not provided)
  string tenant_id = 1 [(buf.validate.field).string.max_len = 255];

  // Filter by node ID (optional)
  string node_id = 2 [(buf.validate.field).string.max_len = 255];

  // Filter by cluster ID (optional)
  string cluster_id = 3 [(buf.validate.field).string.max_len = 255];

  // Show data since this timestamp (default: now - 24 hours)
  google.protobuf.Timestamp since = 4;
}

// Dashboard summary response
message GetSummaryResponse {
  option (grpc.gateway.protoc_gen_openapiv2.options.openapiv2_schema) = {
    json_schema: {
      title: "Dashboard Summary"
      description: "Aggregated metrics across all nodes"
    }
  };

  // Total number of clusters
  uint32 total_clusters = 1;

  // Total number of nodes
  uint32 total_nodes = 2;

  // Total number of tenants (admin only, or filtered by tenant_id)
  uint32 total_tenants = 3;

  // Total number of applications (filtered by tenant if auth enabled)
  uint32 total_applications = 4;

  // Actors by type (aggregated across all nodes)
  map<string, uint32> actors_by_type = 5;

  // Timestamp range for this summary
  google.protobuf.Timestamp since = 6;
  google.protobuf.Timestamp until = 7;
}

// Get nodes request
message GetNodesRequest {
  // Filter by tenant ID (optional)
  string tenant_id = 1 [(buf.validate.field).string.max_len = 255];

  // Filter by cluster ID (optional)
  string cluster_id = 2 [(buf.validate.field).string.max_len = 255];

  // Pagination
  plexspaces.common.v1.PageRequest page = 3;
}

// Get nodes response
message GetNodesResponse {
  repeated plexspaces.node.v1.Node nodes = 1;
  plexspaces.common.v1.PageResponse page = 2;
}

// Get node dashboard request
message GetNodeDashboardRequest {
  // Node ID (required)
  string node_id = 1 [
    (google.api.field_behavior) = REQUIRED,
    (buf.validate.field).string = {
      min_len: 1
      max_len: 255
    }
  ];

  // Show data since this timestamp (default: now - 24 hours)
  google.protobuf.Timestamp since = 2;
}

// Get node dashboard response
message GetNodeDashboardResponse {
  option (grpc.gateway.protoc_gen_openapiv2.options.openapiv2_schema) = {
    json_schema: {
      title: "Node Dashboard Data"
      description: "Detailed metrics and data for a specific node"
    }
  };

  // Node information
  plexspaces.node.v1.Node node = 1;

  // Node metrics
  plexspaces.node.v1.NodeMetrics node_metrics = 2;

  // System metrics (if available)
  plexspaces.metrics.v1.SystemMetrics system_metrics = 3;

  // Summary metrics for this node
  NodeSummaryMetrics summary = 4;

  // Dependency health status (external dependencies)
  plexspaces.system.v1.DetailedHealthCheck dependency_health = 5;
}

// Node summary metrics
message NodeSummaryMetrics {
  // Number of tenants on this node (admin or filtered)
  uint32 total_tenants = 1;

  // Number of applications (filtered by tenant if auth)
  uint32 total_applications = 2;

  // Actors by type on this node
  map<string, uint32> actors_by_type = 3;
}

// Get applications request
message GetApplicationsRequest {
  // Filter by node ID (optional)
  string node_id = 1 [(buf.validate.field).string.max_len = 255];

  // Filter by tenant ID (optional, from auth context if not provided)
  string tenant_id = 2 [(buf.validate.field).string.max_len = 255];

  // Filter by namespace (optional)
  string namespace = 3 [(buf.validate.field).string.max_len = 255];

  // Filter by application name/ID pattern (optional)
  string name_pattern = 4 [(buf.validate.field).string.max_len = 512];

  // Pagination
  plexspaces.common.v1.PageRequest page = 5;
}

// Get applications response
message GetApplicationsResponse {
  repeated plexspaces.application.v1.ApplicationInfo applications = 1;
  plexspaces.common.v1.PageResponse page = 2;
}

// Get actors request
message GetActorsRequest {
  // Filter by node ID (optional)
  string node_id = 1 [(buf.validate.field).string.max_len = 255];

  // Filter by tenant ID (optional, from auth context if not provided)
  string tenant_id = 2 [(buf.validate.field).string.max_len = 255];

  // Filter by namespace (optional)
  string namespace = 3 [(buf.validate.field).string.max_len = 255];

  // Filter by actor ID pattern (optional)
  string actor_id_pattern = 4 [(buf.validate.field).string.max_len = 512];

  // Filter by actor group (optional)
  string actor_group = 5 [(buf.validate.field).string.max_len = 255];

  // Filter by actor type (optional)
  string actor_type = 6 [(buf.validate.field).string.max_len = 255];

  // Filter by status: "running" or "terminated" (optional)
  string status = 7 [(buf.validate.field).string.max_len = 50];

  // Show data since this timestamp (default: now - 24 hours)
  google.protobuf.Timestamp since = 8;

  // Pagination
  plexspaces.common.v1.PageRequest page = 9;

  // Filter by runtime behavior kind (optional)
  string behavior_kind = 10 [(buf.validate.field).string.max_len = 255];
}

// Actor info with metrics
message ActorInfo {
  option (grpc.gateway.protoc_gen_openapiv2.options.openapiv2_schema) = {
    json_schema: {
      title: "Actor Info"
      description: "Actor information with metrics"
    }
  };

  // Actor ID
  string actor_id = 1;

  // Actor type
  string actor_type = 2;

  // Actor group
  string actor_group = 3;

  // Namespace
  string namespace = 4;

  // Tenant ID
  string tenant_id = 5;

  // Node ID
  string node_id = 6;

  // Status: "running" or "terminated"
  string status = 7;

  // Actor metrics
  plexspaces.metrics.v1.ActorMetrics metrics = 8;

  // For durable actors: journal size
  uint64 journal_size_bytes = 9;

  // For durable actors: last checkpoint timestamp
  google.protobuf.Timestamp last_checkpoint = 10;

  // Created timestamp
  google.protobuf.Timestamp created_at = 11;

  // Runtime behavior kind (GenServer, GenEvent, GenStateMachine, Workflow, or custom)
  string behavior_kind = 12;
}

// Get actors response
message GetActorsResponse {
  repeated ActorInfo actors = 1;
  plexspaces.common.v1.PageResponse page = 2;
}

// Get workflows request
message GetWorkflowsRequest {
  // Filter by node ID (optional, empty = all nodes)
  string node_id = 1 [(buf.validate.field).string.max_len = 255];

  // Filter by tenant ID (optional, from auth context if not provided)
  string tenant_id = 2 [(buf.validate.field).string.max_len = 255];

  // Filter by definition ID (optional)
  string definition_id = 3 [(buf.validate.field).string.max_len = 255];

  // Filter by status (optional)
  plexspaces.workflow.v1.ExecutionStatus status = 4;

  // Pagination
  plexspaces.common.v1.PageRequest page = 5;
}

// Workflow info with view definition
message WorkflowInfo {
  option (grpc.gateway.protoc_gen_openapiv2.options.openapiv2_schema) = {
    json_schema: {
      title: "Workflow Info"
      description: "Workflow execution information"
    }
  };

  // Workflow execution
  plexspaces.workflow.v1.WorkflowExecution execution = 1;

  // Workflow definition (for view definition)
  plexspaces.workflow.v1.WorkflowDefinition definition = 2;
}

// Get workflows response
message GetWorkflowsResponse {
  repeated WorkflowInfo workflows = 1;
  plexspaces.common.v1.PageResponse page = 2;
}

// Get dependency health request
message GetDependencyHealthRequest {
  // Filter by node ID (optional, empty = all nodes)
  string node_id = 1 [(buf.validate.field).string.max_len = 255];

  // Include non-critical dependencies (default: true)
  bool include_non_critical = 2;
}

// Get dependency health response
message GetDependencyHealthResponse {
  option (grpc.gateway.protoc_gen_openapiv2.options.openapiv2_schema) = {
    json_schema: {
      title: "Dependency Health"
      description: "Health status of external dependencies"
    }
  };

  // Detailed health check with dependency breakdown
  plexspaces.system.v1.DetailedHealthCheck health_check = 1;

  // Node ID this health check is for (empty if aggregated)
  string node_id = 2;
}

// Dashboard metrics request (local node; same recorder as MetricsService gRPC).
message GetDashboardMetricsRequest {
  // Optional `namespace` label filter (application / actor namespace)
  string namespace = 1 [(buf.validate.field).string.max_len = 512];

  // Name glob; empty or "*" matches all metric names
  string name_pattern = 2 [(buf.validate.field).string.max_len = 512];

  // Additional label equality filters (AND)
  map<string, string> label_filter = 3;

  // Include metric definitions (metadata)
  bool include_definitions = 4;

  // Include full Prometheus exposition text (for Prometheus-compatible UIs)
  bool include_prometheus_text = 5;
}

message GetDashboardMetricsResponse {
  repeated plexspaces.metrics.v1.Metric metrics = 1;
  repeated plexspaces.metrics.v1.MetricDefinition definitions = 2;
  string prometheus_text = 3;
}

// ============================================================================
// OBJECT REGISTRY
// ============================================================================

message GetObjectsRequest {
  // Filter by node ID (optional, empty = local node)
  string node_id = 1 [(buf.validate.field).string.max_len = 255];

  // Filter by tenant ID (optional, from auth context if not provided)
  string tenant_id = 2 [(buf.validate.field).string.max_len = 255];

  // Filter by namespace (optional)
  string namespace = 3 [(buf.validate.field).string.max_len = 255];

  // Filter by object type string: "ACTOR", "TUPLESPACE", "SERVICE", "VM", "APPLICATION", "WORKFLOW", "NODE" (optional)
  string object_type = 4 [(buf.validate.field).string.max_len = 64];

  // Filter by health status string: "HEALTHY", "DEGRADED", "DEAD" (optional)
  string health_status = 5 [(buf.validate.field).string.max_len = 64];

  // Filter by object ID pattern (optional)
  string id_pattern = 6 [(buf.validate.field).string.max_len = 512];

  // Pagination
  plexspaces.common.v1.PageRequest page = 7;
}

message GetObjectsResponse {
  repeated plexspaces.object_registry.v1.ObjectRegistration objects = 1;
  plexspaces.common.v1.PageResponse page = 2;
}

// ============================================================================
// KEY/VALUE STORE
// ============================================================================

message GetKeyValuesRequest {
  // Filter by node ID (optional, empty = local node)
  string node_id = 1 [(buf.validate.field).string.max_len = 255];

  // Filter by tenant ID (optional, from auth context if not provided)
  string tenant_id = 2 [(buf.validate.field).string.max_len = 255];

  // Filter by namespace (optional)
  string namespace = 3 [(buf.validate.field).string.max_len = 255];

  // Key prefix filter (optional)
  string prefix = 4 [(buf.validate.field).string.max_len = 512];

  // Pagination
  plexspaces.common.v1.PageRequest page = 5;
}

// Lightweight KV entry for dashboard display (value truncated for safety)
message KeyValueDashboardEntry {
  // The key
  string key = 1;

  // Value preview (first 100 UTF-8 bytes)
  string value_preview = 2;

  // Full value size in bytes
  uint64 size_bytes = 3;
}

message GetKeyValuesResponse {
  repeated KeyValueDashboardEntry entries = 1;
  plexspaces.common.v1.PageResponse page = 2;
}

// ============================================================================
// TUPLESPACE
// ============================================================================

message GetTupleSpacesRequest {
  // Filter by node ID (optional, empty = local node)
  string node_id = 1 [(buf.validate.field).string.max_len = 255];

  // Filter by tenant ID (optional, from auth context if not provided)
  string tenant_id = 2 [(buf.validate.field).string.max_len = 255];

  // Filter by namespace (optional)
  string namespace = 3 [(buf.validate.field).string.max_len = 255];

  // Optional pattern string to match against tuples (default: wildcard)
  string pattern = 4 [(buf.validate.field).string.max_len = 512];
}

// Summary of a tuplespace namespace
message TupleSpaceSummary {
  // Namespace this summary is for
  string namespace = 1;

  // Pattern used for counting (empty = wildcard)
  string pattern = 2;

  // Total tuple count matching the pattern
  uint64 tuple_count = 3;

  // Sample tuples (up to 20)
  repeated plexspaces.tuplespace.v1.Tuple sample_tuples = 4;
}

message GetTupleSpacesResponse {
  repeated TupleSpaceSummary spaces = 1;
}

// ============================================================================
// BLOB STORAGE
// ============================================================================

message GetBlobsRequest {
  // Filter by node ID (optional, empty = local node)
  string node_id = 1 [(buf.validate.field).string.max_len = 255];

  // Filter by tenant ID (optional, from auth context if not provided)
  string tenant_id = 2 [(buf.validate.field).string.max_len = 255];

  // Filter by namespace (optional)
  string namespace = 3 [(buf.validate.field).string.max_len = 255];

  // Filter by blob kind (optional)
  string kind = 4 [(buf.validate.field).string.max_len = 255];

  // Filter by blob name prefix (optional)
  string prefix = 5 [(buf.validate.field).string.max_len = 512];

  // Pagination
  plexspaces.common.v1.PageRequest page = 6;
}

message GetBlobsResponse {
  // Reuses existing BlobMetadata proto from storage package
  repeated plexspaces.storage.v1.BlobMetadata blobs = 1;
  plexspaces.common.v1.PageResponse page = 2;
}

message GetBlobPresignedUrlRequest {
  // Blob ID (required)
  string blob_id = 1 [
    (google.api.field_behavior) = REQUIRED,
    (buf.validate.field).string = {min_len: 1, max_len: 255}
  ];

  // Node ID where the blob lives (optional, empty = local node)
  string node_id = 2 [(buf.validate.field).string.max_len = 255];

  // Tenant ID for authorization (optional, from auth context if not provided)
  string tenant_id = 3 [(buf.validate.field).string.max_len = 255];

  // Namespace for authorization (optional)
  string namespace = 4 [(buf.validate.field).string.max_len = 255];
}

message GetBlobPresignedUrlResponse {
  // Presigned download URL (empty if not available)
  string url = 1;

  // URL expiration timestamp
  google.protobuf.Timestamp expires_at = 2;

  // Error message if presigned URLs are not configured or blob not found
  string error = 3;
}

// ============================================================================
// SERVICE LINKS
// ============================================================================

message GetServiceLinksRequest {
  // Node ID (optional, empty = local node)
  string node_id = 1 [(buf.validate.field).string.max_len = 255];

  // Tenant ID (optional, used for filtering if auth enabled)
  string tenant_id = 2 [(buf.validate.field).string.max_len = 255];
}

message GetServiceLinksResponse {
  // Reuses existing ServiceLinkConfig proto from node/outbound package
  repeated plexspaces.node.v1.ServiceLinkConfig service_links = 1;
}

// ============================================================================
// METRICS TABLE
// ============================================================================

message GetMetricsTableRequest {
  // Node ID (optional, empty = local node)
  string node_id = 1 [(buf.validate.field).string.max_len = 255];

  // Optional namespace label filter
  string namespace = 2 [(buf.validate.field).string.max_len = 512];

  // Name glob; empty or "*" matches all metric names
  string name_pattern = 3 [(buf.validate.field).string.max_len = 512];

  // Additional label equality filters (AND)
  map<string, string> label_filter = 4;
}

message GetMetricsTableResponse {
  // All matching metrics with current values
  repeated plexspaces.metrics.v1.Metric metrics = 1;

  // Metric definitions (metadata: description, unit, type)
  repeated plexspaces.metrics.v1.MetricDefinition definitions = 2;
}
