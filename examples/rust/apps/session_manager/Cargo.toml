# Session manager — Rust WASM (SDK + WIT)
#
# Idle + heartbeat via `host::send_after`. Native TimerFacet demo: previous `src/main.rs`
# replaced by this crate; for node-local TimerFacet + spawn, see git history or embedded examples.

[workspace]

[package]
name = "session-manager-wasm"
version = "0.1.0"
edition = "2021"
license = "AGPL-3.0-or-later"
publish = false
description = "Session idle + heartbeat WASM actor (send_after + metrics)"

[lib]
crate-type = ["cdylib"]

[dependencies]
plexspaces-proto = { path = "../../../../crates/proto", default-features = false }
plexspaces-sdk = { path = "../../../../sdks/rust/plexspaces-sdk", default-features = false }
prost = "0.12"
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
wit-bindgen = "0.51.0"

[profile.release]
opt-level = "z"
lto = true
codegen-units = 1
strip = true
