[package]
name = "supervision_tree"
version = "0.1.0"
edition = "2021"
publish = false

[workspace]

[[bin]]
name = "supervision_tree"
path = "src/main.rs"

[dependencies]
# PlexSpaces SDK (includes core, actor, macros)
plexspaces-sdk = { path = "../../../../sdks/rust/plexspaces-sdk" }
plexspaces-core = { path = "../../../../crates/core" }  # Required for macro-generated code
plexspaces-actor = { path = "../../../../crates/actor" }
plexspaces-behavior = { path = "../../../../crates/behavior" }
plexspaces-mailbox = { path = "../../../../crates/mailbox" }
plexspaces-node = { path = "../../../../crates/node" }

# Async runtime
tokio = { version = "1", features = ["full"] }

# Serialization
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"

# Utilities
ulid = "1.1"

# Logging
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }
