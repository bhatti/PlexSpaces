# EFlows4HPC Ensemble - Rust WASM app
#
# Builds a WASM component compatible with plexspaces-simple-actor (init/handle/get-state/set-state).
# Uses tuple space (ts_write, ts_take, ts_read_all) and process group (pg_join, pg_broadcast).
# Build: ./build.sh (cargo build --target wasm32-wasip1 then wasm-tools component embed + new).
#
# Facets: virtual_actor + durability (app-config.toml).

[workspace]

[package]
name = "migrating-eflows4hpc-wasm"
version = "0.1.0"
edition = "2021"
license = "LGPL-2.1-or-later"
publish = false
description = "HPC Ensemble WASM actor (EFlows4HPC-style, tuple space + process group)"

[lib]
crate-type = ["cdylib"]

[dependencies]
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"

[profile.release]
opt-level = "z"
lto = true
codegen-units = 1
strip = true
