# Merlin parameter sweep - Rust WASM app
#
# Builds a WASM component compatible with plexspaces-simple-actor.
# Uses tuple space (ts_write, ts_take, ts_read_all), process group (pg_join, pg_broadcast),
# and elastic pool (pool_checkout, pool_checkin) with fallback to PG.
# Build: ./build.sh (cargo build --target wasm32-wasip1 then wasm-tools component embed + new).

[workspace]

[package]
name = "migrating-merlin-wasm"
version = "0.1.0"
edition = "2021"
license = "LGPL-2.1-or-later"
publish = false
description = "Merlin parameter sweep WASM actor (pool + tuple space; fallback: process group)"

[lib]
crate-type = ["cdylib"]

[dependencies]
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"

[profile.release]
opt-level = "z"
lto = true
codegen-units = 1
strip = true
