# Cloudflare Workers Guild Chat Application Configuration
#
# Deploys a Discord-style chat server with three Durable Object actors:
# - ChatRoomActor: per-room state, members, message history, real fan-out
# - RateLimiterActor: per-user token bucket spam prevention (distributed KV increment)
# - AlarmDemoActor: durable alarm / batch processing (DO alarm() equivalent)
#
# Equivalent to a Cloudflare Workers wrangler.toml with:
#   [[durable_objects.bindings]]
#   name = "CHAT_ROOM"
#   class_name = "ChatRoom"
#
#   [[durable_objects.bindings]]
#   name = "RATE_LIMITER"
#   class_name = "RateLimiter"
#
#   [[durable_objects.bindings]]
#   name = "ALARM_DEMO"
#   class_name = "AlarmDemo"

tenant_id = "default"

[supervisor]
strategy = "one_for_one"
max_restarts = 10
max_restart_window_seconds = 60

# ChatRoom actor (Durable Object: one per room)
[[supervisor.children]]
name = "ChatRoomActor"
tenant_id = "default"
actor_type = "ChatRoomActor"
restart = "permanent"
shutdown_timeout_seconds = 10
behavior_kind = "GenServer"
facets = [
  { type = "virtual_actor", priority = 100, config = { idle_timeout = "1h", activation_strategy = "lazy" } }
]

[supervisor.children.args]
max_history = "100"

# RateLimiter actor (Durable Object: per-user rate limiting)
[[supervisor.children]]
name = "RateLimiterActor"
actor_type = "RateLimiterActor"
restart = "permanent"
shutdown_timeout_seconds = 5
behavior_kind = "GenServer"
facets = [
  { type = "virtual_actor", priority = 100, config = { idle_timeout = "1h", activation_strategy = "lazy" } }
]

[supervisor.children.args]
max_tokens = "5"
refill_rate_ms = "1000"
tenant_id = "default"

# AlarmDemo actor (Durable Object alarm() API — batch/deferred processing)
[[supervisor.children]]
name = "AlarmDemoActor"
actor_type = "AlarmDemoActor"
restart = "permanent"
shutdown_timeout_seconds = 5
behavior_kind = "GenServer"
facets = [
  { type = "virtual_actor", priority = 100, config = { idle_timeout = "1h", activation_strategy = "lazy" } },
  { type = "reminder", priority = 90, config = {} }
]

[supervisor.children.args]
tenant_id = "default"
