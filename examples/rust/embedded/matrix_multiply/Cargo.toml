[package]
name = "matrix_multiply"
version = "0.1.0"
edition = "2021"
publish = false

[workspace]

[lib]
name = "matrix_multiply"
path = "src/lib.rs"

[[bin]]
name = "matrix_multiply"
path = "src/main.rs"

[dependencies]
# PlexSpaces SDK
plexspaces-sdk = { path = "../../../../sdks/rust/plexspaces-sdk", features = ["native"] }
plexspaces-actor = { path = "../../../../crates/actor" }
plexspaces-behavior = { path = "../../../../crates/behavior" }
plexspaces-mailbox = { path = "../../../../crates/mailbox" }
plexspaces-node = { path = "../../../../crates/node" }

# Async runtime
tokio = { version = "1", features = ["full"] }

# Serialization
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"

# Utilities
anyhow = "1.0"

# Logging
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }
