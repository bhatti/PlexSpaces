[workspace]

[package]
name = "temporal-comparison"
version = "0.1.0"
edition = "2021"
publish = false
license = "AGPL-3.0-or-later"
default-run = "temporal-comparison"
description = "Temporal-style durable workflow comparison (embedded)"

[dependencies]
plexspaces-actor = { path = "../../../../crates/actor" }
plexspaces-actor = { path = "../../../../crates/actor" }
plexspaces-behavior = { path = "../../../../crates/behavior" }
plexspaces-journaling = { path = "../../../../crates/journaling", features = ["sqlite-backend"] }
plexspaces-sdk = { git = "https://github.com/bhatti/plexspaces", tag = "v0.1.1" }
plexspaces-node = { path = "../../../../crates/node" }
tokio = { version = "1.44", features = ["full"] }
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
ulid = { version = "1.1", features = ["serde"] }
tracing = "0.1"
tracing-subscriber = "0.3"
async-trait = "0.1"

[[bin]]
name = "temporal-comparison"
path = "src/main.rs"

[features]
default = []
sqlite-backend = ["plexspaces-journaling/sqlite-backend"]
