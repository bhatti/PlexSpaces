//
// execution_trace.proto — generic execution trace for actors and workflows.
//
// This is a GENERAL-PURPOSE primitive: it captures the ordered sequence of
// steps taken by any actor (workflows, sagas, pipelines, agents) with timing,
// labels, and outcome. It does not embed agent-specific semantics (OODA, LLM,
// tokens) at this layer; those are caller-supplied metadata.
//
// Usage pattern:
//   - Declare facets = ["execution_trace"] in app-config.toml on any actor
//   - The ExecutionTraceFacet records a TraceStep for every before/after_method
//     pair, capturing real wall-clock duration and success/failure
//   - On actor termination the completed ExecutionTrace is written to KV:
//       key: "trace:{trace_id}"
//       index: "trace_index:{actor_id}" → append trace_id
//   - Callers retrieve traces by actor_id or directly by trace_id

syntax = "proto3";

package plexspaces.v1;

option go_package = "github.com/plexobject/plexspaces/gen/go/v1;plexspacesv1";
option java_package = "com.plexspaces.v1";
option java_outer_classname = "ExecutionTraceProto";

// A single step within an execution trace.
//
// Recorded by ExecutionTraceFacet for every method call on the actor.
// The `label` field lets callers attach semantic meaning (e.g. "observe",
// "orient", "decide", "act" for agents; "validate", "charge", "notify"
// for payment flows) without baking that vocabulary into the framework.
message TraceStep {
  // Unique step ID (ULID — lexicographically sortable)
  string step_id = 1;

  // Method name that was called on the actor
  string method = 2;

  // Caller-supplied semantic label (optional).
  // Set via message header "x-trace-label". Defaults to method name.
  string label = 3;

  // Input bytes (serialised args). Empty when include_payloads = false.
  bytes input = 4;

  // Output bytes (serialised result). Empty when include_payloads = false.
  bytes output = 5;

  // Wall-clock timestamp when the method started (ms since epoch)
  int64 started_at_ms = 6;

  // Wall-clock timestamp when the method completed (ms since epoch)
  int64 completed_at_ms = 7;

  // Whether the method completed without error
  bool success = 8;

  // Error message if success = false
  string error = 9;

  // Arbitrary key-value metadata (e.g. token counts, model name for agents)
  map<string, string> metadata = 10;
}

// A complete execution trace for one actor lifecycle or workflow run.
//
// Produced by ExecutionTraceFacet on actor termination. Written to KV
// storage under "trace:{trace_id}" by the KvTraceExporter.
message ExecutionTrace {
  // Unique trace ID (ULID)
  string trace_id = 1;

  // Actor that produced this trace
  string actor_id = 2;

  // Ordered steps, in method-invocation order
  repeated TraceStep steps = 3;

  // Outcome of the actor's lifecycle:
  //   "completed" — Normal or Shutdown termination
  //   "error"     — Error(msg) exit reason
  //   "killed"    — forceful kill
  //   "timeout"   — timeout kill
  string outcome = 4;

  // Human-readable detail about the outcome (e.g. error message)
  string outcome_detail = 5;

  // Wall-clock timestamp when tracing started (on_attach)
  int64 started_at_ms = 6;

  // Wall-clock timestamp when trace was finalised (on_terminate_start)
  int64 completed_at_ms = 7;

  // Arbitrary key-value metadata (e.g. eval_run_id, scenario_id for eval pipelines)
  map<string, string> metadata = 8;
}

// Configuration for the SchemaValidationFacet.
//
// Attached to any actor to validate handler input schemas at the
// infrastructure layer — before the actor sees the message.
message SchemaValidationFacetConfig {
  // Validation mode
  //   "strict"      — reject and return error on schema mismatch (default)
  //   "warn"        — log warning and pass through
  //   "permissive"  — always pass through (schema is informational only)
  string validation_mode = 1;

  // Map from method name to JSON Schema string (JSON-serialised object).
  // Example: {"transfer": "{\"type\":\"object\",\"required\":[\"amount\"]}"}
  map<string, string> method_schemas = 2;
}

// Configuration for the ExecutionTraceFacet.
message ExecutionTraceFacetConfig {
  // Whether to include full input/output payloads in each step.
  // Set false for high-throughput actors where payload size is large.
  bool include_payloads = 1;

  // Maximum number of steps to retain per trace.
  // Steps beyond this cap are silently dropped. Default: 1000.
  uint32 max_steps = 2;

  // Maximum number of completed traces retained in memory by the facet.
  // Oldest trace evicted when limit is reached. Default: 10.
  uint32 max_retained_traces = 3;
}
