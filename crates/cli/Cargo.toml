[package]
name = "plexspaces-cli"
version.workspace = true
authors.workspace = true
edition.workspace = true
license.workspace = true
description = "CLI tool for PlexSpaces framework management"

[dependencies]
plexspaces-proto = { workspace = true }
plexspaces-firecracker = { workspace = true, optional = true }
plexspaces-node = { workspace = true }
plexspaces-common = { path = "../common" }
plexspaces-services = { path = "../services" }
tonic = { workspace = true }
tokio = { workspace = true }
clap = { version = "4.4", features = ["derive", "env"] }
serde = { workspace = true }
serde_json = { workspace = true }
serde_yaml = "0.9"
anyhow = "1.0"
bytes = "1.5"
tracing = { workspace = true }
tracing-subscriber = { workspace = true }
reqwest = { version = "0.12", features = ["multipart", "json"] }
rcgen = "0.13"
chrono = { workspace = true }
time = "0.3"
jsonwebtoken = "9.3"

[[bin]]
name = "plexspaces"
path = "src/main.rs"

[lib]
name = "plexspaces_cli"
path = "src/lib.rs"

[dev-dependencies]
tempfile = "3.8"

[features]
default = []
firecracker = ["plexspaces-node/firecracker", "dep:plexspaces-firecracker"]
