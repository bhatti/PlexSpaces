# Session Manager App - Real-world timer example (idle timeout, heartbeat)
#
# Deployable under examples/rust/apps/ (future: WASM like TypeScript apps).
# Build and test with debug: cargo build && cargo run (see scripts/test.sh).

[workspace]

[package]
name = "session-manager"
version = "0.1.0"
edition = "2021"
publish = false
description = "Session manager with idle timeout and heartbeat (TimerFacet)"

[[bin]]
name = "session_manager"
path = "src/main.rs"

[dependencies]
plexspaces-sdk = { path = "../../../../sdks/rust/plexspaces-sdk" }
plexspaces-core = { path = "../../../../crates/core" }
plexspaces-journaling = { path = "../../../../crates/journaling" }
plexspaces-proto = { path = "../../../../crates/proto" }

tokio = { version = "1", features = ["full"] }
async-trait = "0.1"
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }
