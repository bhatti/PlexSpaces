# Cloudflare Workers Guild Chat — Rust WASM (SDK + WIT)

[workspace]

[package]
name = "guild-chat-wasm"
version = "0.1.0"
edition = "2021"
license = "AGPL-3.0-or-later"
publish = false
description = "Cloudflare Workers Durable Objects pattern: ChatRoom + RateLimiter + AlarmDemo (Rust WASM)"

[lib]
crate-type = ["cdylib"]

[dependencies]
plexspaces-sdk = { path = "../../../../sdks/rust/plexspaces-sdk", default-features = false }
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
wit-bindgen = "0.51.0"

[profile.release]
opt-level = "z"
lto = true
codegen-units = 1
strip = true
