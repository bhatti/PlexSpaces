[package]
name = "plexspaces-channel"
version.workspace = true
authors.workspace = true
edition.workspace = true
license.workspace = true
repository.workspace = true
keywords.workspace = true
categories.workspace = true
description = "Extensible channel/queue abstraction for PlexSpaces microservices"

[dependencies]
# Channel depends on proto for message definitions
plexspaces-proto = { workspace = true }

# Core dependencies
tokio = { workspace = true }
async-trait = { workspace = true }
anyhow = { workspace = true }
thiserror = { workspace = true }
tracing = { workspace = true }
serde = { workspace = true }
serde_json = { workspace = true }
ulid = { version = "1.1", features = ["serde"] }

# Proto conversion
prost = { workspace = true }
prost-types = { workspace = true }
chrono = { workspace = true }

# For InMemory backend (MPSC channels)
futures = { workspace = true }
async-stream = { version = "0.3" }

# Optional: Redis backend (feature-gated)
redis = { workspace = true, optional = true }
base64 = { version = "0.21", optional = true }

# Optional: Kafka backend (feature-gated)
rdkafka = { version = "0.36", optional = true }

# Optional: NATS backend (feature-gated)
async-nats = { version = "0.45", optional = true }

# Optional: SQLite backend (feature-gated, for testing durability)
sqlx = { version = "0.7", features = ["runtime-tokio-native-tls", "sqlite", "migrate"], optional = true }

# Optional: UDP backend (feature-gated, for multicast pub/sub)
socket2 = { version = "0.5", optional = true }

# Optional: AWS SQS backend (feature-gated)
aws-sdk-sqs = { version = "1", optional = true }
aws-config = { version = "1", optional = true }
plexspaces-common = { path = "../common", optional = true }
metrics = { version = "0.23", optional = true }

# Optional: Process Group backend (for Erlang pg/pg2-style pub/sub)
plexspaces-core = { path = "../core", optional = true }

[dev-dependencies]
tokio-test = { version = "0.4" }
pretty_assertions = { version = "1.4" }
tempfile = { workspace = true }
tonic = { workspace = true }
plexspaces-core = { workspace = true }
plexspaces-locks = { workspace = true }
ulid = { workspace = true }
[features]
default = []
redis-backend = ["redis", "base64"]
kafka-backend = ["rdkafka"]
nats-backend = ["async-nats"]
sqlite-backend = ["sqlx"]
udp-backend = ["socket2"]
# `plexspaces-common/test-helpers` provides TCP runtime checks for LocalStack (same pattern as DDB tests).
sqs-backend = [
    "aws-sdk-sqs",
    "aws-config",
    "plexspaces-common",
    "plexspaces-common/test-helpers",
    "metrics",
    "base64",
]
process-group-backend = ["plexspaces-core", "metrics"]
test-helpers = ["plexspaces-common/test-helpers"]
test-utils = []  # Enable mock_backend for integration tests

[lib]
name = "plexspaces_channel"
path = "src/lib.rs"
