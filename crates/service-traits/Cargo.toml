[package]
name = "plexspaces-service-traits"
version.workspace = true
authors.workspace = true
edition.workspace = true
license.workspace = true
description = "Core service traits for PlexSpaces — shared between actor and journaling crates to break circular dependencies"

[dependencies]
plexspaces-proto = { path = "../proto" }
plexspaces-common = { path = "../common" }
plexspaces-facet = { path = "../facet" }
plexspaces-locks = { path = "../locks" }
plexspaces-tuplespace = { path = "../tuplespace" }
async-trait = { workspace = true }
thiserror = { workspace = true }
tokio = { workspace = true }
futures = { workspace = true }
tonic = { workspace = true }
ulid = { workspace = true }
serde = { workspace = true }
tracing = { workspace = true }
prost = { workspace = true }
prost-types = { workspace = true }
once_cell = "1.19"

[lib]
name = "plexspaces_service_traits"
path = "src/lib.rs"
