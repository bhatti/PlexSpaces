# Bank Accounts Application Configuration (TypeScript)
# Same layout as Python bank_account: 3 accounts under a supervisor.

tenant_id = "default"

[supervisor]
strategy = "one_for_one"
max_restarts = 10
max_restart_window_seconds = 60

[[supervisor.children]]
name = "account-alice"
tenant_id = "default"
actor_type = "bank_account_wasm"
role = "account-alice"
restart = "permanent"
shutdown_timeout_seconds = 5
behavior_kind = "GenServer"
facets = [
  { type = "virtual_actor", priority = 100, config = { idle_timeout = "1h", activation_strategy = "lazy" } }
]
[[supervisor.children]]
name = "account-bob"
actor_type = "bank_account_wasm"
role = "account-bob"
restart = "permanent"
shutdown_timeout_seconds = 5
behavior_kind = "GenServer"
facets = [
  { type = "virtual_actor", priority = 100, config = { idle_timeout = "1h", activation_strategy = "lazy" } }
]
[[supervisor.children]]
name = "account-charlie"
actor_type = "bank_account_wasm"
role = "account-charlie"
restart = "permanent"
shutdown_timeout_seconds = 5
behavior_kind = "GenServer"
facets = [
  { type = "virtual_actor", priority = 100, config = { idle_timeout = "1h", activation_strategy = "lazy" } }
]
tenant_id = "default"
