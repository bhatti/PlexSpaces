[package]
name = "plexspaces-facet"
version.workspace = true
authors.workspace = true
edition.workspace = true
license.workspace = true
repository.workspace = true
keywords.workspace = true
categories.workspace = true
description = "Dynamic behavior composition via facets"

[dependencies]
# Facet has minimal dependencies
plexspaces-proto = { workspace = true }

# Note: plexspaces-core dependency removed to break circular dependency
# Service trait implementation moved to core::facet_service_wrapper
# Factories that need ServiceLocator are created in actor crate (which has both dependencies)
# ServiceLocator is passed as trait object from actor crate

# Core dependencies
tokio = { workspace = true }
async-trait = { workspace = true }
anyhow = { workspace = true }
thiserror = { workspace = true }
tracing = { workspace = true }
serde = { workspace = true }
serde_json = { workspace = true }
chrono = { workspace = true }
hex = "0.4"

# Observability (CRITICAL - production-ready observability)
metrics = "0.23"

# RequestContext is required for KeyValueStore trait
plexspaces-common = { path = "../common" }

# AWS DynamoDB backend for KeyValueStore (optional)
aws-sdk-dynamodb = { version = "1", optional = true }
aws-config = { version = "1", optional = true }

[features]
default = []
# service feature removed - Service trait implementation moved to core crate
ddb-backend = ["aws-sdk-dynamodb", "aws-config"]

[dev-dependencies]
tokio-test = { version = "0.4" }
pretty_assertions = { version = "1.4" }
tracing-subscriber = { version = "0.3", features = ["env-filter"] }
# Test helpers for checking DynamoDB Local availability
plexspaces-common = { path = "../common", features = ["test-helpers"] }
# Integration test dependencies
plexspaces-actor = { path = "../actor" }
plexspaces-core = { workspace = true }
plexspaces-mailbox = { workspace = true }
plexspaces-node = { path = "../node" }
plexspaces-locks = { path = "../locks", features = ["sqlite-backend"] }
plexspaces-application = { path = "../application" }
plexspaces-services = { path = "../services" }
plexspaces-proto = { workspace = true }
ulid = "1.1"

[lib]
name = "plexspaces_facet"
path = "src/lib.rs"
