name = "python-parallel-ai-inference"
version = "1.0.0"
namespace = "python-parallel-ai-inference"
seed_nodes = ["localhost:8091", "localhost:8093"]

[supervisor]
strategy = "one_for_one"
max_restarts = 10
max_restart_window_seconds = 60

[[supervisor.children]]
name = "inference_worker"
actor_type = "parallel_ai_inference_wasm"
role = "inference_worker"
restart = "permanent"
shutdown_timeout_seconds = 10
behavior_kind = "GenServer"
args = { role = "inference_worker", model_type = "small" }
facets = [
  { type = "virtual_actor", priority = 100, config = { idle_timeout = "10m", activation_strategy = "lazy" } },
  { type = "durability", priority = 90, config = { checkpoint_interval = 10 } },
  { type = "metrics", priority = 80 }
]

[[supervisor.children]]
name = "benchmark"
actor_type = "parallel_ai_inference_wasm"
role = "benchmark"
restart = "permanent"
shutdown_timeout_seconds = 30
behavior_kind = "GenServer"
args = { role = "benchmark" }
facets = [
  { type = "virtual_actor", priority = 100, config = { idle_timeout = "30m", activation_strategy = "lazy" } },
  { type = "durability", priority = 90, config = { checkpoint_interval = 5 } }
]

[[supervisor.children]]
name = "orchestrator"
actor_type = "parallel_ai_inference_wasm"
role = "orchestrator"
restart = "permanent"
shutdown_timeout_seconds = 60
behavior_kind = "Workflow"
args = { role = "orchestrator" }
facets = [
  { type = "virtual_actor", priority = 100, config = { idle_timeout = "10m", activation_strategy = "lazy" } },
  { type = "durability", priority = 90, config = { checkpoint_interval = 5 } },
  { type = "timer", priority = 70, config = { interval_ms = 30000 } }
]

[[supervisor.children]]
name = "metrics_event"
actor_type = "parallel_ai_inference_wasm"
role = "metrics_event"
restart = "permanent"
shutdown_timeout_seconds = 5
behavior_kind = "GenEvent"
args = { role = "metrics_event" }
facets = [
  { type = "virtual_actor", priority = 100, config = { idle_timeout = "10m", activation_strategy = "lazy" } }
]

[[supervisor.children]]
name = "circuit_breaker"
actor_type = "parallel_ai_inference_wasm"
role = "circuit_breaker"
restart = "permanent"
shutdown_timeout_seconds = 5
behavior_kind = "GenFSM"
args = { role = "circuit_breaker", threshold = "3" }
facets = [
  { type = "virtual_actor", priority = 100, config = { idle_timeout = "30m", activation_strategy = "lazy" } },
  { type = "durability", priority = 90, config = { checkpoint_interval = 1 } },
  { type = "timer", priority = 70 }
]
