name = "python-parameter-server"
version = "1.0.0"
namespace = "python-parameter-server"
seed_nodes = ["localhost:8091", "localhost:8093"]

[supervisor]
strategy = "one_for_one"
max_restarts = 10
max_restart_window_seconds = 60

[[supervisor.children]]
name = "leader"
actor_type = "Leader"
restart = "permanent"
shutdown_timeout_seconds = 10

[supervisor.children.args]
num_workers = "4"
learning_rate = "0.01"
input_dim = "100"
hidden_dim = "64"

[[supervisor.children]]
name = "worker"
actor_type = "Worker"
restart = "permanent"
shutdown_timeout_seconds = 5
