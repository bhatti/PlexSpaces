# PlexSpaces Release Configuration - Auth enabled (for e2e testing)
# Use with: PLEXSPACES_JWT_SECRET=your-secret target/debug/plexspaces start --release-config release-auth.yaml ...

name: my-cluster
version: 1.0.0
description: "PlexSpaces release for node my-node (auth enabled)"

node:
  id: my-node
  listen_addr: 0.0.0.0:8093
  cluster_seed_nodes: []
  wasm_apps_directory: "/app/wasm"

runtime:
  db:
    connection_string: "sqlite:///tmp/plexspaces-my-node-auth.db?mode=rwc"
    pool_size: 10
    auto_migrate: true

  grpc:
    enabled: true
    address: 0.0.0.0:8093
    max_connections: 100
    keepalive_interval_seconds: 30
    middleware: []
  
  # Blob storage configuration for local development.
  # Uses local filesystem backend; set backend: embedded for auto-started embedded object store.
  blob:
    backend: local
    bucket: plexspaces-blobs
    endpoint: ""
    region: ""
    access_key_id: ""
    secret_access_key: ""
    use_ssl: false
    prefix: "/tmp/plexspaces-blobs-auth"
  
  health:
    heartbeat_interval_seconds: 5
    heartbeat_timeout_seconds: 30
    registry_url: ""
  
  security:
    jwt:
      enable_jwt: true
      secret: ""  # Set via PLEXSPACES_JWT_SECRET env var
      issuer: ""
      jwks_url: ""
      allowed_audiences:
        - "plexspaces-api"
      tenant_id_claim: "tenant_id"
      user_id_claim: "sub"
    
    mtls:
      enable_mtls: true
      auto_generate_certs: true
      cert_dir: "./certs"
    
    disable_auth: false

system_applications: []

applications: []

env: {}

shutdown:
  graceful_timeout_seconds: 30
  force_timeout_seconds: 10
