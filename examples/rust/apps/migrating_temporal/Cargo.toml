# Order Fulfillment Workflow - Rust WASM app (Temporal-style)
#
# Builds a WASM component compatible with plexspaces-simple-actor (init/handle/get-state/set-state).
# Uses the same component ABI as Go: export names and cabi_realloc.
# Build: ./build.sh (cargo build --target wasm32-wasip2 then wasm-tools component embed + new).
#
# Facets: virtual_actor + durability (configured in app-config.toml).
# Standalone crate (not part of root workspace).

[workspace]

[package]
name = "migrating-temporal-wasm"
version = "0.1.0"
edition = "2021"
license = "LGPL-2.1-or-later"
publish = false
description = "Order fulfillment workflow WASM actor (Temporal-style run/signal/query)"

[lib]
crate-type = ["cdylib"]

[dependencies]
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"

[profile.release]
opt-level = "z"
lto = true
codegen-units = 1
strip = true
