name = "rust-log-pipeline"
version = "1.0.0"
tenant_id = "default"
seed_nodes = ["localhost:8091", "localhost:8094"]

[supervisor]
strategy = "one_for_one"
max_restarts = 10
max_restart_window_seconds = 60

[[supervisor.children]]
name = "leader"
actor_type = "log_pipeline_wasm"
role = "leader"
restart = "permanent"
shutdown_timeout_seconds = 30
behavior_kind = "GenServer"

[supervisor.children.args]
role = "leader"

[[supervisor.children]]
name = "worker"
actor_type = "log_pipeline_wasm"
role = "worker"
restart = "permanent"
shutdown_timeout_seconds = 10
behavior_kind = "GenServer"

[supervisor.children.args]
role = "worker"
pipeline_functions = "json_parse,mask_pii,enrich,rename_fields,drop"
tenant_id = "default"
