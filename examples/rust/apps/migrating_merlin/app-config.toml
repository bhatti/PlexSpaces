# Merlin → PlexSpaces: Parameter sweep (worker pool, elastic size)
# Convention: sweep:coord-1 = coordinator; sweep:worker-0, worker-1, ... = pool workers.
# Elastic pool (merlin-workers) + tuple space; fallback: process group.

tenant_id = "default"

[supervisor]
strategy = "one_for_one"
max_restarts = 10
max_restart_window_seconds = 60

[[supervisor.children]]
name = "sweep"
tenant_id = "default"
actor_type = "migrating_merlin_wasm"
role = "worker"
restart = "permanent"
shutdown_timeout_seconds = 10
behavior_kind = "Workflow"
facets = [
  { type = "virtual_actor", priority = 100, config = { idle_timeout = "10m", activation_strategy = "lazy" } },
  { type = "durability", priority = 90, config = { checkpoint_interval = 100 } }
]
