[package]
name = "plexspaces-scheduler"
version = "0.1.0"
edition = "2021"
license = "AGPL-3.0-or-later"
description = "Resource-aware scheduling service for PlexSpaces"
authors = ["Shahzad A. Bhatti <bhatti@plexobject.com>"]

[dependencies]
# PlexSpaces crates
plexspaces-proto = { path = "../proto" }
plexspaces-locks = { path = "../locks" }
plexspaces-actor = { path = "../actor" }
plexspaces-common = { path = "../common" }
plexspaces-object-registry = { path = "../object-registry" }
plexspaces-channel = { path = "../channel" }
plexspaces-keyvalue = { path = "../keyvalue" }

# Async runtime
tokio = { workspace = true }
async-trait = { workspace = true }

# gRPC
tonic = { workspace = true }
prost = { workspace = true }
prost-types = { workspace = true }
base64 = "0.22"

# Serialization
serde = { workspace = true }
serde_json = { workspace = true }

# Error handling
thiserror = { workspace = true }

# Utilities
ulid = { workspace = true }
tracing = { workspace = true }
chrono = { workspace = true }
futures = { workspace = true }
rand = "0.8"
metrics = "0.23"

# Database backends (all optional)
sqlx = { workspace = true, optional = true }
redis = { version = "0.24", features = ["tokio-comp", "connection-manager"], optional = true }
aws-sdk-dynamodb = { version = "1", optional = true }
aws-config = { version = "1", optional = true }

[features]
default = ["sqlite-backend"]

# Backend features
postgres-backend = ["sqlx", "sqlx/postgres"]
redis-backend = ["redis"]
sqlite-backend = ["sqlx", "sqlx/sqlite"]
ddb-backend = ["aws-sdk-dynamodb", "aws-config"]

# All backends
all-backends = ["postgres-backend", "redis-backend", "sqlite-backend", "ddb-backend"]

[dev-dependencies]
tokio-test = "0.4"
anyhow = { workspace = true }
env_logger = { workspace = true }
serial_test = "3.0"
