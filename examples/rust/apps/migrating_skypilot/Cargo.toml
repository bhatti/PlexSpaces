# SkyPilot multi-cloud ML orchestration — Rust WASM (SDK + WIT)

[workspace]

[package]
name = "migrating-skypilot-wasm"
version = "0.1.0"
edition = "2021"
license = "AGPL-3.0-or-later"
publish = false
description = "SkyPilot multi-cloud ML orchestration WASM actor (GenServer-style ops)"

[lib]
crate-type = ["cdylib"]

[dependencies]
plexspaces-proto = { git = "https://github.com/bhatti/plexspaces", tag = "v0.1.1", default-features = false }
plexspaces-sdk   = { git = "https://github.com/bhatti/plexspaces", tag = "v0.1.1", default-features = false }
prost            = "0.13"
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
wit-bindgen = "0.51.0"

[profile.release]
opt-level = "z"
lto = true
codegen-units = 1
strip = true
